name: Tests

# web/tests/ ran on no schedule and in no workflow. Twenty-six test files,
# 296 assertions, every one of them written because a wrong fact reached a
# real listing — and nothing executed them between a commit and a deploy. The
# only thing standing between a red test and production was whether someone
# happened to run it by hand.
#
# Two were red on main when this workflow was written (2026-08-30), and the
# way they got there is the whole argument for this file. Commit 8424dde
# (2026-08-26) split the Cadillac Lyriq-V and Vistiq rows at the 2027
# charge-port boundary, because GM's own table makes MY2027 NACS-native while
# MY2026 still ships CCS1 — one row cannot hold two plugs. Correct change.
# It renamed four row ids and left the old "lyriq-v-2026-27" and
# "cadillac-vistiq-2026-27" behind in match.test.ts and in backfill's
# TESTED_EST_BY_ROWID, so both cars' tested highway range — 260 mi and 334 mi,
# keyed to ids that no longer existed — rendered nowhere for four days.
#
# backfill-rowids.test.ts is the check written for exactly that failure, after
# five keys were orphaned the same way in August. It caught this one too. It
# had simply been failing, unread, the entire time. The test was never the
# gap; running it was.
#
# Cheap enough that there is no reason to scope it: no secrets, no database,
# ~8 seconds of tests behind one npm ci. Node's type stripping runs the
# TypeScript directly.

on:
  push:
    paths:
      - "web/**"
      - "scraper/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "web/**"
      - "scraper/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --no-audit --no-fund
      # Everything in tests/, discovered by glob, with no list of what to run
      # and no list of what to skip. That direction matters: a hand-kept list
      # is the same hand-maintained-index bug as the orphaned row ids above,
      # and it fails silently — a new test simply never runs and nobody finds
      # out. This way a new test is picked up the moment it lands.
      #
      # It had an exclusion list until 2026-09-17, and the reason given for it
      # was wrong. It read: pro-funnel.test.ts imports `next`, and the .tsx
      # tests "need react-testing-library and a DOM". They do not — every one
      # of them renders with renderToStaticMarkup from react-dom/server and
      # asserts on the string. react-testing-library is not a dependency of
      # this repo and nothing imports jsdom. All five .tsx files run under the
      # same plain node:test runner as everything else; the only thing they
      # ever needed was node_modules, which is also all pro-funnel needed. So
      # the price of the whole suite is the npm ci above (~40s cold, cached on
      # the lockfile) and the return is the six files nothing had ever run:
      # pro-funnel's 6 assertions, and 47 across battery-risk,
      # price-sparkline, price-trend, pro-page and watch-form.
      #
      # It was already worth paying. pro-page.test.tsx had been red since
      # 2026-09-03 and stayed red a fortnight: the owner moved rebates behind
      # the pass that afternoon (01ad0a83), the test still pinned `live:
      # false` from that morning's lineup, and no run existed to say so. The
      # same failure as the orphaned row ids — the test was never the gap,
      # running it was — and an exclusion list is the very thing the paragraph
      # above argues against.
      - name: Run tests
        working-directory: web
        run: |
          files=$(ls tests/*.test.ts tests/*.test.tsx)
          echo "$files"
          node --experimental-strip-types --import ./scripts/ts-resolve-hook.mjs --test $files

  # scraper/test/ was the same failure class this workflow exists for: 48
  # files, 481 assertions, plain node:test, and no workflow ran any of them
  # until 2026-09-01. Same everything-except-exclusions direction as the web
  # job — a bare `node --test` uses the runner's default discovery (every
  # *.test.{js,mjs,cjs} under the working directory, node_modules excluded),
  # so a new test file runs the moment it lands with no list to maintain.
  # The bare form rather than `node --test test/` because a directory
  # positional gets executed as an entry file on current Node ("Cannot find
  # module .../scraper/test", reproduced on 24.14 even in a clean directory);
  # discovery resolves to the identical set, since test/ holds every test
  # file in the lane.
  #
  # Nothing here is excluded, because nothing needs to be: the suite imports
  # only node: builtins and repo files (there is no scraper/package.json at
  # all, so a green run *proves* zero external deps — no install step), and
  # the one child_process use is parses.test.mjs running `node --check` on
  # repo files. No network, no secrets, no database; ~6 seconds locally.
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The browser lanes (scraper/lib/browser.mjs) need Playwright's Chromium
      # headless shell; everything else in scraper/ is plain Node. ~90 MB,
      # cached on the lockfile.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scraper/package-lock.json') }}
      - working-directory: scraper
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium-headless-shell
      - name: Run tests
        working-directory: scraper
        run: node --test
