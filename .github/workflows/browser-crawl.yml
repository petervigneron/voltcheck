name: Browser crawl

# The rooftops only a real Chrome can read, crawled as their own bounded job.
#
# WHY THIS EXISTS (2026-09-13). Since migrations 0089–0091 the site serves a
# car only while some source saw it, or its own page confirmed it, within 36
# hours. A rooftop nobody re-reads therefore decays off the site in a day and
# a half — and the browser-lane rooftops (lib/browser-lane-domains.mjs: 2,167
# Dealer Inspire and 63 Porsche rooftops on 2026-09-13) were being re-read by
# nobody in particular. The rolling crawl carries them with its lanes on, but
# measured on its 2026-09-13 07:11 run: 47 of 48 slices hit the 18-minute
# deadline with ~4,200 of 21,116 domains never reached, and of the 1,436
# Dealer Inspire rooftops it did reach, 1,331 came back partial under the
# 8-minute cap it shares with plain-fetch rooftops. Measured the same day at
# 17:30 UTC (browser-lane-dark.mjs): 13,225 live cars on these rooftops,
# 4,019 of them dark on 847 rooftops, 211 rooftops fully dark. The nightly
# browser recheck re-admits live cars one page at a time (1,200 a night) and
# cannot find a NEW car on any of them. The owner's standard: "comprehensive
# listings that are real, active, and timely."
#
# WHAT THIS IS. crawl-cohort.yml's slice job — the rolling crawl's, with the
# lanes on — fed from the registry instead of a dispatch, on its own schedule,
# with bounds it cannot exceed:
#   - per rooftop: --max-pages (the lane's load budget) and --domain-cap-min,
#     both enforced inside the lane and raced by crawl.mjs's wall;
#   - per part: --deadline-min stops new rooftops, the hard stop five minutes
#     later ends the process whatever is in flight, and the job cap is a net
#     past that (setup, sync, and up to 90 minutes waiting out a nightly);
#   - per run: its own concurrency group, so two runs never overlap, and
#     max-parallel = the part count, so it never takes more runners than it
#     says.
# It touches nothing else's clock: the rolling crawl keeps its slices, the
# nightly its window. Its writes go through db-sync → ingest_listings exactly
# as a rolling slice's do, so completeness certification, the per-rooftop
# half-lot guard (0083) and delisting behave as for any rooftop.
#
# WHEN. Twice a day, outside the nightly's 10:30–18:00 UTC window: 04:30
# lands a 300-minute run before 10:30, and 18:30 runs beside the evening
# rolling crawls (which is fine — the two lanes are correct when they overlap,
# ingest_listings refuses stale overwrites by observedAt — and the sync below
# still yields to a nightly). Twice a day against a 36-hour rule leaves a
# margin for one missed run.
#
# POLITENESS is the lanes' own and is not configurable here: robots-allowed
# pages only (lib/browser.mjs reads the vendor's robots.txt through Chrome
# when the plain read is walled), no challenge solving, the x-crawler
# declaration on every load, one request per host per 1.1 s. BROWSER_CONCURRENCY
# is pages in flight per RUNNER, not per rooftop: a Dealer Inspire visit is
# one load at a time, so it is a CPU setting, never a per-host rate.
#
# SIZED FROM TWO TRIALS, 2026-09-13, the same 96 rooftops (--key 1000,
# --limit 96, 8 parts of 12) at 2 and at 6 pages in flight:
#   pages  loads/min/part  rooftops/hour/part  EVs read  complete  no SRP
#     2        19.9               30             1,827      24%      1%
#     6        29.4               47             1,829      18%      1%
# Six pages read the same cars 1.5x faster with the same false-empty rate —
# the rate that made 2 the recheck's ceiling on 2026-09-11 is honest since
# 31cb1ca (a cardless page reports "no SRP answered", never an empty lot),
# so above 2 the cost is only that a slower page trips the 8-minute cap a
# little more often (complete 24% → 18%; those rooftops are still read,
# just not certified). Two pages would need 16 parts to cover 2,230
# rooftops in a 300-minute run; six needs ten, which is what runs.

on:
  schedule:
    - cron: "30 4 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel parts (runners). Each part crawls every Nth rooftop of the rotated list."
        required: false
        default: "10"
      browser_concurrency:
        description: "BROWSER_CONCURRENCY: Chrome pages in flight per part (a CPU setting; a rooftop is always one load at a time)."
        required: false
        default: "6"
      max_pages:
        description: "crawl.mjs --max-pages: the lane's browser-load budget per rooftop."
        required: false
        default: "80"
      domain_cap_min:
        description: "crawl.mjs --domain-cap-min: minutes one rooftop may hold a worker."
        required: false
        default: "8"
      deadline_min:
        description: "crawl.mjs --deadline-min per part; the process hard-stops 5 minutes past it."
        required: false
        default: "300"
      limit:
        description: "Only the first N rooftops of the rotated list (a trial). Blank = all."
        required: false
        default: ""
      key:
        description: "Rotation key (an integer). Blank = this half-day, as the schedule uses. Reuse one to re-read the same rooftops."
        required: false
        default: ""
      sync:
        description: "Push to Supabase. 'false' crawls and reports only."
        required: false
        default: "true"

concurrency:
  group: browser-crawl
  cancel-in-progress: false

permissions:
  contents: write # commits the vPIC decode cache
  actions: read # reads whether nightly.yml is mid-run, for the sync guard

jobs:
  # THE NUMBER BEFORE. The owner's acceptance query (lib/browser-lane-dark.mjs)
  # over the browser-lane rooftops, taken before a page is loaded, so every
  # run's summary says what it started from. ~13k narrow rows; not a walk.
  measure-before:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dark browser-lane cars before
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node browser-lane-dark.mjs --label before --json out/dark-before.json
      - uses: actions/upload-artifact@v4
        with:
          name: browser-crawl-dark-before
          path: scraper/out/dark-before.json

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      jobs: ${{ steps.build.outputs.jobs }}
      timeout: ${{ steps.build.outputs.timeout }}
    steps:
      - id: build
        run: |
          N="${{ github.event.inputs.jobs || '10' }}"
          echo "matrix=$(awk -v n="$N" 'BEGIN{printf "["; for(i=0;i<n;i++) printf "%s%d", (i?",":""), i; printf "]"}')" >> "$GITHUB_OUTPUT"
          echo "jobs=$N" >> "$GITHUB_OUTPUT"
          # The part job's cap: deadline + 5 (hard stop) + 40 for setup,
          # enrichment, ingest, sync and the cache commit + 90 the sync may
          # spend waiting for a nightly. Computed here because a workflow
          # expression has no arithmetic.
          echo "timeout=$(( ${{ github.event.inputs.deadline_min || '300' }} + 135 ))" >> "$GITHUB_OUTPUT"

  crawl:
    needs: [plan, measure-before]
    # The crawl must not wait on the measurement's luck: a database blip in
    # measure-before costs the "before" number, not the run.
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.jobs) }}
      matrix:
        part: ${{ fromJson(needs.plan.outputs.matrix) }}
    # deadline + 5 (hard stop) + setup, enrichment, ingest, the wait for a
    # nightly, sync and the cache commit (the plan job does the sum). The
    # deadline is what ends the crawling; this is the net.
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scraper/package-lock.json') }}
      - working-directory: scraper
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium-headless-shell

      # The registry's browser-lane rooftops, rotated for this half-day so a
      # part that hits its deadline drops different rooftops each run, cut
      # into interleaved parts (lib/browser-lane-domains.mjs).
      - name: Choose this part's rooftops
        id: pick
        working-directory: scraper
        run: |
          node browser-lane-domains.mjs \
            --part "${{ matrix.part }}" --parts "${{ needs.plan.outputs.jobs }}" \
            --limit "${{ github.event.inputs.limit || '0' }}" --key "${{ github.event.inputs.key }}" \
            > /tmp/domains.txt
          echo "count=$(wc -w < /tmp/domains.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          head -c 300 /tmp/domains.txt; echo

      # --concurrency is BROWSER_CONCURRENCY + 2: a rooftop in flight without
      # a Chrome page waits on the page semaphore while its domain cap runs,
      # so more domains in flight than pages only burns cap; two extra
      # overlap the robots read and per-host pacing between loads.
      - name: Crawl this part
        if: ${{ steps.pick.outputs.count != '0' }}
        working-directory: scraper
        env:
          BROWSER_LANES: "on"
          BROWSER_CONCURRENCY: ${{ github.event.inputs.browser_concurrency || '6' }}
        run: |
          BC="${BROWSER_CONCURRENCY}"
          start=$(date -u +%FT%TZ)
          node crawl.mjs $(cat /tmp/domains.txt) \
            --max-pages "${{ github.event.inputs.max_pages || '80' }}" --cache-hours 0 \
            --concurrency $((BC + 2)) \
            --deadline-min "${{ github.event.inputs.deadline_min || '300' }}" \
            --domain-cap-min "${{ github.event.inputs.domain_cap_min || '8' }}"
          rc=$?
          mkdir -p out
          printf '{"startedAt":"%s","endedAt":"%s","asked":%s,"browserConcurrency":%s,"part":%s}\n' \
            "$start" "$(date -u +%FT%TZ)" "${{ steps.pick.outputs.count }}" "$BC" "${{ matrix.part }}" > out/crawl-timing.json
          exit $rc

      # Same order as nightly.yml and rolling-crawl.yml, for the reason their
      # headers give: ingest keeps only evConfidence "high", and vpic-enrich
      # is what promotes real EVs whose page omitted fuel type and demotes
      # the ones vPIC refutes. Never ingest before enriching.
      - name: VIN enrichment (vpic)
        if: ${{ steps.pick.outputs.count != '0' }}
        working-directory: scraper
        run: |
          timeout 10m node vpic-enrich.mjs || \
            echo "::warning::vpic-enrich hit its 10m cap on part ${{ matrix.part }}; decoded VINs are cached and will not be re-fetched"

      - name: Ingest
        if: ${{ steps.pick.outputs.count != '0' }}
        working-directory: scraper
        run: node ingest.mjs

      # The rolling crawl's guard, for the rolling crawl's reason: this
      # instance falls over when writes arrive together. The rolling crawl
      # SKIPS its push while a nightly is writing, because its rooftops come
      # round again in hours; a part here has spent up to five hours of
      # Chrome on rooftops that come round in twelve, so it WAITS instead —
      # up to 90 minutes, polling every two — and skips only if the nightly
      # is still going after that. Measured the day this shipped: the
      # nightly's 10:30 schedule was delivered at 14:29, and its browser
      # recheck was still running at 18:05 when the calibration trials
      # finished, so all 16 trial parts pushed nothing. Fails open, like the
      # original: a GitHub API hiccup lets the sync proceed.
      - name: Wait for a running nightly before pushing
        id: nightly
        if: ${{ steps.pick.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy() { gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml \
                     --status in_progress --limit 1 --json databaseId --jq 'length' 2>/dev/null || echo 0; }
          BUSY=$(busy)
          waited=0
          while [ "$BUSY" != "0" ] && [ "$waited" -lt 90 ]; do
            echo "nightly.yml is running; waiting (${waited} min so far) so the two lanes do not write at once"
            sleep 120; waited=$((waited + 2)); BUSY=$(busy)
          done
          echo "busy=$BUSY" >> "$GITHUB_OUTPUT"
          [ "$BUSY" != "0" ] && echo "::warning::nightly.yml still running after ${waited} min; skipping this part's push. These rooftops come round again next run."
          echo "nightly in progress: $BUSY (waited ${waited} min)"

      - name: Sync this part to Supabase
        if: ${{ steps.pick.outputs.count != '0' && github.event.inputs.sync != 'false' && steps.nightly.outputs.busy == '0' }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
          # A part of Chrome-only rooftops can legitimately land a small
          # share; db-sync's <50-row refusal guards a broken WHOLE crawl.
          DB_SYNC_MIN_ROWS: "10"
          # ingest_runs.source, so this lane's runs can be told from the
          # nightly's and the rolling crawl's in the database. Nothing reads
          # it as a rule (grepped web/ and supabase/ on 2026-09-13).
          DB_SYNC_SOURCE: "browser-crawl"
        run: node db-sync.mjs

      # What this part read and pushed, for the report job: crawl.mjs's
      # per-rooftop reports, db-sync's own counts, and the crawl's clock.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-crawl-part-${{ matrix.part }}
          path: |
            scraper/out/report.json
            scraper/out/sync-totals.json
            scraper/out/crawl-timing.json
          if-no-files-found: warn

      - name: Commit the vPIC cache
        if: always()
        run: |
          git config user.name "voltcheck-bot"
          git config user.email "noreply@github.com"
          unwedge() {
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            git checkout -f HEAD -- scraper/registry 2>/dev/null || true
            git stash list 2>/dev/null | grep -q . && git stash drop >/dev/null 2>&1
            return 0
          }
          mine="${RUNNER_TEMP:-/tmp}/vpic-cache-mine.json"
          cp scraper/registry/vpic-cache.json "$mine"
          for i in 1 2 3 4 5; do
            git checkout HEAD -- scraper/registry/vpic-cache.json 2>/dev/null || true
            git fetch origin main || true
            if ! git pull --rebase --autostash; then
              unwedge
              sleep $((i * 10)); continue
            fi
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              unwedge; continue
            fi
            node scraper/merge-vin-cache.mjs --file scraper/registry/vpic-cache.json --mine "$mine"
            git add scraper/registry/vpic-cache.json
            git diff --staged --quiet && { echo "nothing to commit"; exit 0; }
            git commit -m "Browser crawl: vPIC cache after part ${{ matrix.part }} [skip ci]"
            if git push; then echo "vpic cache pushed"; exit 0; fi
            [ "$(git log -1 --format=%s)" = "Browser crawl: vPIC cache after part ${{ matrix.part }} [skip ci]" ] && git reset --soft HEAD~1
            sleep $((i * 10))
          done
          echo "::warning::Could not push the vPIC cache for part ${{ matrix.part }} (raced another run); the decodes will be re-fetched next time."

      - name: What this part did
        if: always()
        working-directory: scraper
        run: |
          echo "part ${{ matrix.part }}: ${{ steps.pick.outputs.count }} rooftops"
          cat out/crawl-timing.json 2>/dev/null || true
          node -e '
            const r = JSON.parse(require("fs").readFileSync("out/report.json", "utf8"));
            const evs = r.reduce((a, x) => a + (x.evs || []).length, 0);
            const cls = (x) => { const s = x.stoppedEarly || "ok"; return /abandon/.test(s) ? "abandoned" : /no SRP/.test(s) ? "no SRP answered" : /429/.test(s) ? "challenged" : /robots/.test(s) ? "robots-disallowed" : /partial|cap|budget/.test(s) ? "partial" : s.slice(0, 40); };
            const c = {}; for (const x of r) c[cls(x)] = (c[cls(x)] || 0) + 1;
            console.log(`${r.length} rooftops reported, ${evs} EVs`, c);
          ' 2>/dev/null || true
          cat out/sync-totals.json 2>/dev/null || true

  # THE NUMBER AFTER, and the run in outcomes. Runs whatever the parts did —
  # a part that failed still filed what it read, and a run that recovered
  # nothing should say so where the next reader looks.
  report:
    needs: [measure-before, crawl]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: browser-crawl-part-*
          path: parts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: browser-crawl-dark-before
          path: before
      - name: Dark browser-lane cars after
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node browser-lane-dark.mjs --label after --json out/dark-after.json
      - name: What this run did
        working-directory: scraper
        run: node browser-crawl-report.mjs --parts ../parts --before ../before/dark-before.json --after out/dark-after.json

  # Republish so the recovered cars reach the grid (CLAUDE.md: the grid's
  # freshness is the publish cadence and nothing else). Same gate and the
  # same shape as crawl-cohort.yml; publish-feed.yml carries its own refusals
  # (a deploy building, a walk that fell back, a >10% shrink).
  should-publish:
    needs: crawl
    if: >-
      ${{ always()
          && (needs.crawl.result == 'success' || needs.crawl.result == 'failure')
          && github.event.inputs.sync != 'false' }}
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - name: Is the nightly mid-sync?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUSY=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml \
                   --status in_progress --limit 1 --json databaseId --jq 'length' 2>/dev/null || echo 0)
          if [ "$BUSY" != "0" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::warning::nightly.yml is running — not republishing; its own publish covers this run's cars."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  publish-feed:
    needs: should-publish
    if: ${{ always() && needs.should-publish.outputs.go == 'true' }}
    uses: ./.github/workflows/publish-feed.yml
    secrets: inherit
