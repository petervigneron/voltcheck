name: Refresh site cache

# The site's browse cache used to be refreshed by exactly one thing: the last
# step of nightly.yml, right after the night's data landed. That worked because
# there WAS a moment when the data moved. rolling-crawl.yml removes that moment
# — a slice of the registry lands every 30 minutes — so refreshing has to
# become a scheduled act of its own, on a cadence chosen for cost rather than
# triggered by an event that no longer exists.
#
# TWICE A DAY, and the arithmetic is why. A refresh is a full walk of the feed:
# ~231 requests, measured at 122.6 MB decompressed and ~27 MB on the wire
# (web/ session, 2026-08-22, against 100,573 rows). Against the 5 GB/month free
# egress quota:
#
#     1/day   ~0.81 GB/mo    roughly today
#     2/day   ~1.62 GB/mo    this — about a third of quota
#     4/day   ~3.24 GB/mo    ~two thirds, before deploys, which each cost a walk
#    48/day  ~29 GB/mo       the 2026-08-17 egress incident, on purpose
#
# Two rather than four because MORE REFRESHES CANNOT MAKE A CAR FRESHER THAN
# ITS OWN CRAWL. rolling-crawl sweeps all 13,165 rooftops once a day, exactly
# as the nightly did, so any given car's data is at most ~24h old regardless of
# how often the site re-reads it. Refreshing twice halves the site's worst-case
# lag from ~24h to ~12h, which is strictly better than today at close to
# today's cost; refreshing four times spends another third of the quota to
# shave a lag the crawl cadence makes meaningless. The feed is also growing
# (100,297 rows this morning, 100,584 tonight) and coverage is the mission, so
# per-walk cost only rises — the headroom is worth keeping.
#
# TWO CRONS, EACH GATED ON THE CACHE'S OWN AGE — not one cron assuming the
# nightly provides the other. nightly.yml does revalidate and warm as its last
# step, but ONLY when its db-sync succeeded, which is deliberate (a lost night
# must fail loud rather than look refreshed). Step outcomes bear that out: it
# fired most nights, and failed BOTH of today's runs. So pairing one
# unconditional cron here with one conditional firing over there means that on
# any night the sync fails, the site silently drops to a single refresh a day —
# ~24h worst-case lag instead of the ~12h chosen — with nothing reporting it.
# That is today, and it gets less predictable as rolling-crawl takes ingest
# over and the nightly's role changes.
#
# So both slots are scheduled here, and each reads the CDN's `age` on
# /api/index/first and skips if the cache is younger than ~11h — unless any
# numbered shard is serving 5xx, in which case it refreshes regardless of age
# (2026-08-25: a young `first` from a half-finished deploy warm made this
# slot stand down while shards 12–23 served 500s). The cadence
# then holds itself at 2/day in every branch:
#
#   nightly revalidated ~16:00  ->  04:00 sees ~12h, refreshes
#                               ->  16:00 sees ~0h,  SKIPS        = 2/day
#   nightly failed or retired   ->  04:00 refreshes, 16:00 refreshes = 2/day
#
# Same ~1.62 GB/mo either way, no triple refresh, no edit needed on the day the
# nightly lane goes away, and "the nightly did not revalidate again" becomes a
# visible skipped/refreshed log line instead of something to infer. 11h rather
# than 12 so ordinary cron jitter cannot make a legitimate refresh skip itself.
#
# There is no attempt to time this to when data "just moved". With slices
# landing all day, any refresh catches a sweep partway through — the feed is a
# mixture of per-domain vintages, which it has always been. Uneven, not
# incoherent. A fixed schedule is therefore correct and chasing a good moment
# is not.

on:
  schedule:
    - cron: "0 4 * * *" # both slots are scheduled; the age gate below decides
    - cron: "0 16 * * *" # which of them actually spends a walk
  workflow_dispatch:

concurrency:
  group: refresh-site
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # reads whether nightly.yml is mid-run (see the guard below)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Skip entirely if the nightly is running: it revalidates and warms as
      # its own last step, so firing here as well would spend a second walk to
      # do the same job, and would do it against an instance already carrying
      # the night's writes. Fails OPEN — a GitHub API hiccup lets the refresh
      # proceed, because a skipped refresh is staler data while a doubled one
      # only costs egress. Named permissions narrow the token to exactly what
      # is listed, so `actions: read` above is what keeps this from silently
      # reporting "not running" every time.
      - name: Is the nightly running?
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUSY=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml \
                   --status in_progress --limit 1 --json databaseId --jq 'length' 2>/dev/null || echo 0)
          echo "busy=$BUSY" >> "$GITHUB_OUTPUT"
          echo "nightly in progress: $BUSY"

      # Is the cache already fresh enough that this slot should stand down?
      # `age` is the CDN's own count of seconds since it cached the body, so it
      # resets to ~0 after any revalidate-and-warm, whoever ran it. That makes
      # it a direct reading of "has something already refreshed recently"
      # rather than an assumption about who was supposed to.
      #
      # BUT freshness is judged on the whole grid, not on /api/index/first
      # alone. 2026-08-25: a session deployed at 16:36 (fresh deployment,
      # empty cache) and its post-deploy warm died partway — first and shards
      # 0–11 rendered, then the database went down mid-warm and 12–23 cached
      # nothing. This slot fired at 16:42, read a six-minute-old `first`,
      # said "something already refreshed it", and went green — while half
      # the browse grid served 500s for the next two hours. A young `first`
      # only proves a warm STARTED recently; the status sweep below is what
      # checks it FINISHED. All 25 reads are CDN status checks (HEAD-shaped,
      # no bodies), so the sweep costs no database work and negligible egress.
      #
      # Any shard 5xx => REFRESH regardless of age (the re-warm is the
      # repair), and `broken` is recorded so the no-go path below can turn
      # "could not repair" into a red run instead of a quiet skip.
      #
      # Unreadable age => REFRESH, not skip. Failing to read the header is not
      # evidence of freshness, and the costs are asymmetric: a redundant
      # refresh is ~27 MB, while a wrongly-skipped one leaves the site a day
      # stale. `first` not answering at all is different and does skip — if
      # the site itself is unwell, expiring its cache is the last thing to do.
      - name: Is the cache still fresh — and the whole grid actually serving?
        id: age
        if: ${{ steps.nightly.outputs.busy == '0' }}
        run: |
          MIN_AGE=39600 # 11h
          H=$(curl -sI --max-time 20 https://voltcheck.net/api/index/first || true)
          CODE=$(printf '%s' "$H" | head -1 | awk '{print $2}')
          AGE=$(printf '%s' "$H" | grep -i '^age:' | tr -d '\r' | awk '{print $2}' | head -1)
          if [ "$CODE" != "200" ]; then
            echo "::warning::/api/index/first returned '${CODE:-no response}' — skipping this refresh rather than expiring the cache of a site that is not answering"
            echo "stale=false" >> "$GITHUB_OUTPUT"; echo "broken=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The sweep. 24 shards since 2026-08-24 — keep in step with
          # web/lib/listings/pack.ts SHARDS. A 5xx is a shard shoppers cannot
          # load; anything else (200 from cache, however stale) is "serving".
          # --max-time 90 because a MISS here re-renders at the origin: a
          # healthy render finishes under that, a sick one is indistinguishable
          # from down — either way it is not "serving" right now.
          BROKEN=""
          for s in $(seq 0 23); do
            C=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "https://voltcheck.net/api/index/$s" || echo 000)
            case "$C" in 5*|000) BROKEN="$BROKEN $s";; esac
          done
          if [ -n "$BROKEN" ]; then
            echo "::warning::shards$BROKEN are not serving (5xx/timeout) while first answers 200 — a half-finished warm. Refreshing regardless of cache age; the re-warm is the repair."
            echo "stale=true" >> "$GITHUB_OUTPUT"; echo "broken=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "broken=false" >> "$GITHUB_OUTPUT"
          if [ -z "$AGE" ]; then
            echo "no age header (CDN MISS or header stripped) — refreshing, because an unreadable age is not evidence of freshness"
            echo "stale=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$AGE" -lt "$MIN_AGE" ]; then
            echo "cache is ${AGE}s old (under ${MIN_AGE}s) — something already refreshed it, so this slot stands down"
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "cache is ${AGE}s old (>= ${MIN_AGE}s) — this slot refreshes"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # The same gate nightly.yml applies before its own revalidate, and for
      # the same reason: expiring a good cache and re-warming it against a
      # database that cannot serve a walk is how the browse grid gets poisoned.
      # A page is NOT the gate — 35 of 36 bucket pages answered in ~0.3 s on
      # 2026-08-22 and the full walk still died — so this checks the count and
      # then a real feed page under the 1.5 s ceiling the nightly uses, and
      # refuses rather than warming into a sick instance.
      #
      # Since 049f41b the browse shards throw on a fallback read rather than
      # serving the bundled snapshot, so a bad warm now degrades to "stale but
      # correct" instead of "fresh but half empty". That makes this gate a cost
      # control more than a correctness one — but it stays, because burning a
      # walk to cache nothing is still worth avoiding.
      - name: Can the database serve a walk?
        id: gate
        if: ${{ steps.nightly.outputs.busy == '0' && steps.age.outputs.stale == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::no Supabase credentials; skipping the refresh rather than guessing"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          auth=(-H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "${auth[@]}" \
            -H "Range: 0-0" -H "Prefer: count=exact" \
            "$SUPABASE_URL/rest/v1/listings?select=vin&delisted_at=is.null") || code=000
          if [ "$code" != "200" ] && [ "$code" != "206" ]; then
            echo "::warning::database cannot answer the listing count (HTTP $code); skipping this refresh, the site keeps the cache it has"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sel="vin,payload,first_seen_at,last_seen_at,prev_price_usd,price_changed_at,buyback_disclosed,listed_on"
          # The \n in -w is load-bearing: curl ends its -w output without one, so
          # read hits EOF mid-line, returns 1, and bash -e kills the step with no
          # output (refresh-fallback.yml's 2026-08-23 red run).
          read -r pcode ptime < <(curl -s -o /dev/null -w "%{http_code} %{time_total}\n" --max-time 20 "${auth[@]}" \
            "$SUPABASE_URL/rest/v1/live_listings_feed?select=$sel&order=vin.asc&limit=500&vin=gte.W" || echo "000 99")
          if [ "$pcode" != "200" ] || awk "BEGIN{exit !($ptime > 1.5)}"; then
            echo "::warning::a fat feed page returned $pcode in ${ptime}s (ceiling 1.5s); skipping this refresh"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "count HTTP $code, fat feed page ${ptime}s — safe to refresh"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # first FIRST: it is the payload the next visitor's first card waits on.
      # Then the index shards, then the sitemaps — the sitemaps ride the walk
      # memo the shard warm just paid for, so they cost no extra database read.
      - name: Expire and warm
        if: ${{ steps.gate.outputs.ok == 'true' }}
        env:
          FEED_REVALIDATE_SECRET: ${{ secrets.FEED_REVALIDATE_SECRET }}
        run: |
          if [ -z "$FEED_REVALIDATE_SECRET" ]; then
            echo "::warning::FEED_REVALIDATE_SECRET unset; the site refreshes on its 24h cache backstop instead"; exit 0
          fi
          curl -fsS --retry 3 --max-time 60 -X POST \
            -H "x-revalidate-secret: $FEED_REVALIDATE_SECRET" https://voltcheck.net/api/revalidate \
            || { echo "::warning::/api/revalidate unreachable; 24h backstop applies"; exit 0; }
          # 24 index shards since 2026-08-24 — keep in step with
          # web/lib/listings/pack.ts SHARDS, whose comment has the incident.
          for s in first $(seq 0 23); do
            curl -fsS --retry 2 --max-time 300 -o /dev/null "https://voltcheck.net/api/index/$s" \
              || echo "::warning::shard $s warm failed; its first visitor pays the render"
          done
          # 12 sitemap shards since 2026-08-24 — keep in step with
          # web/lib/sitemap.ts SITEMAP_SHARDS, whose comment has the incident.
          for s in $(seq 0 11); do
            curl -fsS --retry 2 --max-time 300 -o /dev/null "https://voltcheck.net/sitemap/$s.xml" \
              || echo "::warning::sitemap $s warm failed; crawlers keep the previous copy"
          done

      # Seven 200s are not seven correct bodies. This counts the ROWS in what
      # was just cached and fails if the shards disagree with each other or
      # with the total — the 2026-08-21 shape, where five shards served ~9,800
      # rows each and every endpoint answered 200 for most of a day.
      - name: Verify what we just warmed
        if: ${{ steps.gate.outputs.ok == 'true' }}
        working-directory: scraper
        env:
          FEED_REVALIDATE_SECRET: ${{ secrets.FEED_REVALIDATE_SECRET }}
        run: node feed-shard-check.mjs

      # Shards were serving 5xx and this run could not repair them — the
      # database gate refused the warm (or the credentials were missing), so
      # the grid is STILL broken and somebody has to know. Refusing to warm
      # into a sick database stays correct; refusing QUIETLY is what let
      # 2026-08-25's half-dead grid ride for two hours between human checks.
      # A red run here is the difference between "the site is degraded and
      # the pipeline knows" and "the site is degraded and only a shopper
      # knows". (When the warm DID run, the verify step above already owns
      # pass/fail, so this only fires on the refused path.)
      - name: A broken grid must not exit green
        if: ${{ steps.age.outputs.broken == 'true' && steps.gate.outputs.ok != 'true' }}
        run: |
          echo "::error::shards are serving 5xx and the refresh was refused (database gate not ok) — the browse grid is degraded and this run could not repair it. It stays red until a warm succeeds; recovery options are in CLAUDE.md's deploy notes (vercel promote to a deployment with a good cache)."
          exit 1
