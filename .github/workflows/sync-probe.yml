name: Sync path probe

# Measures, without writing a row, whether the ingest path accepts the bodies
# db-sync.mjs sends — see scraper/sync-probe.mjs for what each probe means.
# Manual only. Exits green whatever it finds; the answer is in the log and the
# sync-probe artifact.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "How many ~3 MB chunk-shaped bodies to send per route"
        required: false
        default: "25"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe the ingest path
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROBE_ROUNDS: ${{ github.event.inputs.rounds || '25' }}
        run: node sync-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-probe
          path: scraper/out/sync-probe.json
          if-no-files-found: warn
