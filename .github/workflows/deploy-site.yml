# Warm-then-promote a production candidate from a GitHub runner, so a deploy
# survives the laptop that started it going to sleep (2026-08-26: the owner
# closed their machine mid-deploy-window and every local waiter died with it).
# This is scraper/deploy-site.mjs, unchanged, on neutral ground: the candidate
# is warmed on its own URL behind Protection Bypass, validated, and promoted —
# voltcheck.net is untouched until every check passes. See the script's header
# for the whole story.
#
# Dispatch-only, deliberately. A deploy is a decision, not a schedule.
name: Deploy site (warm-then-promote)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Candidate deployment URL (already built, un-promoted). Leave empty to build one here."
        required: false
      wait_for_nightly:
        description: "Wait for today's nightly to complete, then settle 45 min, before warming"
        required: false
        default: "true"

# One deploy at a time — two concurrent warms against the one database is the
# 2026-08-16 crash-loop with extra steps.
concurrency: deploy-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    # actions:write is for the re-enable step (and covers the run-list polls).
    permissions:
      contents: read
      actions: write
    # The wait can be hours (nightly runs ~5.5h and this may start mid-run);
    # the ceiling leaves headroom under the runner's 6h hard cap.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The tests already ran on push (tests.yml); the deploy never looked.
      # On 2026-09-03 main sat red for three pushes while deploys went out,
      # and a fourth push crashed the browse page for every visitor with the
      # suite unable to say so. Same command as tests.yml's web job, so the
      # deploy refuses the same commits the badge does — in ~20 s, before the
      # hours-long wait on the nightly.
      - name: Refuse to ship a commit whose tests fail
        working-directory: web
        run: |
          files=$(ls tests/*.test.ts | grep -v 'tests/pro-funnel.test.ts')
          node --experimental-strip-types --import ./scripts/ts-resolve-hook.mjs --test $files

      # deploy-site.mjs loads the candidate in a real browser before it
      # promotes (its `smoke`): Playwright's headless shell, cached on the
      # lockfile the same way rolling-crawl.yml does it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scraper/package-lock.json') }}
      - working-directory: scraper
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium-headless-shell

      - run: npm install -g vercel

      # With a pre-built --url candidate, the promote at the very end is the
      # token's first use — run 33280497979 (2026-08-30) waited out the
      # nightly and warmed all 26 paths before an expired VERCEL_TOKEN killed
      # the promote. Spend the token once up front so a dead one fails here,
      # in seconds.
      - name: Fail fast if VERCEL_TOKEN cannot see the account
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel ls --token "$VERCEL_TOKEN" --scope petervignerons-projects > /dev/null

      # Same sequencing the local flow used: the warm's walks want the
      # database AFTER the night's ingest and recheck are done with it, plus
      # settle time for the IO budget. Poll rather than trust the clock —
      # nightly's duration moves.
      - name: Wait for nightly to finish, then settle
        if: ${{ github.event.inputs.wait_for_nightly == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            s=$(gh run list --workflow nightly.yml --limit 1 --json status -q '.[0].status // "none"')
            [ "$s" != "in_progress" ] && [ "$s" != "queued" ] && break
            echo "nightly is $s — waiting"
            sleep 300
          done
          echo "nightly done — settling 45 min"
          sleep 2700

      - name: Warm the candidate and promote
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_ORG_ID: team_8RiMoU4yuMtGM1YLDVCN89Nj
          VERCEL_PROJECT_ID: prj_SsG72w0Hr1xIlOPQJn4oXc5oVGnq
          VERCEL_SCOPE: petervignerons-projects
        run: |
          # No url input means build one here. deploy-site.mjs has always been
          # able to do that (its --ref/no-arg mode); what stopped it in CI was
          # copying web/.vercel, which only exists on a laptop. It now falls
          # back to VERCEL_ORG_ID/VERCEL_PROJECT_ID, so this workflow can ship
          # on its own instead of waiting for a URL built somewhere else.
          if [ -n "${{ github.event.inputs.url }}" ]; then
            node deploy-site.mjs --url "${{ github.event.inputs.url }}"
          else
            node deploy-site.mjs
          fi

      # The deploy window ran with these schedules off (see the 08-26 deploy
      # notes); a promote from CI must not leave them dark.
      - name: Re-enable paused workflow schedules
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in rolling-crawl.yml refresh-site.yml feed-audits.yml; do
            gh workflow enable "$wf" && echo "enabled $wf" || echo "::warning::could not enable $wf"
          done
