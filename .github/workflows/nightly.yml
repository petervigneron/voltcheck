name: Nightly inventory

# The pipeline used to run from a laptop via launchd, which meant it only
# ran when the lid happened to be open at 3:30 AM — mostly never. This runs
# it on GitHub's machines instead.
#
# Sharded 2026-08-13: a single job hit the 330-minute cap at ~650 working
# domains, and nothing reaches Supabase until after the crawl — so a crawl
# that missed the window persisted zero cars. The crawl now fans out across
# a fixed matrix; each shard crawls sites where index % SHARDS == shard, and
# a finalize job merges shard outputs before enrichment and sync. A shard
# that dies costs its slice, not the night: db-sync only delists for domains
# whose report says complete, so missing shards certify nothing.
on:
  schedule:
    - cron: "30 10 * * *" # 03:30 America/Los_Angeles (10:30 UTC)
  # On demand, with bootstrap-scale knobs. The scheduled defaults are tuned
  # for steady state (inventory changes slowly); while building initial
  # coverage the limiting factor is how fast new dealers get validated and
  # crawled for the first time, which is a one-time cost per dealer.
  workflow_dispatch:
    inputs:
      probe_limit:
        description: "Dealers to validate this run (steady state 300; bootstrap 2000+)"
        required: false
        default: "300"
      max_pages:
        description: "Page budget per non-group dealer"
        required: false
        default: "80"
      skip_crawl:
        description: "Probe only — useful when clearing a large discovery backlog"
        required: false
        default: "false"

# Deliberately NOT sharing a group with the discovery sweep. They both touch
# registry.json, but blocking the crawl behind a multi-hour sweep means the
# site can't refresh while discovery runs — unacceptable during bootstrap.
# The commit step below handles the write race instead.
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write # commits the refreshed registry + listings snapshot

env:
  SHARDS: "8"

jobs:
  # Validate newly discovered dealers first, so tonight's crawl already
  # includes the ones that pass. The probed registry travels to the other
  # jobs as an artifact — shards must see tonight's promotions, and the
  # finalize job commits this exact file.
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe discovered dealers
        working-directory: scraper
        run: node probe.mjs --limit ${{ github.event.inputs.probe_limit || '300' }} --concurrency 12
      - uses: actions/upload-artifact@v4
        with:
          name: registry
          path: scraper/registry/registry.json

  crawl:
    needs: probe
    if: ${{ github.event.inputs.skip_crawl != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false # one dead shard must not cancel the others
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7] # keep in sync with env.SHARDS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: registry
          path: scraper/registry
      - name: Crawl shard ${{ matrix.shard }}
        working-directory: scraper
        run: |
          DOMAINS=$(python3 -c "
          import json
          r = json.load(open('registry/registry.json'))
          doms = sorted(s['domain'] for s in r['sites'] if s.get('status') == 'working')
          print(' '.join(d for i, d in enumerate(doms) if i % ${SHARDS} == ${{ matrix.shard }}))")
          echo "shard ${{ matrix.shard }}/${SHARDS}: crawling $(echo $DOMAINS | wc -w) domains"
          # cache-hours 0: the runner starts with an empty cache and discards
          # it, so caching only costs disk — and filled it on run #2.
          node crawl.mjs $DOMAINS --max-pages ${{ github.event.inputs.max_pages || '80' }} --cache-hours 0 --concurrency 16
      - uses: actions/upload-artifact@v4
        with:
          name: crawl-out-${{ matrix.shard }}
          path: scraper/out/

  # OEM find-inventory locators (GM brands): dealer-authorized public JSON
  # endpoints that list every franchised rooftop's new-EV stock — including
  # the ~1.5k dealer domains whose own sites are bot-walled. Independent of
  # the registry (no probe dependency), and its output is shaped exactly like
  # a crawl shard, so the crawl-out-* artifact pattern sweeps it into the
  # same merge. If it dies, its domains simply certify nothing tonight.
  oem-locator:
    if: ${{ github.event.inputs.skip_crawl != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull OEM locator inventory
        working-directory: scraper
        run: node oem-locator.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: crawl-out-oem
          path: scraper/out/

  # Merge shard outputs, enrich, sync, commit. always() + probe success:
  # this must run even when some shards failed (their work is simply absent
  # from the merge) and when the crawl was skipped (probe-only runs still
  # commit registry status changes).
  finalize:
    needs: [probe, crawl, oem-locator]
    if: ${{ always() && needs.probe.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240 # enrichment + recheck scale with listing count
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: registry
          path: scraper/registry
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        with:
          pattern: crawl-out-*
          path: scraper/out/shards
      - name: Merge shard outputs
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        working-directory: scraper
        run: node merge-shards.mjs

      # The OEM locator lanes link each car to a VDP on the selling dealer's
      # own site. Any host we aren't tracking becomes a "discovered" registry
      # row (name/city/state ride along from the listing), which tomorrow's
      # probe validates like any other discovery — free registry growth from
      # pages tonight's run already fetched. Appends only; never edits rows.
      - name: Harvest dealer rooftops from locator VDP hosts
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        working-directory: scraper
        run: node harvest-dealers.mjs --write

      - name: VIN enrichment and ingest
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        working-directory: scraper
        run: |
          node vpic-enrich.mjs
          # Per-VIN battery coverage from GM's owner portal. Bounded per night
          # (a few thousand VINs on the first pass, none once cached) and
          # never fatal: a car without it falls back to abstaining, which is
          # the same thing the site did before this lane existed.
          node gm-warranty.mjs --limit 600 || echo "gm-warranty failed, continuing"
          node ingest.mjs

      - name: Sync to Supabase
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
        run: node db-sync.mjs

      # Which rooftops offered the same VIN tonight (migration 0036). The
      # merge dedupes one VIN to one record, so this evidence exists only in
      # out/colisting-pairs.json on this runner and is gone when it is
      # deleted — it cannot be recomputed from the database afterwards.
      # Separate from db-sync because db-sync runs a second time when the
      # price audit corrects a price, and a price correction says nothing new
      # about who shares inventory.
      # continue-on-error: this is archive, not the showroom. A failure here
      # costs one night of the graph; letting it abort the recheck that
      # follows would cost the sold-signal for every live car, and a red X on
      # the job would wrongly imply the crawl failed.
      - name: Record dealer-group co-listings
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        continue-on-error: true
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
        run: node colisting-sync.mjs

      # Sanity-check every price against WA sale medians (the vanhyundai
      # accessories-total incident, 2026-08-14). Implausible prices are
      # re-read from the dealer's own page or suppressed; exit 20 means the
      # listings JSON was corrected — sync once more, and the corrected
      # snapshot rides the data commit below. continue-on-error: a broken
      # comps lookup must not skip the recheck that follows.
      - name: Price plausibility audit
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        continue-on-error: true
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
        run: |
          rc=0; node price-audit.mjs || rc=$?
          if [ "$rc" -eq 20 ]; then node db-sync.mjs; elif [ "$rc" -ne 0 ]; then exit "$rc"; fi

      # Recheck (the authoritative sold-signal) is no longer here — it is its
      # own job below. Folded into finalize it shared this 240-minute budget
      # with enrichment and db-sync, and because recheck commits its whole
      # night in one terminal write, every time finalize hit the ceiling
      # mid-recheck the entire sold-signal was thrown away (delistings went
      # 2,186/night → 0 over 08-17…19, and sold cars stayed on the site).

      # Re-judge already-admitted rows against today's classification rules.
      # ingest decides once and never revisits; recheck only asks "still for
      # sale?", which a real car answers yes to forever. That gap kept six
      # plug-in-hybrid Polestar 1s live, one at $157,049. Reports only —
      # exit 10 means it found some, and the run should say so loudly without
      # failing the night's ingest.
      - name: Audit admitted listings against current rules
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        continue-on-error: true
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          rc=0; node audit-listings.mjs --write-vins /tmp/non-ev-vins.txt || rc=$?
          if [ "$rc" -eq 10 ]; then
            echo "::warning::Listings admitted under old rules are no longer EVs by vPIC — see /tmp/non-ev-vins.txt"
          elif [ "$rc" -ne 0 ]; then exit "$rc"; fi

      # Which lots reached us with the odometer missing on (nearly) every used
      # car — a broken platform parser, not bad luck. Report-only like the EV
      # audit above; the baseline is today's known-broken count, so a NEW lot
      # going dark shouts and the backlog doesn't. Lower --max-broken-dealers as
      # per-platform parsers land (dealer.com/DealerOn odometer capture).
      - name: Audit listing completeness by dealer
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        continue-on-error: true
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          rc=0; node completeness-audit.mjs --max-broken-dealers 202 || rc=$?
          if [ "$rc" -eq 10 ]; then
            echo "::warning::A dealer's used cars lost their mileage (broken platform parser) — see the step log for the lot list"
          elif [ "$rc" -ne 0 ]; then exit "$rc"; fi

      # Re-derive the observed trim-per-VIN-cohort table now that tonight's
      # listings are settled (migration 0020). Not `if: schedule` — a manual
      # run changes inventory too, and a stale matview is the failure this
      # migration exists to prevent.
      - name: Refresh observed VIN variants
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
        run: node refresh-variants.mjs

      # Washington transaction prices refresh monthly upstream.
      - name: Refresh Washington price comps (5th of the month)
        if: ${{ github.event_name == 'schedule' }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
        # --months 0 = the whole archive back to 2016. The load REPLACES the
        # table, so a windowed pull here would truncate the full history the
        # model's depreciation work depends on.
        run: '[ "$(date +%d)" = "05" ] && node wa-prices.mjs --months 0 || echo "not the 5th, skipping"'

      # Name the versions behind those sales (migration 0016). Runs with the
      # price refresh because that is when new VIN cohorts appear — a model
      # year nobody has decoded shows up as "Unknown" until this runs.
      # Only the vPIC half needs a job; vin_variant_observed is a view over
      # live listings and is always current.
      - name: Refresh VIN variant decodes (5th of the month)
        if: ${{ github.event_name == 'schedule' }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
        run: '[ "$(date +%d)" = "05" ] && node vpic-variants.mjs || echo "not the 5th, skipping"'

      # Tell the site its data changed. The browse feed is cached a full day
      # (web/lib/listings/db.ts) because it changes exactly when this
      # pipeline runs — this step is the "it just ran" signal. It expires the
      # feed cache tag, then warms the six index shards so the one nightly
      # database walk happens here instead of on a shopper. always(): even a
      # night that failed after db-sync changed the data, and revalidating a
      # night that changed nothing costs one walk. A missing secret or an
      # old deploy without the route degrades to the 24-hour cache backstop —
      # stale by at most a day, and the warning below says which happened.
      - name: Revalidate the site's feed cache
        if: always()
        env:
          FEED_REVALIDATE_SECRET: ${{ secrets.FEED_REVALIDATE_SECRET }}
        run: |
          [ -z "$FEED_REVALIDATE_SECRET" ] && { echo "::warning::FEED_REVALIDATE_SECRET unset; site refreshes on the 24h cache backstop instead"; exit 0; }
          if ! curl -fsS --retry 3 --max-time 60 -X POST -H "x-revalidate-secret: $FEED_REVALIDATE_SECRET" https://voltcheck.net/api/revalidate; then
            echo "::warning::/api/revalidate unreachable (route not deployed yet?); site refreshes on the 24h cache backstop instead"
            exit 0
          fi
          for s in first 0 1 2 3 4 5; do
            curl -fsS --retry 2 --max-time 300 -o /dev/null "https://voltcheck.net/api/index/$s" \
              || echo "::warning::shard $s warm-up failed; its first visitor pays the render"
          done

      # The JSON snapshot is the web app's fallback when Supabase is
      # unreachable, so it needs to stay current in the repo.
      # Supabase already has the listings by this point, so the site is
      # updated whether or not this commit lands. Retry around the discovery
      # sweep's writes, and warn rather than fail if we lose the race — a
      # red X here would wrongly imply the crawl itself failed.
      - name: Commit refreshed data
        if: always()
        run: |
          git config user.name "voltcheck-bot"
          git config user.email "noreply@github.com"
          # gm-warranty.json is the per-VIN cache: committing it is what makes
          # the lane cheap, because a VIN already in it is never asked again.
          # Lose it and the next run re-fetches every car from scratch.
          git add scraper/registry/registry.json scraper/registry/gm-warranty.json web/data/scraped-listings.json
          git diff --staged --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Nightly: registry + listings refresh [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then
              echo "data refresh pushed"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "::warning::Could not push the data refresh (likely raced the discovery sweep). Supabase already has tonight's listings; the repo snapshot will catch up on the next run."

  # The authoritative sold-signal, split out of finalize (2026-08-19). Its own
  # job means its own clock. recheck fetches every live dealer listing's page
  # and commits the result — every 404 a delisting — in one terminal write, so
  # sharing finalize's 240-minute budget meant a timeout mid-run discarded the
  # entire night's removals (delistings fell 2,186/night → 0 over 08-17…19 and
  # sold cars stayed live). --deadline-min stops fetching with time to spare and
  # writes what it found; a slow night lands partial delistings, the rest wait
  # for tomorrow. always() + probe success: it must run even when finalize timed
  # out, because it reads live rows straight from the DB, not from finalize.
  recheck:
    needs: [probe, finalize]
    if: ${{ always() && needs.probe.result == 'success' && github.event.inputs.skip_crawl != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recheck live listings
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
        # Deadline sits ~50 min under the job timeout so the terminal write
        # always lands; concurrency unchanged from when this ran in finalize.
        run: node recheck.mjs --concurrency 10 --deadline-min 280
      # Expire the feed cache so tonight's delistings leave the site now, not on
      # tomorrow's revalidate — finalize's earlier revalidate carried the
      # crawl's data, this one carries recheck's removals. Same degrade-to-24h
      # backstop as finalize's copy.
      - name: Revalidate the site's feed cache
        if: always()
        env:
          FEED_REVALIDATE_SECRET: ${{ secrets.FEED_REVALIDATE_SECRET }}
        run: |
          [ -z "$FEED_REVALIDATE_SECRET" ] && { echo "::warning::FEED_REVALIDATE_SECRET unset; site refreshes on the 24h cache backstop instead"; exit 0; }
          if ! curl -fsS --retry 3 --max-time 60 -X POST -H "x-revalidate-secret: $FEED_REVALIDATE_SECRET" https://voltcheck.net/api/revalidate; then
            echo "::warning::/api/revalidate unreachable; site refreshes on the 24h cache backstop instead"
            exit 0
          fi
          for s in first 0 1 2 3 4 5; do
            curl -fsS --retry 2 --max-time 300 -o /dev/null "https://voltcheck.net/api/index/$s" \
              || echo "::warning::shard $s warm-up failed; its first visitor pays the render"
          done
