name: Nightly inventory

# The pipeline used to run from a laptop via launchd, which meant it only
# ran when the lid happened to be open at 3:30 AM — mostly never. This runs
# it on GitHub's machines instead.
#
# THIS WORKFLOW NO LONGER CRAWLS DEALERS (2026-08-22). rolling-crawl.yml does,
# a slice of the registry every half hour, and the eight-shard whole-fleet
# crawl that used to live here is gone — see the block where the `crawl` job
# was, below, for what made that safe and what had to be rehomed first. What
# is left is the work no slice does: dealer discovery, the OEM locator lanes,
# the delisting sweep, the audits, and the monthly refreshes.
#
# The history below is kept because the reasoning still governs the jobs that
# remain, and because it is the record of what this pipeline learned.
#
# Sharded 2026-08-13 (crawl now retired, see above): a single job hit the
# 330-minute cap at ~650 working domains, and nothing reaches Supabase until
# after the crawl — so a crawl that missed the window persisted zero cars. The
# crawl fanned out across a fixed matrix and a finalize job merged shard
# outputs before enrichment and sync. A shard that died cost its slice, not
# the night: db-sync only delists for domains whose report says complete, so
# missing shards certify nothing. That last property is exactly what lets
# rolling-crawl.yml carry the crawl one slice at a time now.
#
# finalize was itself split three ways 2026-08-21, after five straight lost
# nights (Aug 18, 19, 19-manual, 20, 21). It was one job with one 240-minute
# clock shared by merge, harvest, vPIC enrichment, ingest, db-sync, six
# report/refresh steps, revalidate, and the commit — so a slow enrichment
# pass or a slow ingest starved db-sync, the only step a shopper's browser
# ever depends on. a7792ee/d97bd22 (2026-08-20) made that failure LOUD (time-
# capped enrichment, and a revalidate that refuses to warm the cache when
# db-sync didn't actually run) but didn't make success likely — a sixth night
# was lost the same way (run 32474806496, 2026-08-21): the job's 240-minute
# clock ran out and db-sync never ran. Reading that run's own log afterward
# found the vPIC pass was NOT the cause that night — it completed cleanly in
# 85 minutes, inside its own cap. gm-warranty.mjs (a separate step, no
# deadline of its own; see its timeout below, added the same day) hung for
# the following 2h35m retrying VINs against a GM endpoint that was returning
# HTTP 500 for all of them, and ingest never even started. The clock split
# below still stands on its own merits (nothing downstream shares finalize-
# prep's budget with finalize-ingest's anymore, so THIS failure mode — a
# slow/hung step earlier in the pipeline preventing db-sync from getting a
# turn at all — cannot recur once every step in the chain has its own cap).
#
# Separately, checkpointing every 2 minutes into out/listings.json (a7792ee's
# other half) turned out not to be the fix it claimed to be: merge-shards.mjs
# regenerates listings.json from scratch every night from that night's fresh
# crawl shards, so that checkpoint never survived past the run that wrote
# it — confirmed by 32474806496's own log, which shows a full, clean 110,186-
# VIN decode that was then discarded when the job was cancelled hours later
# for the gm-warranty reason above, with nothing to show for the 85 minutes
# it took. vpic-enrich.mjs now checkpoints into a VIN-keyed cache file instead
# (registry/vpic-cache.json, committed to the repo like gm-warranty.json below
# it) — a decode is permanent once made, so a completed pass is never lost
# again and the backlog shrinks run over run instead of resetting.
#
# Now three jobs, each with its own clock, state handed forward as artifacts
# exactly like the crawl→finalize handoff above:
#   finalize-prep    merge + harvest + vPIC enrichment. Allowed to be slow,
#                    allowed to run its enrichment cap all the way out —
#                    nothing downstream shares its budget anymore.
#   finalize-ingest  ingest + db-sync + price-audit + revalidate. Small,
#                    fast, and now UNSTARVABLE: it gets a fresh timeout no
#                    matter how long finalize-prep took, so the one step that
#                    changes what a shopper sees stops being a coin flip.
#   finalize-audits  colisting-sync, the EV-rules and completeness audits,
#                    the variant/price-comp refreshes, and the data commit —
#                    archival and report-only, never on the path to a
#                    shopper's browser.
#
# vPIC enrichment stays BEFORE ingest, in finalize-prep, on purpose — ingest
# keeps only evConfidence "high", and vpic-enrich.mjs is what promotes
# name-match listings to "high" (a brand-new EV whose page omitted fuel
# type) AND demotes fuel-text-only "high" rows vPIC refutes (the 2015 Prius
# Two that shipped as an EV because its page said fuelType "Electric",
# 2026-08-15). Running ingest+sync as their own scheduled job on their own
# cadence, decoupled from enrichment entirely, was considered and rejected:
# it would let a fuel-text-only false EV reach Supabase and stay live for a
# full night before the next enrichment pass caught it — the exact
# false-claim shape the house rule on claims exists to prevent. Splitting
# the JOB, not the ORDER, is what fixes the clock problem without touching
# that guarantee.
on:
  schedule:
    - cron: "30 10 * * *" # 03:30 America/Los_Angeles (10:30 UTC)
  # On demand, with bootstrap-scale knobs. The scheduled defaults are tuned
  # for steady state (inventory changes slowly); while building initial
  # coverage the limiting factor is how fast new dealers get validated and
  # crawled for the first time, which is a one-time cost per dealer.
  workflow_dispatch:
    inputs:
      probe_limit:
        description: "Dealers to validate this run (steady state 300; bootstrap 2000+)"
        required: false
        default: "300"
      max_pages:
        description: "Page budget per non-group dealer"
        required: false
        default: "80"
      skip_crawl:
        description: "Probe only — useful when clearing a large discovery backlog"
        required: false
        default: "false"
      recover_run_id:
        description: >-
          Run ID of a prior nightly run whose finalize-prep already merged and
          enriched a night's crawl but never reached Supabase (a lost night).
          When set, probe/crawl/oem-locator/finalize-prep/finalize-audits/
          recheck are all skipped and finalize-ingest downloads that run's
          finalize-prep-out/finalize-prep-registry/finalize-prep-vpic-cache
          artifacts instead of this run's own — turning what used to be a
          several-step manual recovery
          (merge-shards, ingest, db-sync, revalidate by hand from downloaded
          crawl-out-* artifacts) into filling in one field. Leave blank for a
          normal run.
        required: false
        default: ""

# Deliberately NOT sharing a group with the discovery sweep. They both touch
# registry.json, but blocking the crawl behind a multi-hour sweep means the
# site can't refresh while discovery runs — unacceptable during bootstrap.
# The commit step below handles the write race instead.
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write # commits the refreshed registry and per-VIN caches

env:
  # Kept for the OEM locator lane's artifact naming and the recovery paths that
  # read crawl-out-* from an older run's artifacts; nothing in this workflow
  # shards a crawl any more.
  SHARDS: "8"

jobs:
  # Validate newly discovered dealers first, so the rooftops that pass are in
  # the registry before rolling-crawl.yml's next sweep reaches their slice. The probed registry travels to the other
  # jobs as an artifact — shards must see tonight's promotions, and the
  # finalize-audits job commits this exact file. Skipped entirely during an
  # ingest-only recovery run: a recovery re-plays an already-crawled night,
  # it validates nothing new.
  probe:
    if: ${{ github.event.inputs.recover_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe discovered dealers
        working-directory: scraper
        run: node probe.mjs --limit ${{ github.event.inputs.probe_limit || '300' }} --concurrency 12
      # Re-check the rows a previous night could not get an answer out of. A
      # "transient" verdict means something did not answer — a timeout, a 429,
      # a 5xx — not that the lot is empty. Two rooftops promoted this way on
      # 2026-08-23 with 319 and 528 vehicles, minutes after being scored as
      # nothing at concurrency 3. Near-serial
      # and capped so it costs minutes, not the probe budget; the rows it promotes
      # are dealers we already had. --no-retry because this step IS the slow
      # retry — letting it run its own second pass would double the slowest
      # thing per row.
      - name: Re-probe last night's unanswered dealers
        working-directory: scraper
        run: node probe.mjs --status needs-investigation --verdict transient --limit 40 --concurrency 2 --no-retry
      - uses: actions/upload-artifact@v4
        with:
          name: registry
          path: scraper/registry/registry.json

  # THE WHOLE-FLEET DEALER CRAWL LIVED HERE AND IS GONE (2026-08-22).
  #
  # rolling-crawl.yml crawls the same rooftops — the two lanes selected them
  # with character-for-character identical code:
  #
  #     doms = sorted(s['domain'] for s in r['sites'] if s.get('status') == 'working')
  #
  # 13,165 working rooftops, split 8 ways here and 48 ways there. Keeping both
  # meant crawling every dealer twice a day and, far worse, handing this
  # database ~100,000 rows in one 37-chunk push. That push is what has failed
  # every scheduled night this month: eight chunks in, then 504, 504, 503,
  # "connection termination". rolling-crawl.yml was added to end exactly that
  # burst and says so in its own header — but the commit that added it touched
  # only itself (f2a1a71, 207 insertions, one file), so the thing being
  # replaced was never switched off and both lanes ran.
  #
  # WHAT MADE THIS SAFE TO CUT, rather than just smaller: delisting is opt-in
  # per domain and always has been. db-sync.mjs only delists domains whose
  # report says `truncated === false`, and "a report without the `truncated`
  # field — older crawl.mjs, or no crawl this run — certifies nothing, so
  # nothing gets delisted". A lane that does not crawl a rooftop cannot
  # delist that rooftop's cars. This job's absence removes dealer domains
  # from tonight's report.json and therefore removes nightly's permission to
  # delist them; rolling-crawl.yml carries that permission now, slice by
  # slice, which is what its delist-coverage denominator fix (def9b87) made
  # legal.
  #
  # AND WHAT HAD TO BE REHOMED FIRST: ingest.mjs rewrites
  # web/data/scraped-listings.json with whatever it just processed. With this
  # job gone nightly ingests only the OEM locator lanes, so leaving the commit
  # in place would have shrunk the outage snapshot to ~38,000 cars — worse
  # than the 58,730 it had drifted to, and the 2026-08-16 incident's exact
  # shape. refresh-fallback.yml owns that file now: it walks the database
  # weekly and never crawls anything. That workflow landed before this cut,
  # deliberately, and this job could not have gone first.
  #
  # WHAT NIGHTLY STILL DOES, and why it is still a workflow: probe (dealer
  # discovery), oem-locator (~38k EVs from OEM APIs that no dealer crawl
  # reaches), recheck (the delisting sweep over live listings), the price and
  # count audits, the co-listing graph, and the monthly WA/variant refreshes.
  # None of those are a dealer crawl and none of them are duplicated by the
  # slices.

  # OEM find-inventory locators (GM brands): dealer-authorized public JSON
  # endpoints that list every franchised rooftop's new-EV stock — including
  # the ~1.5k dealer domains whose own sites are bot-walled. Independent of
  # the registry (no probe dependency), and its output is shaped exactly like
  # a crawl shard, so the crawl-out-* artifact pattern sweeps it into the
  # same merge. If it dies, its domains simply certify nothing tonight.
  oem-locator:
    if: ${{ github.event.inputs.skip_crawl != 'true' && github.event.inputs.recover_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull OEM locator inventory
        working-directory: scraper
        run: node oem-locator.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: crawl-out-oem
          path: scraper/out/

  # Merge shard outputs and run vPIC enrichment. always() + probe success:
  # this must run even when some shards failed (their work is simply absent
  # from the merge) and when the crawl was skipped (probe-only runs still
  # need their registry pass-through, see below). Nothing here reaches a
  # shopper directly — that's finalize-ingest's job, on its own clock — so
  # this one is allowed to be slow. Its whole output (merged listings/report/
  # colisting-pairs and the harvest-updated registry) travels forward as two
  # artifacts, same pattern as the crawl→finalize handoff above.
  finalize-prep:
    needs: [probe, oem-locator]
    if: ${{ always() && needs.probe.result == 'success' && github.event.inputs.recover_run_id == '' }}
    runs-on: ubuntu-latest
    # Raised from finalize's old 240m: crawl and recheck already run at 330m
    # (the GitHub-hosted-runner max is 360m) and there was no reason this job
    # was the tightest of the three — its old ceiling was sized to protect
    # ingest+db-sync's turn in the SAME job, which no longer happens now that
    # they have their own job and their own clock below.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: registry
          path: scraper/registry
      # continue-on-error since 2026-08-22, when the dealer crawl left this
      # workflow. This pattern used to match nine artifacts (eight crawl
      # shards plus the locator) and could only come back empty if every one
      # of them died; oem-locator is its ONLY producer now, and
      # download-artifact@v4 fails the step outright when a pattern matches
      # nothing.
      #
      # To be precise about what this does and does not buy: the night still
      # fails if the locator produced nothing — merge-shards.mjs exits 1 on an
      # absent out/shards, and a night with no inventory at all SHOULD be
      # loud. What changes is who says so. Without this the run dies on an
      # artifact-plumbing error that reads like broken CI; with it, the next
      # step says "merge-shards: out/shards does not exist", which is the
      # actual fact. The audits are unaffected either way: finalize-audits and
      # recheck are both always()-gated on probe, not on this job.
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        continue-on-error: true
        with:
          pattern: crawl-out-*
          path: scraper/out/shards
      - name: Merge shard outputs
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        working-directory: scraper
        run: node merge-shards.mjs

      # The OEM locator lanes link each car to a VDP on the selling dealer's
      # own site. Any host we aren't tracking becomes a "discovered" registry
      # row (name/city/state ride along from the listing), which tomorrow's
      # probe validates like any other discovery — free registry growth from
      # pages tonight's run already fetched. Appends only; never edits rows.
      - name: Harvest dealer rooftops from locator VDP hosts
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        working-directory: scraper
        run: node harvest-dealers.mjs --write

      - name: VIN enrichment (vpic)
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        working-directory: scraper
        run: |
          # Time-cap vpic-enrich so a huge backlog can never eat this job's
          # whole budget either. Raised from 150m to 300m on the 2026-08-21
          # split: 150m was sized to leave room for gm-warranty + ingest +
          # db-sync + six audit/refresh steps + revalidate, all sharing THIS
          # job's clock. None of that runs here anymore — merge-shards and
          # harvest-dealers together take minutes, not hours — so enrichment
          # can now use nearly this job's entire 330m ceiling and shrink the
          # backlog faster, with zero risk to the sync those other steps used
          # to threaten.
          #
          # 2026-08-20 03:30 run (32361191733): the first full crawl after the
          # crawl-timeout fix handed finalize a huge new-VIN backlog; unsharded,
          # vPIC-rate-limited enrichment ran the entire old 240m job cap and was
          # cancelled, so the steps AFTER it — ingest, db-sync, revalidate —
          # never ran and the night's crawl never reached prod (shoppers kept
          # seeing stale prices; recovered by hand from the crawl-out-*
          # artifacts). The 2026-08-21 split removes that failure mode
          # structurally instead of just widening the cap further: ingest and
          # db-sync now live in a separate job with their own clock, so even a
          # night that runs this cap all the way out cannot starve the sync.
          #
          # Reordering db-sync ahead of enrichment (the other option on the
          # table, and considered again for this split — see the top-of-file
          # comment) was rejected: ingest.mjs keeps only evConfidence === "high",
          # and vpic-enrich is what promotes name_match listings to "high" (a
          # brand-new EV whose dealer page omitted fuel type) AND demotes
          # fuel-text-only "high" rows that vPIC refutes (the 2015 Prius Two
          # that shipped as an EV because its page said fuelType "Electric",
          # 2026-08-15). Ingesting before enrichment runs would drop real EVs
          # and admit non-EVs unrefuted — the exact false-claim shape the house
          # rule on claims exists to prevent. So enrichment stays before
          # ingest, capped, with a positive fallback for when it's cut short.
          #
          # vpic-enrich.mjs checks registry/vpic-cache.json (checked out from
          # the last commit, below) before ever asking vPIC for a VIN, and
          # writes every answer — including a genuinely empty one — back into
          # that same file every 2 minutes as batches arrive, same interval as
          # crawl.mjs's shard checkpoint. A vPIC decode is immutable per VIN,
          # so this cache is what actually makes a `timeout` kill
          # non-destructive: whatever was decoded before the kill is decoded
          # forever, and the backlog shrinks run over run. (The OLD checkpoint
          # here wrote only to out/listings.json, which merge-shards.mjs
          # regenerates from scratch every night — that checkpoint could not
          # survive a runner teardown and never actually shrank anything; see
          # the top-of-file comment.) The cache file travels forward via the
          # finalize-prep-vpic-cache artifact below and is committed to the
          # repo by finalize-audits, exactly like gm-warranty.json.
          timeout 300m node vpic-enrich.mjs || echo "vpic-enrich hit its 300m time cap — continuing so the merged output still ships; every VIN decoded so far is already saved in registry/vpic-cache.json and will not be re-fetched tomorrow, only genuinely new VINs will be"

      # Make sure scraper/out/ exists even in skip_crawl (probe-only) mode,
      # where nothing above wrote it — otherwise the upload below has nothing
      # to find and errors instead of shipping an (empty, expected) artifact.
      - name: Ensure out/ exists for the handoff
        if: always()
        run: mkdir -p scraper/out

      # Hands the merged+enriched state to finalize-ingest, same pattern as
      # the crawl→finalize-prep handoff above. always(): a partial or
      # cancelled run should still ship whatever it produced rather than
      # leaving finalize-ingest with nothing to work from.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finalize-prep-out
          path: scraper/out/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finalize-prep-registry
          path: scraper/registry/registry.json
      # The vPIC decode cache, separate from the registry artifact above
      # because it's updated here (by vpic-enrich.mjs) rather than by probe.
      # always(): a time-capped or cancelled run must still hand forward
      # whatever it decoded before being cut off — that's the entire point of
      # checkpointing into this file instead of only out/listings.json.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finalize-prep-vpic-cache
          path: scraper/registry/vpic-cache.json
          if-no-files-found: warn

  # Ingest + db-sync + revalidate — the only steps a shopper's browser
  # actually depends on — split out on 2026-08-21 specifically so they get a
  # clock nothing upstream can spend. needs finalize-prep for the normal
  # nightly artifact handoff, but always() + the recover_run_id escape hatch
  # below let this job run standalone against an OLDER run's finalize-prep
  # output — that is the one-click recovery path for a night whose
  # finalize-prep succeeded but whose sync never happened.
  finalize-ingest:
    needs: [probe, finalize-prep]
    if: ${{ always() && (github.event.inputs.recover_run_id != '' || needs.probe.result == 'success') }}
    runs-on: ubuntu-latest
    # Small and bounded on purpose: everything left in this job (gm-warranty,
    # ingest, db-sync, the price audit, revalidate) does NOT scale with the
    # vPIC backlog the way enrichment does, and the whole point of splitting
    # it out is that it must not need a large budget to be reliable. But 90m
    # was sized on the assumption that only ingest+db-sync+audit+revalidate
    # lived here, sharing the old 240m finalize's leftover — it under-counted
    # gm-warranty, which sat in this job from the start and on 2026-08-21 (run
    # 32474806496) ran 2h35m without finishing 600 VINs (root cause: its own
    # per-VIN retry ladder, fixed in gm-warranty.mjs — see the timeout below).
    # Re-sized from real numbers instead of guessing again:
    #   - gm-warranty: now hard-capped at 30m below (600 VINs at its ~1.2s
    #     pace need ~12m even with zero cache hits; 30m leaves room for a
    #     GM-side outage without room to repeat 2026-08-21).
    #   - db-sync + price-audit: a clean night (run 32044269696, 2026-08-17,
    #     ~70k rows) measured 6m29s + 12m3s = ~19m. Both share retry.mjs's
    #     default 30/120/240s ladder per chunk (sized to outlast Supabase's
    #     ~2-minute OOM recovery) — a bad night needing that ladder on even a
    #     couple of chunks plausibly costs tens of minutes more than the clean
    #     baseline (a same-day recovery db-sync outside this workflow was
    #     observed retrying across 13 chunks), so budget generously rather
    #     than from the clean-night number alone.
    #   - revalidate + checkout/setup overhead: a few minutes.
    # Sum of worst-cases lands near 90m already before any margin, which is
    # exactly the "no margin" state that let gm-warranty starve this job in
    # the first place. 150m gives real headroom while staying well under
    # finalize-prep's 330m and the 360m GitHub-hosted max — raising this
    # ceiling is cheap, so size it for a bad night, not an average one.
    timeout-minutes: 150
    permissions:
      contents: read # only reads the repo (no commit happens in this job)
      actions: read # needed for the cross-run artifact download below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Cross-run download unconditionally (modulo skip_crawl below): when
      # recover_run_id is unset it falls back to `|| github.run_id`, i.e.
      # this run's own finalize-prep — identical behavior to a plain
      # same-run download-artifact, just always routed through the
      # run-id-aware form. That means the recovery path exercises the exact
      # same code every normal night runs, instead of being a rarely-tested
      # branch.
      #
      # skip_crawl (probe-only) gate on the out/ download only: finalize-prep
      # ships an empty out/ artifact in that mode (nothing crawled, nothing
      # merged) and nothing below reads it — gm-warranty/ingest are
      # themselves skip_crawl-gated — so downloading it would just be an
      # artifact-not-found failure for no reason. registry.json always
      # exists (probe writes it every run) and finalize-audits' commit needs
      # it passed through even in probe-only mode, so that download stays
      # unconditional.
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        with:
          name: finalize-prep-out
          path: scraper/out
          run-id: ${{ github.event.inputs.recover_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: finalize-prep-registry
          path: scraper/registry
          run-id: ${{ github.event.inputs.recover_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Unconditional like registry.json above: the cache exists every run
      # (checked out from the last commit even when nothing new was decoded
      # tonight) and finalize-audits' commit needs it passed through so a
      # probe-only or recovery run doesn't accidentally regress the
      # committed cache on its next re-upload.
      - uses: actions/download-artifact@v4
        with:
          name: finalize-prep-vpic-cache
          path: scraper/registry
          run-id: ${{ github.event.inputs.recover_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Measure the lane churn BEFORE the ingest below causes it. This is the
      # only moment the database still holds the previous owner of every VIN
      # this run is about to claim, so it is the only moment the number can be
      # taken. Read-only, never fails the run — see the script's header for
      # what the number means and why dealer_domain is not a stable fact.
      - name: Who owned these cars before tonight
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        continue-on-error: true
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node lane-flip-check.mjs

      - name: GM per-VIN warranty and ingest
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        working-directory: scraper
        run: |
          # Per-VIN battery coverage from GM's owner portal. Bounded per night
          # (a few thousand VINs on the first pass, none once cached) and
          # never fatal: a car without it falls back to abstaining, which is
          # the same thing the site did before this lane existed. Must run
          # before ingest — it writes batteryCoverage/campaignCheck directly
          # onto out/listings.json records, which ingest.mjs reads.
          #
          # timeout 30m: this job's entire budget exists to guarantee ingest
          # and db-sync happen, and on 2026-08-21 (run 32474806496, job
          # 96775025417) gm-warranty is what broke that guarantee — vpic-
          # enrich (in the separate finalize-prep job) finished cleanly at
          # 14:12:35Z, well inside its own cap, then gm-warranty ran from
          # 14:12:36Z to this job's 16:47:43Z cancellation (2h35m) without
          # finishing 600 VINs, and db-sync never ran. The log showed the
          # actual cost: 21 distinct VINs each burned the full 30/120/240s
          # retry ladder (390s) on an HTTP 500 that this endpoint returns as
          # its NORMAL answer for "not a GM vehicle" (see the control test in
          # gm-warranty.mjs) — over two hours of pure waiting for retries that
          # were never going to succeed. That is the actual root cause, and
          # it is fixed at the source in gm-warranty.mjs (short waits, the
          # same fix vpic-enrich.mjs already carries for the same class of
          # external-API call). This timeout is the backstop, not the fix: an
          # unrelated GM-side outage or a new failure mode must still not be
          # able to spend this job's clock. 30m comfortably covers 600 VINs
          # at the ~1.2s pace even with a retry on every one of them, and
          # whatever gets answered before a cut-short run is cached in
          # registry/gm-warranty.json, so nothing already answered is re-asked
          # tomorrow.
          timeout 30m node gm-warranty.mjs --limit 600 || echo "gm-warranty hit its 30m cap — continuing so ingest and db-sync still run; VINs already answered are cached in registry/gm-warranty.json and won't be re-fetched"
          node ingest.mjs

      - name: Sync to Supabase
        id: db_sync
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
        run: node db-sync.mjs

      # Sanity-check every price against WA sale medians (the vanhyundai
      # accessories-total incident, 2026-08-14). Implausible prices are
      # re-read from the dealer's own page or suppressed; exit 20 means the
      # listings JSON was corrected — sync once more, and the corrected
      # snapshot rides the data commit in finalize-audits. continue-on-error:
      # a broken comps lookup must not skip the revalidate that follows —
      # kept in this job (not finalize-audits) specifically so that
      # revalidate below still reflects any correction it makes.
      # `!cancelled()` rather than the default, and that is the whole point of
      # this line. This audit reads the LIVE database — the prices a shopper
      # can see right now — and it does not audit tonight's write. It used to
      # be an ordinary step, so a failed db-sync above skipped it, and on
      # 2026-08-22 audit-status-check reported that price-audit "has never
      # recorded a run" because db-sync had failed on every night it was
      # scheduled. A sync that fails is not a reason to stop checking what is
      # already published; if anything it is a reason to look harder.
      - name: Price plausibility audit
        if: ${{ !cancelled() && github.event.inputs.skip_crawl != 'true' }}
        continue-on-error: true
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
        # The rc=20 branch re-syncs what the audit corrected, and that is the
        # one part that must NOT run after a failed db-sync: it would hand a
        # second bulk write to an instance that just refused the first, which
        # is the contention rolling-crawl.yml exists to stop building. The
        # audit still runs and still records its verdict; only the re-sync
        # waits for a night the database was well.
        run: |
          rc=0; node price-audit.mjs || rc=$?
          if [ "$rc" -eq 20 ]; then
            if [ "${{ steps.db_sync.outcome }}" = "success" ]; then
              node db-sync.mjs
            else
              echo "::warning::price-audit corrected rows but db-sync failed earlier tonight; skipping the follow-up sync rather than re-loading a database that just refused a write. The corrections land on the next healthy sync."
            fi
          elif [ "$rc" -ne 0 ]; then exit "$rc"; fi

      # The listing-count regression alarm: six lost nights left every
      # downstream audit un-run and silent, and then — the night this was
      # built — a manual salvage sync dropped the live count from 87,082 to
      # 58,741 (~28k rows) with nothing automated noticing; a human found it
      # by curling the API. sync-guard.mjs reads the live count twice, a
      # short pause apart, GLOBAL and per LANE (national OEM-locator pulls vs
      # crawled dealer rooftops — a whole lane disappearing while others were
      # fine is exactly this incident's shape), and refuses to judge a read
      # that isn't stable between those two samples: the incident turned out
      # to be a render caught mid-write, not real data loss, and the correct
      # response to that is to wait, not to act. It never re-syncs, never
      # forces a revalidate, never deletes or restores anything — it only
      # alarms (registry/audit-status.json + this step's own exit code) and
      # the next step's gate decides whether to warm the cache. No
      # continue-on-error: a real regression or an unstable read must make
      # this job red, the same as db-sync failing outright.
      # `!cancelled()` for the same reason as the audit above, and more
      # sharply. This step's own header describes the incident it was built
      # for: "six lost nights left every downstream audit un-run and silent".
      # It was then written as an ordinary step, so a failed db-sync skipped
      # it — and six lost nights is exactly what happened, with this alarm
      # silent through all of them. It writes nothing (see the header), so
      # there is no state it can damage by running on a bad night, and a bad
      # night is when a count regression is most likely.
      - name: Listing-count regression check
        id: sync_guard
        if: ${{ !cancelled() && github.event.inputs.skip_crawl != 'true' }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node sync-guard.mjs

      # Tell the site its data changed. The browse feed is cached a full day
      # (web/lib/listings/db.ts) because it changes exactly when this
      # pipeline runs — this step is the "it just ran" signal. It expires the
      # feed cache tag, then warms the six index shards so the one nightly
      # database walk happens here instead of on a shopper. always(): even a
      # night whose price audit errored above should still reveal what
      # db-sync wrote. A missing secret or an old deploy without the route
      # degrades to the 24-hour cache backstop — stale by at most a day, and
      # the warning below says which happened.
      #
      # But always() must not paper over db-sync itself never running. That
      # was exactly the 2026-08-20 03:30 failure (32361191733): vpic-enrich
      # ate the whole job budget, "Sync to Supabase" was skipped, and this
      # step ran anyway and re-warmed yesterday's feed — a green revalidate on
      # a night that shipped nothing, so the run looked fine while shoppers
      # saw stale prices for 16+ hours before anyone noticed. So on a real
      # crawl night, check db-sync's own outcome first: a skip or failure here
      # means tonight's crawl never reached Supabase, and re-warming the cache
      # would only make that invisible. Fail loudly instead of revalidating.
      # This gate stays a same-job `steps.db_sync.outcome` reference on
      # purpose (db-sync and this step both live in finalize-ingest) — it
      # doesn't need to cross a job boundary, which is exactly what a7792ee/
      # d97bd22's guard needs to keep working unmodified through this split.
      # The sync_guard check below is the same idea applied to the 2026-08-21
      # incident: db-sync can succeed (every RPC call returns 200) while the
      # live count it just wrote is a mid-write snapshot or a real regression
      # — a "the write succeeded" signal was never going to catch either.
      - name: Revalidate the site's feed cache
        if: always()
        env:
          FEED_REVALIDATE_SECRET: ${{ secrets.FEED_REVALIDATE_SECRET }}
        run: |
          if [ "${{ github.event.inputs.skip_crawl }}" != "true" ] && [ "${{ steps.db_sync.outcome }}" != "success" ]; then
            echo "::error::db-sync did not complete (step outcome: '${{ steps.db_sync.outcome }}') — tonight's crawl has NOT reached Supabase. Skipping revalidate so the site does not look refreshed; re-run this workflow with recover_run_id set to this run's ID to retry just ingest+sync against the already-merged data, rather than waiting for tomorrow's run."
            exit 1
          fi
          if [ "${{ github.event.inputs.skip_crawl }}" != "true" ] && [ "${{ steps.sync_guard.outcome }}" != "success" ]; then
            echo "::error::sync-guard did not pass (step outcome: '${{ steps.sync_guard.outcome }}') — either a live-count regression past its fail threshold, or a read unstable enough that it could not be judged (see that step's log). Skipping revalidate rather than warming the cache with a snapshot nobody has confirmed is right; this needs a human, not a retry."
            exit 1
          fi
          [ -z "$FEED_REVALIDATE_SECRET" ] && { echo "::warning::FEED_REVALIDATE_SECRET unset; site refreshes on the 24h cache backstop instead"; exit 0; }
          if ! curl -fsS --retry 3 --max-time 60 -X POST -H "x-revalidate-secret: $FEED_REVALIDATE_SECRET" https://voltcheck.net/api/revalidate; then
            echo "::warning::/api/revalidate unreachable (route not deployed yet?); site refreshes on the 24h cache backstop instead"
            exit 0
          fi
          # 24 index shards since 2026-08-24 — keep in step with
          # web/lib/listings/pack.ts SHARDS, whose comment has the incident.
          for s in first $(seq 0 23); do
            curl -fsS --retry 2 --max-time 300 -o /dev/null "https://voltcheck.net/api/index/$s" \
              || echo "::warning::shard $s warm-up failed; its first visitor pays the render"
          done
          # And the sitemaps, which stopped being build artifacts on
          # 2026-08-22 (web/app/sitemap/[shard]/route.ts: prerendering them
          # walked the whole feed inside Next's 60-second budget and killed
          # four production builds in a row). They render on first request
          # and cache for the same day as the index shards, so this pass is
          # now what keeps a crawler's copy current. Warmed immediately after
          # the shards on purpose: db.ts's ten-minute walk memo is still
          # holding the walk the loop above just paid for, so these cost
          # no extra database read. A failure here is a stale sitemap, never
          # a wrong one — the route refuses to publish anything but a live
          # feed — so it warns rather than failing the night.
          # 12 sitemap shards since 2026-08-24 — keep in step with
          # web/lib/sitemap.ts SITEMAP_SHARDS, whose comment has the incident.
          for s in $(seq 0 11); do
            curl -fsS --retry 2 --max-time 300 -o /dev/null "https://voltcheck.net/sitemap/$s.xml" \
              || echo "::warning::sitemap shard $s warm-up failed; crawlers keep yesterday's copy until the next request renders it"
          done

      # Seven 200s do not mean seven correct bodies. The gate above decides
      # whether it is safe to WARM; this checks what the warm actually
      # produced, by counting rows. The 2026-08-21 incident is the case: five
      # shards served ~9,800 rows each, every endpoint answered 200, and it
      # stood for most of a day.
      - name: Verify what we just warmed
        if: always()
        continue-on-error: true
        working-directory: scraper
        env:
          FEED_REVALIDATE_SECRET: ${{ secrets.FEED_REVALIDATE_SECRET }}
        run: node feed-shard-check.mjs

      # Hand the ingest/sync results forward to finalize-audits: the
      # gm-warranty cache and registry (unchanged pass-through) together so
      # the commit step there gets both from one artifact, and the ingested
      # listings snapshot separately — kept as a RECOVERY artifact only, since
      # this job's ingest covers the OEM lanes rather than the whole fleet and
      # so must never be committed over the weekly snapshot (see
      # finalize-audits' commit step).
      # always(): a partial run should still ship whatever it produced.
      # skip_crawl-gated like its download above — in probe-only mode out/
      # was never downloaded, so there is nothing here to re-upload, and
      # finalize-audits' colisting-sync (the only consumer) is itself
      # skip_crawl-gated.
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event.inputs.skip_crawl != 'true' }}
        with:
          name: finalize-ingest-out
          path: scraper/out/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finalize-ingest-registry
          path: scraper/registry/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finalize-ingest-listings
          path: web/data/scraped-listings.json
          if-no-files-found: warn

  # Everything that is archival, report-only, AND needs tonight's own crawl
  # state to mean anything: which rooftops shared inventory (only visible in
  # this run's out/colisting-pairs.json, gone once the runner is deleted),
  # the monthly comp/variant refreshes, and the commit of the refreshed
  # registry and per-VIN caches (+ audit-status.json, see that step). None
  # of it is on the path to a shopper's browser — finalize-ingest's
  # revalidate already happened — so it gets its own job rather than sharing
  # a clock with (or risking) the sync. Skipped entirely during an
  # ingest-only recovery run, matching the manual recovery procedure this
  # replaces (merge, ingest, sync, revalidate — no audits, no commit).
  #
  # The EV-rules audit and the listing-completeness audit used to live here
  # too, gated on `needs.finalize-ingest.result == 'success'` like
  # colisting-sync above. That gate is right for colisting-sync (it reads
  # THIS run's crawl artifact) but was accidentally wrong for the other two —
  # both of them query the LIVE database directly and need nothing this run
  # produced, yet a finalize-ingest failure (the exact night they're most
  # needed) skipped them right along with the artifact-dependent step they
  # were only ever bundled next to. They moved to feed-audits.yml, on their
  # own schedule, decoupled from tonight's crawl/ingest entirely — see that
  # file for which checks genuinely need pipeline state (must stay here or in
  # finalize-ingest) versus which only need the live feed (belong there).
  finalize-audits:
    needs: [probe, finalize-ingest]
    if: ${{ always() && needs.probe.result == 'success' && github.event.inputs.recover_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # skip_crawl-gated: finalize-ingest only uploads this artifact when
      # there was a real crawl to hand forward (see its upload step); in
      # probe-only mode it doesn't exist, and colisting-sync below (the only
      # consumer) is itself skip_crawl-gated.
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.skip_crawl != 'true' }}
        with:
          name: finalize-ingest-out
          path: scraper/out
      - uses: actions/download-artifact@v4
        with:
          name: finalize-ingest-registry
          path: scraper/registry
      # DELIBERATELY NOT DOWNLOADED: finalize-ingest-listings, the snapshot
      # ingest.mjs wrote. Nothing in this job reads it — colisting-sync takes
      # finalize-ingest-out, and the enrichment-gap audit reads the CDN shards
      # — and pulling it in was actively harmful, which is why it is gone
      # rather than merely unused. See the commit step below.

      # NO co-listing step here any more, and its absence is the fix. It used
      # to read this run's out/colisting-pairs.json, which crawl.mjs wrote —
      # and crawl.mjs has not run in this workflow since 2026-08-22, when the
      # fleet crawl moved to rolling-crawl.yml. One VIN on two rooftops is a
      # thing only a dealer crawl can witness; what is left here is the OEM
      # locator, one domain per lane, which structurally cannot produce a pair.
      #
      # So the step could only ever report zero, and it did — every night, as
      # "0 multi-domain VINs tonight (expected thousands; check merge-shards)".
      # That reads like a broken collector. The collector is fine: rolling-crawl
      # runs colisting-sync 48 times a day against real slice data and recorded
      # ~1,150 co-listed VINs on 2026-08-24. What was missing was that lane
      # committing the liveness record, which it now does.
      #
      # Leaving this here was not free. Once nightly.yml's commit step was
      # unwedged (784f87e), this night's structural zero would have landed as
      # colisting-sync's authoritative record and reported a healthy lane as
      # failing — the check going from "never recorded" to "recorded, and
      # wrong", which is worse.

      # Which live listings resolve to NO enrichment row at all — the check
      # that should have existed from the start. The enrichment corpus
      # (web/lib/enrichment/data*.ts) is filled in by hand, model by model, as
      # someone thought of it, and nothing ever reconciled it against what's
      # actually live: a Ram ProMaster EV reached the site with a completely
      # empty enrichment card, and the owner found it by eye (2026-08-21).
      # This runs the production matcher (web/lib/enrichment/match.ts, plus
      # whatever backfill.ts contributes) against the CDN-cached browse
      # shards — the same voltcheck.net/api/index/0..5 a shopper's browser
      # reads — never Supabase directly, so it costs the database nothing and
      # is safe to run even while a db-sync is still writing. `always()`
      # because it audits the CURRENT live site, not tonight's crawl: it owes
      # nothing to finalize-ingest's result and should run whether tonight was
      # a full crawl, a probe-only night, or an upstream step failed.
      # Report-only, like the audits above: exit 10 means a NEW gap group
      # appeared (a model went live with no enrichment, or a previously-
      # matching row stopped matching) and the ratchet baseline needs
      # attention, not that tonight's data refresh is bad.
      #
      # THE RATCHET CONTRACT (rewritten 2026-08-25 — see
      # web/scripts/live-enrichment-gap.mjs's header for the full reasoning):
      # TWO asserts, PRIMARY and SECONDARY, because the group-count assert
      # alone has a blind spot a shopper would notice and this check
      # wouldn't. A "new gap group" only appears when a make+model with ZERO
      # prior listings gets its first one, or a row stops matching — so
      # filling a 1,653-listing cohort and filling a 38-listing cohort each
      # move the group count by exactly 1. A feed that's 90% covered but has
      # one huge uncovered segment can report the SAME group count as a
      # well-covered one; the count can't see which fix mattered more.
      #
      #   PRIMARY   --max-gap-share: the share of live listings with NO
      #             enrichment row at all, weighted by listings (what a
      #             shopper actually hits), not by distinct models. This is
      #             the number that fails the job on its own.
      #   SECONDARY --max-groups: the original ratchet, unchanged in
      #             mechanism, kept as a second tripwire for a wholly new
      #             model going live with zero coverage even when the feed's
      #             overall share barely moves.
      # Either one tripping fails the build; the step log names which.
      #
      # BOTH baselines calibrated together 2026-08-25, replacing the
      # 2026-08-22 group-only baseline (491 groups, 19,531 of 100,728 live
      # listings (19.4%) with no row, from a verified-healthy full walk).
      # Coverage work since then grew the enrichment corpus faster than the
      # feed grew: today's measurement is 12.4% of live listings (16,802 of
      # them) with no enrichment row, 311 distinct gap groups — down from
      # 19.4% despite the feed growing ~35%. --max-groups stays at 491
      # (unchanged, still comfortably above today's 311 — recalibrating it is
      # a separate exercise from today's share-ratchet fix).
      #
      # HOW today's number was measured, because it wasn't a clean single
      # run: shards 12-23 of /api/index/* (half the CDN-cached browse feed)
      # were serving cached 500s for the ~2h this was being measured — a live
      # incident discovered while doing this work, matching the exact
      # "sick database, no previous cache entry to fall back on" failure mode
      # this file's Supabase-health section describes; shards 0-11 stayed
      # healthy throughout. 12.4% is a direct measurement from those 12
      # healthy shards (a random ~50% hash sample per the shard-assignment
      # scheme in app/api/index/[shard]/route.ts, 67,990 listings, tight
      # enough that sampling noise is well under 0.5 points) — then verified
      # by replaying those same real shard bytes through the unmodified,
      # committed script end-to-end (doubled across all 24 slots via
      # --feed-base) and confirming it reproduces the identical 12.4%. The
      # live incident itself is a separate, outstanding problem — flagged
      # for the owner, not fixed here — and doesn't call this number's
      # accuracy into question, only its completeness margin (a clean
      # 24-shard read would tighten, not overturn, ±0.5 points either way).
      # Ratchet DOWN as rows land; never up to hide a regression.
      - name: Audit live listings against the enrichment corpus
        if: always()
        working-directory: web
        run: |
          rc=0
          node --experimental-strip-types --import ./scripts/ts-resolve-hook.mjs \
            scripts/live-enrichment-gap.mjs --out /tmp/live-enrichment-gap.json --top 60 \
            --max-gap-share 12.4 --max-groups 491 || rc=$?
          if [ "$rc" -eq 10 ]; then
            echo "::error::Live enrichment coverage regressed — either the no-enrichment-row share exceeded the 12.4% ceiling pinned 2026-08-25, or a new make/model gap group pushed past the 491-group baseline (a model went live with no enrichment, or a row stopped matching). See the step log's ranked list, its top-10-by-listing-count on a share failure, and /tmp/live-enrichment-gap.json."
            exit 10
          elif [ "$rc" -ne 0 ]; then exit "$rc"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-enrichment-gap
          path: /tmp/live-enrichment-gap.json
          if-no-files-found: warn
          retention-days: 14

      # Re-derive the observed trim-per-VIN-cohort table now that tonight's
      # listings are settled (migration 0020). Gated on finalize-ingest's own
      # result rather than skip_crawl — a probe-only run still needs this
      # (nothing upstream failed, there's simply nothing new to settle), but
      # a real crawl night whose db-sync failed should not refresh from
      # data that never actually landed.
      - name: Refresh observed VIN variants
        if: ${{ needs.finalize-ingest.result == 'success' }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
        run: node refresh-variants.mjs

      # Washington transaction prices refresh monthly upstream.
      - name: Refresh Washington price comps (5th of the month)
        if: ${{ needs.finalize-ingest.result == 'success' && github.event_name == 'schedule' }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
        # --months 0 = the whole archive back to 2016. The load REPLACES the
        # table, so a windowed pull here would truncate the full history the
        # model's depreciation work depends on.
        run: '[ "$(date +%d)" = "05" ] && node wa-prices.mjs --months 0 || echo "not the 5th, skipping"'

      # Name the versions behind those sales (migration 0016). Runs with the
      # price refresh because that is when new VIN cohorts appear — a model
      # year nobody has decoded shows up as "Unknown" until this runs.
      # Only the vPIC half needs a job; vin_variant_observed is a view over
      # live listings and is always current.
      - name: Refresh VIN variant decodes (5th of the month)
        if: ${{ needs.finalize-ingest.result == 'success' && github.event_name == 'schedule' }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
        run: '[ "$(date +%d)" = "05" ] && node vpic-variants.mjs || echo "not the 5th, skipping"'

      # The JSON snapshot is the web app's fallback when Supabase is
      # unreachable, so it needs to stay current in the repo.
      # Supabase already has the listings by this point, so the site is
      # updated whether or not this commit lands. Retry around the discovery
      # sweep's writes, and warn rather than fail if we lose the race — a
      # red X here would wrongly imply the crawl itself failed.
      - name: Commit refreshed registry
        if: always()
        run: |
          git config user.name "voltcheck-bot"
          git config user.email "noreply@github.com"
          # gm-warranty.json and vpic-cache.json are per-VIN caches: committing
          # them is what makes each lane cheap, because a VIN already in one
          # is never asked again. Lose either file and the next run re-fetches
          # every car from scratch — vpic-cache.json losing this race is
          # exactly the six-night outage this cache was built to end.
          # audit-status.json IS NOT STAGED HERE ANY MORE, and that is a fix,
          # not an omission. It used to ride along, and riding along is what
          # killed it: the two caches above are rewritten constantly by
          # rolling-crawl.yml (32 commits on 2026-08-23) and discover.yml, so
          # the rebase below hits a CONTENT conflict on them — and a content
          # conflict is not a race a retry can win. It aborts, retries, and
          # conflicts identically all five times. The last commit from this
          # step to land was 2026-08-21 16:47.
          #
          # Losing a cache commit costs a re-fetch. Losing audit-status.json
          # costs the answer to "did each check actually run?", and it cost
          # exactly that: price-audit and colisting-sync had NEVER carried a
          # recorded run, not because they weren't running but because their
          # record was collateral in a commit that never landed. That is how
          # 2026-08-23's price-audit result — the one that would have shown it
          # was auditing 38,000 of ~100,000 cars — stayed invisible.
          #
          # It now has its own step below, staged alone. feed-audits.yml has
          # always staged it alone and has always landed; that is the control
          # test this follows.
          # web/data/scraped-listings.json IS NOT STAGED HERE, and its absence
          # is the point. When this workflow still ran the whole-fleet crawl,
          # ingest.mjs's output was a whole-fleet view and committing it was
          # correct. That crawl is gone: nightly now ingests only the OEM
          # locator lanes, so ingest.mjs leaves this file holding ~38,000 cars
          # instead of ~100,000 — and this step was still committing it, every
          # night, over the ~100,000-row snapshot refresh-fallback.yml writes on
          # Sundays. The site would have served that silently during an outage,
          # every request 200, ~62,000 cars simply not there: the 2026-08-16 and
          # 2026-08-21 incident shape with a worse number, and precisely the
          # thing rolling-crawl.yml refuses to do for the same reason (see its
          # own note about not committing a slice's copy).
          #
          # Only a whole-fleet view may write that file, and this job no longer
          # has one. refresh-fallback.yml owns it: it walks live_listings_feed
          # weekly and crawls nothing.
          # ONE FILE PER COMMIT, and that is the fix. These three used to share
          # a commit, and sharing is what killed all of them: vpic-cache.json
          # is 28 MB on ONE LINE, which git cannot merge at all — any change by
          # two writers is a conflict on the same line, every time. It has
          # rolling-crawl.yml writing it 48 times a day, so this job lost every
          # overlap, aborted, retried into the identical conflict five times,
          # and dropped the whole commit. Nothing from this step had landed
          # since 2026-08-21 16:47, including gm-warranty.json, which was pure
          # collateral: 1,400 per-VIN warranty records with no conflict of
          # their own, unpublished for days because of a neighbour's.
          #
          # Each file now stands or falls alone, and the two per-VIN caches
          # combine by KEY instead of by text (merge-vin-cache.mjs) so a
          # concurrent writer composes with us instead of beating us. Same
          # reset-then-merge order as the audit record below — merging before
          # committing still conflicts; see that script's header.
          # A failed `git pull --rebase --autostash` is TWO failures wearing one
          # exit code, and only the first ever had a recovery. If the REBASE
          # conflicts, `git rebase --abort` cleans up. If the autostash RE-APPLY
          # conflicts there is no rebase in progress at all: `--abort` is a
          # silent no-op, and the unmerged index entries the failed apply left
          # behind outlive this step and wedge the whole JOB — every later
          # `git pull` dies with "Pulling is not possible because you have
          # unmerged files" before it can do anything.
          #
          # That is not a rare race here, it is the normal case: the pull
          # fast-forwards over rolling-crawl.yml's vpic-cache.json commit (48 a
          # day), and vpic-cache.json is 28 MB on ONE LINE, so re-applying our
          # copy of it is always a conflict on that line. Measured 2026-08-24
          # 13:17: registry.json's very first attempt wedged the index, all five
          # of its retries failed identically, and so did all five of the
          # audit-liveness step's below — which is how colisting-sync and
          # sync-guard lost their records that night even after 5762d64 had
          # given them a commit of their own precisely so a cache could not take
          # them down. Giving the record its own commit was necessary and not
          # sufficient: it also needs an index it can commit from.
          unwedge() {
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            # The only thing that actually clears unmerged entries: take the
            # whole directory back to HEAD. Safe because every file this step
            # writes was copied to RUNNER_TEMP before the first git command ran.
            git checkout -f HEAD -- scraper/registry 2>/dev/null || true
            git stash list 2>/dev/null | grep -q . && git stash drop >/dev/null 2>&1
            return 0 # never let this trip `bash -e` -- it is the recovery path
          }

          specs=("registry/registry.json:0:registry"
                 "registry/gm-warranty.json:1:GM warranty cache"
                 "registry/vpic-cache.json:0:vPIC cache")
          # Copy ALL of them up front, before any git command. unwedge() rewinds
          # the whole registry directory, so a per-iteration `cp` would hand the
          # later iterations HEAD's copy instead of tonight's: the vPIC cache
          # would compare equal, report "nothing to commit", and every VIN in it
          # would be silently re-fetched tomorrow. That is the outage this cache
          # exists to prevent, arriving through the fix for it.
          for spec in "${specs[@]}"; do
            f="${spec%%:*}"
            cp "scraper/$f" "${RUNNER_TEMP:-/tmp}/$(basename "$f")" 2>/dev/null || true
          done
          # audit-status.json is saved HERE, by the step that does not commit it,
          # and that is the point. unwedge() rewinds the whole registry directory,
          # this file included; the step below that owns it does not run until
          # after that has already happened, so a copy taken there would be the
          # rewound one -- tonight's records gone, the same loss this file is the
          # record of. It is not written between here and there, so this copy is
          # the last one that is still tonight's.
          cp scraper/registry/audit-status.json "${RUNNER_TEMP:-/tmp}/audit-status-mine.json" 2>/dev/null || true

          for spec in "${specs[@]}"; do
            file="${spec%%:*}"; rest="${spec#*:}"; indent="${rest%%:*}"; label="${rest#*:}"
            mine="${RUNNER_TEMP:-/tmp}/$(basename "$file")"
            [ -f "$mine" ] || continue
            pushed=0
            for i in 1 2 3 4 5; do
              git checkout HEAD -- "scraper/$file" 2>/dev/null || true
              git fetch origin main || true
              if ! git pull --rebase --autostash; then
                unwedge
                sleep $((i * 10)); continue
              fi
              # `git pull --rebase --autostash` EXITS 0 when the rebase itself
              # succeeded and only the autostash RE-APPLY conflicted. That is
              # this repo's normal case, and it is why the failure branch above
              # never fired: the pull reports success, the unmerged entries are
              # already there, and the `git commit` below dies on them ("Committing
              # is not possible because you have unmerged files") -- taking the
              # step down under `bash -e` and leaving the wedge for every step
              # after it. Ask the index, not the exit code.
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                echo "$label: autostash re-apply conflicted; clearing and retrying from the remote tip"
                unwedge; continue
              fi
              # registry.json is hand-curated and NOT a per-VIN cache, so it is
              # never key-merged — it keeps this run's copy and relies on its
              # own commit no longer being hostage to the caches.
              case "$file" in
                registry/registry.json) cp "$mine" "scraper/$file" ;;
                *) node scraper/merge-vin-cache.mjs --file "scraper/$file" --mine "$mine" --indent "$indent" ;;
              esac
              git add "scraper/$file"
              git diff --staged --quiet && { echo "$label: nothing to commit"; pushed=1; break; }
              git commit -m "Nightly: $label [skip ci]"
              if git push; then echo "$label pushed"; pushed=1; break; fi
              [ "$(git log -1 --format=%s)" = "Nightly: $label [skip ci]" ] && git reset --soft HEAD~1
              sleep $((i * 10))
            done
            [ "$pushed" = "1" ] || echo "::warning::Could not push $label. Supabase already has tonight's listings; this file catches up next run."
          done

      # The audit liveness record, alone, so no cache's conflict can take it
      # down. merge-audit-status.mjs folds in whatever landed while this run
      # was working (feed-audits.yml records four checks on its own 6-hourly
      # schedule), so the two writers compose by check name instead of
      # colliding as text — see that script's header. Re-merged before every
      # retry, because the thing we raced may have landed since.
      - name: Commit the audit liveness record
        if: always()
        working-directory: scraper
        run: |
          git config user.name "voltcheck-bot"
          git config user.email "noreply@github.com"
          # Save this run's records BEFORE touching git: each attempt resets the
          # file to the remote tip and merges them back in. Reset-then-merge,
          # not merge-then-commit — see merge-audit-status.mjs on why the other
          # order still conflicts and still loses the record.
          # Saved by the registry step above, before its first git command, for
          # the reason spelled out there. Only copy here if that did not happen
          # (that step gone or skipped) -- re-copying unconditionally would
          # overwrite the good save with the rewound file.
          [ -f "${RUNNER_TEMP:-/tmp}/audit-status-mine.json" ] \
            || cp registry/audit-status.json "${RUNNER_TEMP:-/tmp}/audit-status-mine.json"
          # Then unwedge: the step above can hand this one an index
          # with unmerged entries (see its unwedge() comment), and in that state
          # every `git pull` here fails before it starts. The wedge is inherited,
          # not caused here, so clear it up front rather than only after a
          # failure of our own.
          unwedge() {
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            git checkout -f HEAD -- registry 2>/dev/null || true
            git stash list 2>/dev/null | grep -q . && git stash drop >/dev/null 2>&1
            return 0 # never let this trip `bash -e` -- it is the recovery path
          }
          unwedge
          for i in 1 2 3 4 5; do
            git checkout HEAD -- registry/audit-status.json 2>/dev/null || true
            git fetch origin main || true
            if ! git pull --rebase --autostash; then
              unwedge
              sleep $((i * 10)); continue
            fi
            # Same trap as the registry step above: the pull exits 0 when only
            # the autostash re-apply conflicted, so the index has to be asked
            # directly. Committing into a wedged index is what lost tonight's
            # record on 2026-08-24.
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "autostash re-apply conflicted; clearing and retrying from the remote tip"
              unwedge; continue
            fi
            node merge-audit-status.mjs --mine "${RUNNER_TEMP:-/tmp}/audit-status-mine.json"
            git add registry/audit-status.json
            git diff --staged --quiet && { echo "nothing to commit"; exit 0; }
            git commit -m "Nightly: audit liveness record [skip ci]"
            if git push; then echo "audit status pushed"; exit 0; fi
            # Unwind ONLY our own commit before retrying; the checkout at the
            # top of the next attempt clears it from the index too.
            [ "$(git log -1 --format=%s)" = "Nightly: audit liveness record [skip ci]" ] && git reset --soft HEAD~1
            sleep $((i * 10))
          done
          echo "::error::Could not push audit-status.json — the liveness record for tonight is lost, which is the failure that hid price-audit for days. Check for a competing writer."

  # The authoritative sold-signal, split out of finalize (2026-08-19). Its own
  # job means its own clock. recheck fetches every live dealer listing's page
  # and commits the result — every 404 a delisting — in one terminal write, so
  # sharing finalize's old 240-minute budget meant a timeout mid-run discarded
  # the entire night's removals (delistings fell 2,186/night → 0 over 08-17…19
  # and sold cars stayed live). --deadline-min stops fetching with time to
  # spare and writes what it found; a slow night lands partial delistings, the
  # rest wait for tomorrow. always() + probe success: it must run even when
  # finalize-audits (or an earlier finalize-* job) timed out, because it reads
  # live rows straight from the DB, not from anything upstream. Skipped during
  # an ingest-only recovery run — that path exists to land ingest+sync for an
  # already-crawled night, not to re-run the sold-signal sweep.
  recheck:
    needs: [probe, finalize-audits]
    if: ${{ always() && needs.probe.result == 'success' && github.event.inputs.skip_crawl != 'true' && github.event.inputs.recover_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recheck live listings
        id: recheck
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
        # Deadline sits ~50 min under the job timeout so the terminal write
        # always lands; concurrency unchanged from when this ran in finalize.
        run: node recheck.mjs --concurrency 10 --deadline-min 280
      # Expire the feed cache so tonight's delistings leave the site now, not on
      # tomorrow's revalidate — finalize-ingest's earlier revalidate carried the
      # crawl's data, this one carries recheck's removals.
      #
      # This step used to be `if: always()` with no refusal, and its comment
      # claimed it was the same as finalize-ingest's copy. It was not.
      # finalize-ingest's copy refuses outright when db-sync or sync-guard
      # didn't pass — "skipping revalidate rather than warming the cache with a
      # snapshot nobody has confirmed is right" — and that refusal is the part
      # that matters. Without it this step would expire an intact cache and
      # re-warm seven routes against whatever the database happened to be
      # doing, which on a bad night means caching the 58,730-row bundled
      # snapshot for a full day behind HTTP 200s. Caught 2026-08-22 while the
      # database was mid-incident and production was serving a complete,
      # correct 100,297-row cache: this step was ~6 hours from cron and would
      # have thrown that away with nobody pressing anything.
      #
      # Three guards, in the order they can fail:
      #   1. recheck's own outcome. This revalidate exists to publish recheck's
      #      removals; if recheck didn't finish there are none, so expiring a
      #      good cache buys nothing and risks everything.
      #   2. a live database probe. recheck can succeed against a database that
      #      still cannot complete the FEED WALK — they are different queries,
      #      and the walk is the one the warm-up depends on. Never expire a
      #      cache you cannot refill.
      #
      #      The probe is a real FEED PAGE, not the count, and the distinction
      #      is load-bearing. The count is an index-only scan over
      #      listings_live_idx; once the visibility map is fresh it touches
      #      almost no heap and collapses to milliseconds. The walk selects
      #      payload, so it reads the heap (and toast) for every row and runs
      #      the view's LATERAL price-history lookup, no matter how fresh the
      #      visibility map is. There is a real window — wide open the night
      #      this was written, with an autovacuum running — where the count
      #      answers in 20ms and the walk still cannot finish. A count-based
      #      gate reads that window as "healthy, go warm", and warming in that
      #      window is exactly what poisons the cache. Same argument as guard
      #      1, one level up.
      #
      #      Probed on the W bucket specifically: BMW/Mercedes/Audi/VW, whose
      #      payloads db.ts measured as the fattest at ~1.07 kB a row. A
      #      cheap bucket answering fast proves nothing about the expensive
      #      ones; the worst page is the one the walk waits on.
      #
      #      And it is gated on LATENCY, not just on a 200. 3 seconds is
      #      PostgREST's anon statement timeout, not a health bar — a page
      #      that takes 2.9s is a page that will not finish a walk. The walk
      #      is ~226 requests across 8 lanes, so ~28 pages sequentially per
      #      lane; at 1.5s a page that is ~42s, inside the render budget with
      #      margin. Above it, the warm-up times out and caches nothing (or
      #      caches the snapshot), which is the whole failure.
      #   3. feed-shard-check.mjs afterwards, which counts the ROWS in what we
      #      just warmed instead of trusting seven 200s. If we poisoned the
      #      cache anyway, the night goes red and says so.
      - name: Revalidate the site's feed cache
        if: always()
        env:
          FEED_REVALIDATE_SECRET: ${{ secrets.FEED_REVALIDATE_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ "${{ steps.recheck.outcome }}" != "success" ]; then
            echo "::error::recheck did not complete (step outcome: '${{ steps.recheck.outcome }}') — it has no removals to publish. Skipping revalidate rather than expiring a good cache and re-warming it against an unknown database; the site keeps what it has and refreshes on the 24h backstop."
            exit 1
          fi
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            auth=(-H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            # Cheap first: the count guard db.ts uses. ADVISORY ONLY — it does
            # not get a veto, and 2026-08-23 is why. recheck had just written
            # its night's work (2,455 delistings, 1,131 struck, 12,134 price
            # changes), this count returned HTTP 500 at 18:36:59, and the job
            # exited without publishing any of it. Autovacuum ran at 18:37:39.
            # Forty seconds. The same query, unchanged, answered in 0.17-0.64 s
            # once it had.
            #
            # That is the whole failure: a count over ~100k live rows is an
            # index-only scan on listings_live_idx and costs ~277 ms, but only
            # while the visibility map is current. A write burst leaves it
            # stale, the scan starts visiting the heap instead, and it blows
            # anon's 3 s timeout — for the few minutes between the pipeline's
            # own writes and the vacuum that cleans up after them. This gate
            # runs inside that window BY CONSTRUCTION: it is the step right
            # after the writes. So the guard reliably failed at the one moment
            # it was guaranteed to be wrong, and cost the site a day of showing
            # cars that had sold.
            #
            # It is also the check CLAUDE.md already lists as a FALSE GATE
            # ("the cheap COUNT is a false gate — vacuum fixes it but NOT the
            # walk"). It was only ever here to fail fast and save ~20 s; the
            # feed page below is what actually decides, it is one of the very
            # pages the warm-up walks, and it does not depend on the visibility
            # map. A real outage still fails it. Nothing weaker is being
            # trusted — the veto simply moves to the stronger of the two
            # checks that were always both here.
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "${auth[@]}" \
              -H "Range: 0-0" -H "Prefer: count=exact" \
              "$SUPABASE_URL/rest/v1/listings?select=vin&delisted_at=is.null") || code=000
            if [ "$code" != "200" ] && [ "$code" != "206" ]; then
              echo "::warning::the listing count did not answer (HTTP $code) — most likely the post-write vacuum window, which is where this step always runs. Not skipping on this alone; the feed-page check below decides."
            fi
            # Then the one that decides it: a real feed page from the fattest
            # bucket, same select list, order and limit db.ts walks with.
            # The \n in -w is load-bearing: curl ends its -w output without one,
            # so read hits EOF mid-line, returns 1, and bash -e kills the step
            # with no output (refresh-fallback.yml's 2026-08-23 red run).
            sel="vin,payload,first_seen_at,last_seen_at,prev_price_usd,price_changed_at,buyback_disclosed,listed_on"
            read -r pcode ptime < <(curl -s -o /dev/null -w "%{http_code} %{time_total}\n" --max-time 20 "${auth[@]}" \
              "$SUPABASE_URL/rest/v1/live_listings_feed?select=$sel&order=vin.asc&limit=500&vin=gte.W" || echo "000 99")
            if [ "$pcode" != "200" ]; then
              echo "::error::the database cannot serve a feed page (HTTP $pcode) — the WALK cannot run, which is the query the warm-up depends on (count was HTTP $code, advisory). Skipping revalidate; production keeps the complete cache it already has."
              exit 1
            fi
            if awk "BEGIN{exit !($ptime > 1.5)}"; then
              echo "::error::a feed page took ${ptime}s (ceiling 1.5s) — the walk is ~28 sequential pages per lane, so the warm-up would time out and cache nothing useful. Skipping revalidate; production keeps the complete cache it already has."
              exit 1
            fi
            echo "database served a fat feed page in ${ptime}s (count: HTTP $code, advisory); safe to expire and re-warm"
          fi
          [ -z "$FEED_REVALIDATE_SECRET" ] && { echo "::warning::FEED_REVALIDATE_SECRET unset; site refreshes on the 24h cache backstop instead"; exit 0; }
          if ! curl -fsS --retry 3 --max-time 60 -X POST -H "x-revalidate-secret: $FEED_REVALIDATE_SECRET" https://voltcheck.net/api/revalidate; then
            echo "::warning::/api/revalidate unreachable; site refreshes on the 24h cache backstop instead"
            exit 0
          fi
          # 24 index shards since 2026-08-24 — keep in step with
          # web/lib/listings/pack.ts SHARDS, whose comment has the incident.
          for s in first $(seq 0 23); do
            curl -fsS --retry 2 --max-time 300 -o /dev/null "https://voltcheck.net/api/index/$s" \
              || echo "::warning::shard $s warm-up failed; its first visitor pays the render"
          done
          # And the sitemaps, which stopped being build artifacts on
          # 2026-08-22 (web/app/sitemap/[shard]/route.ts: prerendering them
          # walked the whole feed inside Next's 60-second budget and killed
          # four production builds in a row). They render on first request
          # and cache for the same day as the index shards, so this pass is
          # now what keeps a crawler's copy current. Warmed immediately after
          # the shards on purpose: db.ts's ten-minute walk memo is still
          # holding the walk the loop above just paid for, so these cost
          # no extra database read. A failure here is a stale sitemap, never
          # a wrong one — the route refuses to publish anything but a live
          # feed — so it warns rather than failing the night.
          # 12 sitemap shards since 2026-08-24 — keep in step with
          # web/lib/sitemap.ts SITEMAP_SHARDS, whose comment has the incident.
          for s in $(seq 0 11); do
            curl -fsS --retry 2 --max-time 300 -o /dev/null "https://voltcheck.net/sitemap/$s.xml" \
              || echo "::warning::sitemap shard $s warm-up failed; crawlers keep yesterday's copy until the next request renders it"
          done

      # Seven 200s do not mean seven correct bodies. This counts the rows in
      # what the step above just cached and fails the night if the shards
      # disagree with each other or with the total — the 2026-08-21 shape,
      # where five shards served ~9,800 rows each and every endpoint answered
      # 200 for most of a day.
      - name: Verify what we just warmed
        if: always()
        continue-on-error: true
        working-directory: scraper
        env:
          FEED_REVALIDATE_SECRET: ${{ secrets.FEED_REVALIDATE_SECRET }}
        run: node feed-shard-check.mjs
