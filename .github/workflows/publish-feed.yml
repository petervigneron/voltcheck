# Publish the browse feed as static artifacts (web/scripts/publish-feed.mjs):
# one gentle walk on a runner with time to spare, 27 files in the public
# `feed` storage bucket, and serving never walks the database again. The
# route (app/api/index/[shard]/route.ts) serves these artifact-first since
# 2026-08-26; its 36h freshness gate means this must run at least daily —
# nightly.yml calls it after ingest, and it can be dispatched by hand after
# any out-of-cycle db-sync.
name: Publish feed artifacts

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the total shrank >10% vs the published manifest (deliberate contraction only)"
        required: false
        default: "false"
  workflow_call: {}

concurrency: publish-feed

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: web

      # A publish is ONE FULL WALK of listings, and the walk is the single
      # biggest thing this database does. Measured 2026-08-29 from
      # pg_stat_statements: the feed-page query had run 1,356 times for 1,326
      # seconds and had pulled 95 GB through the buffer cache — about six full
      # walks — against an instance whose whole cache is a fraction of that.
      # Each walk reads the entire 232 MB heap plus its toast, so it evicts
      # everything else on the way through; `listings` sits at a 78.7% cache
      # hit rate where every other table in the database is 93-100%, and
      # Supabase sent a Disk IO Budget depletion warning the same day.
      #
      # In the 24 hours before this guard there were SEVEN publishes, every one
      # a manual dispatch, FIVE of them inside a single hour — several Claude
      # sessions work this repo at once and each reached for the publisher as
      # the way to make its own change visible. Nothing was wrong with any one
      # of those; together they were six redundant walks.
      #
      # So a manual publish now declines when the artifact it would replace is
      # younger than MIN_AGE_MIN. Deliberately narrow:
      #   - workflow_call is EXEMPT. nightly.yml is the publish that carries
      #     the night's crawl, and a nightly landing 80 minutes after someone's
      #     manual publish must never be the one that gets skipped.
      #   - force=true overrides it, which is what to use after a rolling crawl
      #     lands cars out of cycle.
      #   - 90 minutes, against the route's 36h freshness gate: far too short
      #     to risk staleness, long enough that a session iterating on one
      #     change walks once instead of five times.
      - name: Decline a redundant walk
        id: gate
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          MIN_AGE_MIN=90
          [ -z "$SUPABASE_URL" ] && { echo "no SUPABASE_URL — cannot check, publishing"; exit 0; }
          man=$(curl -sS --max-time 30 "$SUPABASE_URL/storage/v1/object/public/feed/manifest.json" || echo '')
          published=$(printf '%s' "$man" | sed -n 's/.*"publishedAt"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          # No readable manifest means the routes are on the walk path already;
          # that is the case that most needs a publish, so proceed.
          [ -z "$published" ] && { echo "no readable manifest — publishing"; exit 0; }
          pnorm=$(printf '%s' "$published" | sed 's/\.[0-9]*Z$/Z/; s/T/ /; s/Z$/ UTC/')
          age_min=$(( ( $(date -u +%s) - $(date -u -d "$pnorm" +%s 2>/dev/null || echo 0) ) / 60 ))
          if [ "$age_min" -ge 0 ] && [ "$age_min" -lt "$MIN_AGE_MIN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Feed artifact is only ${age_min} min old (minimum ${MIN_AGE_MIN}). Declining to walk the database again — a publish is a full read of the listings table and that is what is draining the Disk IO budget. Re-run with force=true if you have landed cars out of cycle (a rolling crawl), or wait $(( MIN_AGE_MIN - age_min )) min."
          else
            echo "artifact is ${age_min} min old (minimum ${MIN_AGE_MIN}) — publishing"
          fi

      - name: Walk once and publish
        if: ${{ steps.gate.outputs.skip != 'true' }}
        working-directory: web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 2 lanes, deliberately: this walk has a runner's whole hour, and
          # gentleness is the point — 8 lanes at request time is what drained
          # the burstable instance's CPU credits all week. Publishing slower
          # costs nothing anyone can see.
          FEED_LANES: "2"
        run: |
          node --experimental-strip-types --import ./scripts/ts-resolve-hook.mjs \
            scripts/publish-feed.mjs ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: Refresh the site onto the new artifacts
        if: ${{ steps.gate.outputs.skip != 'true' }}
        env:
          FEED_REVALIDATE_SECRET: ${{ secrets.FEED_REVALIDATE_SECRET }}
        run: |
          if [ -z "$FEED_REVALIDATE_SECRET" ]; then
            echo "no FEED_REVALIDATE_SECRET — site refreshes on its 24h TTL"; exit 0
          fi
          curl -sf -X POST -H "x-revalidate-secret: $FEED_REVALIDATE_SECRET" https://voltcheck.net/api/revalidate \
            || { echo "::warning::revalidate POST failed; site refreshes on its 24h TTL"; exit 0; }
          # Artifact-backed re-renders are one CDN fetch each — warming all 38
          # paths is now cheap enough to just do.
          for p in first trims $(seq 0 23); do
            curl -sf -o /dev/null --max-time 120 "https://voltcheck.net/api/index/$p" \
              || echo "::warning::warm of /api/index/$p failed; its first visitor pays the (artifact) render"
          done
          # The other 12 of those 38, which this loop was missing (2026-08-28).
          # The sitemap shards are the one surface that never got an artifact
          # lane — app/sitemap/[shard]/route.ts still renders off a full feed
          # walk — and the revalidate POST four lines up expires all 12 of
          # them. nightly.yml warmed them twice, in finalize-ingest and again
          # in recheck, and BOTH passes ran before this job did: each paid a
          # real walk, and this POST then threw both away. Measured on
          # production 2026-08-28, hours after a nightly: age ~18 min, so the
          # warm standing was a crawler's, not ours. Two wasted walks a night
          # against a burstable instance whose CPU credits are the actual
          # budget, for a cache that was gone before anyone read it.
          #
          # Here is the only place a warmed sitemap survives the night, so
          # here is where it belongs — and the precondition is already proved
          # rather than probed: the publish step above completed a full walk
          # minutes ago. That is the real signal nightly.yml's 1.5s latency
          # probe was reaching for. A failure is a stale sitemap, never a
          # wrong one (the route throws on anything but a live feed), so it
          # warns. 12 shards — keep in step with web/lib/sitemap.ts
          # SITEMAP_SHARDS.
          #
          # Sequential and unhurried on purpose: each is a walk-path render,
          # and db.ts's ten-minute memo means the first one pays for the rest.
          for s in $(seq 0 11); do
            curl -sf -o /dev/null --max-time 300 "https://voltcheck.net/sitemap/$s.xml" \
              || echo "::warning::warm of /sitemap/$s.xml failed; crawlers keep yesterday's copy until a request renders it"
          done

      # A row of 200s is not a row of correct bodies — the 2026-08-21 incident
      # was five shards serving ~9,800 rows each behind five 200s. nightly.yml
      # runs this too, but with --skip-sitemaps, because it runs BEFORE this
      # job warms them. Here everything is fresh at once, so this is the one
      # place the sitemap half of the check can ask a fair question: are the
      # URLs we hand crawlers as many as the cars we say we have?
      #
      # continue-on-error, matching nightly.yml's copies: the artifacts are
      # already published and the site is already refreshed by this point, so
      # failing the job would not un-publish anything. The annotation is the
      # output.
      - name: Verify what we just published
        if: ${{ always() && steps.gate.outputs.skip != 'true' }}
        continue-on-error: true
        working-directory: scraper
        run: node feed-shard-check.mjs

  # The Pro alert cadence (lib/proOffer.ts: "pushed after every crawl"). A
  # publish is the moment new cars and new cuts become visible on the grid —
  # and send-alerts.mjs reads the grid's own /api/index shards, so this is the
  # earliest an alert can honestly fire. It runs only the subscriptions held
  # by a live pass (alerts.yml pro_only); the free digest keeps its once-a-day
  # schedule. On a run where the walk was declined as redundant, the shards
  # are unchanged and the sender finds nothing newer than last_sent_at — a
  # no-op, not a duplicate.
  pro-alerts:
    needs: publish
    if: ${{ always() && needs.publish.result == 'success' }}
    uses: ./.github/workflows/alerts.yml
    with:
      pro_only: true
    secrets: inherit
