# Publish the browse feed as static artifacts (web/scripts/publish-feed.mjs):
# one gentle walk on a runner with time to spare, 27 files in the public
# `feed` storage bucket, and serving never walks the database again. The
# route (app/api/index/[shard]/route.ts) serves these artifact-first since
# 2026-08-26; its 36h freshness gate means this must run at least daily —
# nightly.yml calls it after ingest, and it can be dispatched by hand after
# any out-of-cycle db-sync.
name: Publish feed artifacts

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the total shrank >10% vs the published manifest (deliberate contraction only)"
        required: false
        default: "false"
  workflow_call: {}

concurrency: publish-feed

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: web
      - name: Walk once and publish
        working-directory: web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 2 lanes, deliberately: this walk has a runner's whole hour, and
          # gentleness is the point — 8 lanes at request time is what drained
          # the burstable instance's CPU credits all week. Publishing slower
          # costs nothing anyone can see.
          FEED_LANES: "2"
        run: |
          node --experimental-strip-types --import ./scripts/ts-resolve-hook.mjs \
            scripts/publish-feed.mjs ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: Refresh the site onto the new artifacts
        env:
          FEED_REVALIDATE_SECRET: ${{ secrets.FEED_REVALIDATE_SECRET }}
        run: |
          if [ -z "$FEED_REVALIDATE_SECRET" ]; then
            echo "no FEED_REVALIDATE_SECRET — site refreshes on its 24h TTL"; exit 0
          fi
          curl -sf -X POST -H "x-revalidate-secret: $FEED_REVALIDATE_SECRET" https://voltcheck.net/api/revalidate \
            || { echo "::warning::revalidate POST failed; site refreshes on its 24h TTL"; exit 0; }
          # Artifact-backed re-renders are one CDN fetch each — warming all 38
          # paths is now cheap enough to just do.
          for p in first trims $(seq 0 23); do
            curl -sf -o /dev/null --max-time 120 "https://voltcheck.net/api/index/$p" \
              || echo "::warning::warm of /api/index/$p failed; its first visitor pays the (artifact) render"
          done
          # The other 12 of those 38, which this loop was missing (2026-08-28).
          # The sitemap shards are the one surface that never got an artifact
          # lane — app/sitemap/[shard]/route.ts still renders off a full feed
          # walk — and the revalidate POST four lines up expires all 12 of
          # them. nightly.yml warmed them twice, in finalize-ingest and again
          # in recheck, and BOTH passes ran before this job did: each paid a
          # real walk, and this POST then threw both away. Measured on
          # production 2026-08-28, hours after a nightly: age ~18 min, so the
          # warm standing was a crawler's, not ours. Two wasted walks a night
          # against a burstable instance whose CPU credits are the actual
          # budget, for a cache that was gone before anyone read it.
          #
          # Here is the only place a warmed sitemap survives the night, so
          # here is where it belongs — and the precondition is already proved
          # rather than probed: the publish step above completed a full walk
          # minutes ago. That is the real signal nightly.yml's 1.5s latency
          # probe was reaching for. A failure is a stale sitemap, never a
          # wrong one (the route throws on anything but a live feed), so it
          # warns. 12 shards — keep in step with web/lib/sitemap.ts
          # SITEMAP_SHARDS.
          #
          # Sequential and unhurried on purpose: each is a walk-path render,
          # and db.ts's ten-minute memo means the first one pays for the rest.
          for s in $(seq 0 11); do
            curl -sf -o /dev/null --max-time 300 "https://voltcheck.net/sitemap/$s.xml" \
              || echo "::warning::warm of /sitemap/$s.xml failed; crawlers keep yesterday's copy until a request renders it"
          done

      # A row of 200s is not a row of correct bodies — the 2026-08-21 incident
      # was five shards serving ~9,800 rows each behind five 200s. nightly.yml
      # runs this too, but with --skip-sitemaps, because it runs BEFORE this
      # job warms them. Here everything is fresh at once, so this is the one
      # place the sitemap half of the check can ask a fair question: are the
      # URLs we hand crawlers as many as the cars we say we have?
      #
      # continue-on-error, matching nightly.yml's copies: the artifacts are
      # already published and the site is already refreshed by this point, so
      # failing the job would not un-publish anything. The annotation is the
      # output.
      - name: Verify what we just published
        if: always()
        continue-on-error: true
        working-directory: scraper
        run: node feed-shard-check.mjs
