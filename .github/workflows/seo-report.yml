# Weekly Search Console reading for voltcheck.net.
#
# Answers "is anyone arriving from search, and for what" with Google's own
# numbers. Read-only: the service account is a Restricted user on the
# property, so this workflow cannot change anything about the site.
#
# The report is EMAILED on every scheduled run, and lands in the job summary
# either way. Emailing is the point: a weekly report nobody is told about is
# a page someone has to remember to go and open, which is not "keeping tabs"
# — the owner asked how it would reach him, and the honest first answer was
# that it would not.
name: SEO report

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC — Google has finalised the prior week
  workflow_dispatch:
    inputs:
      days:
        description: "Window length in days"
        default: "28"
      email:
        description: "Email the report (scheduled runs always do)"
        type: boolean
        default: true

concurrency:
  group: seo-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Search Console report
        id: gsc
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GSC_SERVICE_ACCOUNT_JSON secret is not set. Add the contents of docs/gsc-service-account.json as a repository secret."
            exit 1
          fi
          node scraper/gsc-report.mjs --days "${{ inputs.days || 28 }}" | tee report.txt

      - name: Publish to job summary
        if: always()
        run: |
          {
            echo '## Search Console — voltcheck.net'
            echo '```'
            cat report.txt 2>/dev/null || echo 'report failed'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Email the report
        # A scheduled run has no inputs, so it must not depend on one.
        if: ${{ github.event_name == 'schedule' || inputs.email == true }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "::warning::RESEND_API_KEY is not set — report not emailed"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const body = fs.readFileSync("report.txt", "utf8");
            // The headline numbers ride in the subject so the week can be
            // read without opening anything.
            const num = (label) => (body.match(new RegExp(`^${label}\\s+(\\d+)`, "m")) || [])[1] ?? "?";
            const subject = `Voltcheck search: ${num("clicks")} clicks, ${num("impressions")} impressions this week`;
            fetch("https://api.resend.com/emails", {
              method: "POST",
              headers: {
                authorization: `Bearer ${process.env.RESEND_API_KEY}`,
                "content-type": "application/json",
              },
              body: JSON.stringify({
                from: "alerts@voltcheck.net",
                to: "peter.vigneron@gmail.com",
                subject,
                text: body,
              }),
            })
              .then(async (r) => {
                const t = await r.text();
                console.log(r.status, t);
                // A send that silently failed would look exactly like a quiet
                // week, which is the one thing this report must never do.
                if (!r.ok) process.exit(1);
              });
          '
