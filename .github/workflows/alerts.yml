name: Alert emails

# Saved-search alert emails (web/scripts/send-alerts.mjs): new listings and
# price cuts per confirmed subscription, for everyone — the owner ruled on
# 2026-09-02 that price-drop alerts are not tiered. Two schedules, one
# script:
#
#   * The daily run below, after the nightly pipeline has synced and
#     refreshed the freshness matview, so today's arrivals carry today's
#     dates. It is also the catch-up for anything the other schedule missed.
#   * `workflow_call` from publish-feed.yml after every feed publish (nightly
#     and each rolling crawl), so a match is mailed the refresh it lands in.
#     last_sent_at advances per send, so the two cannot double-mail.
#
# The script needs no npm install — it imports only dependency-free lib
# modules under Node's type stripping — and exits 0 when RESEND_API_KEY /
# SUPABASE_SERVICE_ROLE_KEY aren't configured yet, so this workflow is
# green-but-inert until those secrets exist.
on:
  schedule:
    - cron: "30 18 * * *" # 11:30 America/Los_Angeles — nightly finalize is long done
  workflow_dispatch:
  workflow_call: {}

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level rather than workflow-level so the group also holds when this
    # runs as a called workflow inside publish-feed's run. Two senders reading
    # the same last_sent_at at once is the one way to mail a digest twice.
    concurrency:
      group: alerts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Send alert digests
        working-directory: web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node --experimental-strip-types --import ./scripts/ts-resolve-hook.mjs scripts/send-alerts.mjs
