name: Enrichment coverage

# Guards the one thing the site exists to do: tell a shopper the battery,
# charging, and warranty facts behind a VIN. The enrichment data
# (web/lib/enrichment/data*.ts) is hand-filled cohort by cohort, and a
# half-stocked cohort is invisible on the site — its empty fields render as
# "Unknown", identical to a fact that's genuinely unknowable. Nothing measured
# the difference, so partial coverage shipped looking complete and only a human
# opening a listing ever caught it (that's how a 2024 F-150 Lightning reached
# shoppers with no port, chemistry, or charging facts at all).
#
# This runs web/scripts/enrichment-coverage.mjs on every change to the
# enrichment files. It ratchets against a baseline (251 the day it was born,
# 241 once the Lightning charge port was filled, 248 today — see below): the
# backlog is allowed, a NEW half-stocked cohort is not. Lower --max-core-fails
# as backfill lands; never raise it to hide a regression.
#
# 241 -> 248, 2026-08-22, and this is the ONLY raise so far. It is not a
# regression being papered over — no row lost a fact — so here is exactly what
# it buys, row by row, so the next person can check the arithmetic:
#
#   Chevrolet Volt 2011-12 / 2013-15 / 2016-19   heat pump
#   Ford Escape PHEV 2020-22 / 2023 / 2024-25    heat pump
#   Honda Clarity PHEV 2018-21                   heat pump
#
# Seven rows, one field, and docs/agents/phev-enrichment-2026-08-21.md logged
# every one of them as deferred before they were written ("Heat pump: not
# researched this pass", and its §5 open-items list). They are new coverage
# with a known hole, not a cohort that quietly lost something.
#
# The alternative was leaving the check red, and a permanently red check is a
# check nobody reads — which is the failure this script's own header warns
# about ("a check that's red on arrival is a check everyone learns to ignore").
#
# What closes it: a primary document per maker, with the control test a
# negative needs — a document from the same maker and era that names a heat
# pump when the car has one. Toyota's does, which is how the Prius Prime Gen 2
# gap closed on 2026-08-22 rather than landing in this list: the MY2017 launch
# release describes the heat pump outright, down to the 14°F floor.
#
# The other three resisted. GM's 2016 Volt press kit publishes a battery and a
# drive-unit PDF and no HVAC document (probed by URL). media.gm.com,
# media.chevrolet.com and automobiles.honda.com all answer 403. And one
# warning for whoever picks this up: a web search will tell you the Clarity
# has "an efficient heat pump" and attribute it to Honda's own product page.
# That page is archived (web.archive.org, 2020-07-01) and the phrase "heat
# pump" does not occur in it — it says "dual-zone automatic climate control"
# and nothing more. The search result was invented. Read the document.
#
# Archived owner's manuals are the next place to look. Put the number back to
# 241 when they are filled.
#
# Note what does NOT need a raise any more: a row that is deliberately silent
# on a core field now says so in `abstains` (lib/types.ts), which the script
# excuses and then prints in its own section with its reason. Eight rows use
# it — the 2026 bZ and bZ Woodland, both bZ4X drivetrain rows, the Solterra,
# and the three 2017-19 Tesla S/X — and they are why this number is 248 and
# not 253. If a new row leaves a core field empty ON PURPOSE, annotate it;
# the baseline is for gaps you intend to close.
#
# web/scripts/note-hygiene.mjs runs beside it, on the other half of the same
# promise: not whether a fact is there, but whether what we wrote under it is
# for the shopper or for us.
# No install and no secrets — the script imports only the dependency-free
# enrichment modules under Node's type stripping.
on:
  push:
    paths:
      - "web/lib/enrichment/**"
      - "web/scripts/enrichment-coverage.mjs"
      - ".github/workflows/enrichment-coverage.yml"
  pull_request:
    paths:
      - "web/lib/enrichment/**"
      - "web/scripts/enrichment-coverage.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Report enrichment coverage
        working-directory: web
        run: node --experimental-strip-types --import ./scripts/ts-resolve-hook.mjs scripts/enrichment-coverage.mjs --max-core-fails 248
      # A note either cites a source, states a fact, or says nothing. Swept out
      # by hand on 2026-08-20 (VW ID. Buzz) and again on 2026-08-22 (Toyota
      # bZ), both times because the owner opened a listing and read it. No
      # ratchet on this one: the backlog is zero, so any new breach is new.
      - name: Check note hygiene
        # `if: always()` so a red coverage step doesn't take this one with it —
        # they guard different things and both should be heard. Kept now that
        # coverage is green again, because the next raise-or-fix argument
        # shouldn't also cost us the note check.
        if: always()
        working-directory: web
        run: node --experimental-strip-types --import ./scripts/ts-resolve-hook.mjs scripts/note-hygiene.mjs
