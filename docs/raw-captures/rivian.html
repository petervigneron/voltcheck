port/careers"><p class="rivian-css-1uu4usw eiv7kg210">Careers</p></a><div data-testid="accordion-category-privacy" class="rivian-css-2dyxhf e9lhiys0"><button id="privacy" aria-controls="privacy-body" class="sub-menu-header rivian-css-1dr5m8b e1v4mwtn0"><div class="rivian-css-i9gxme e1v4mwtn2"><div class="rivian-css-rubfau e1bodypx1"><span class="rivian-css-10wszx8 e1bodypx5"><p class="rivian-css-1uu4usw eiv7kg210">Privacy</p></span></div></div><div class="rivian-css-1wq0tye e1v4mwtn1"></div></button><div style="height:0;overflow:hidden;min-height:0;transition:height 200ms cubic-bezier(0.4, 0, 0.2, 1) 0ms" role="region" id="privacy-body" aria-labelledby="privacy" aria-hidden="true"><div class="rivian-css-1phqhni e188wxs20"><ul class="rivian-css-my05el e1bodypx2"><a data-testid="categoryListTestId-vehicle-privacy" class=" rivian-css-18eqh0b e1bodypx4" href="/support/vehicle-privacy"><p class="rivian-css-1uu4usw eiv7kg210">Vehicle Privacy</p></a><a data-testid="categoryListTestId-charging-privacy" class=" rivian-css-18eqh0b e1bodypx4" href="/support/charging-privacy"><p class="rivian-css-1uu4usw eiv7kg210">Charging Privacy</p></a><a data-testid="categoryListTestId-mobile-app-privacy" class=" rivian-css-18eqh0b e1bodypx4" href="/support/mobile-app-privacy"><p class="rivian-css-1uu4usw eiv7kg210">Mobile App Privacy</p></a><a data-testid="categoryListTestId-web-and-other-interactions-privacy" class=" rivian-css-18eqh0b e1bodypx4" href="/support/web-and-other-interactions-privacy"><p class="rivian-css-1uu4usw eiv7kg210">Web and Other Interactions Privacy</p></a></ul></div></div></div></ul></div></div></div></aside><article class="rivian-css-19qkbt2 expgs672"><main class="rivian-css-79elbk e1sub8v30"><div class="rivian-css-1qa0yhn e1sub8v31"><h4 class="rivian-css-15msp3p e1sub8v32">Recall Information</h4><p class="text-body-base">If your Rivian is ever affected by a recall, Rivian Service will address the issue at no cost to you as part of your <a href="https://rivian.com/support/article/new-vehicle-limited-warranty-guide" class="underline-interact">New Vehicle Limited Warranty.</a> See our list of recalls initiated since 05/10/2022 below or search recall notices using your Rivian Vehicle Identification Number (VIN) or model and year. Last updated on 8/9/2026.</p></div><div class="rivian-css-izacmw e1sub8v33"><h5 class="rivian-css-12b2f77 e1sub8v34">Current Recalls</h5><div class="sc-d54249cd-4 bAgJDA"><button class="sc-d54249cd-5 byUPIW">VIN</button><button class="sc-d54249cd-5 iLjBoL">Model/Year</button></div></div><div class="sc-d54249cd-3 cqkPAN"><input id="vin-input" type="text" placeholder="Search by VIN" maxLength="17" class="sc-d54249cd-0 klyZjX" value=""/><button type="button" class="sc-d54249cd-1 fWsWHL">Clear</button><button type="button" disabled="" class="sc-d54249cd-2 eTtOSd"><svg width="24" height="24" viewBox="0 0 24 24" fill="#151515" xmlns="http://www.w3.org/2000/svg" fill-rule="evenodd"><path clip-rule="evenodd" d="M17.5688 14.4957C15.4209 16.6436 11.9385 16.6436 9.7906 14.4957C7.64272 12.3478 7.64272 8.8654 9.7906 6.71751C11.9385 4.56963 15.4209 4.56963 17.5688 6.71751C19.7167 8.8654 19.7167 12.3478 17.5688 14.4957ZM9.13029 16.5703C12.0706 18.8192 16.2938 18.5991 18.983 15.9099C21.9119 12.981 21.9119 8.23223 18.983 5.3033C16.0541 2.37437 11.3053 2.37437 8.37639 5.3033C5.68718 7.9925 5.46708 12.2158 7.71606 15.1561L3.30372 19.5685C2.9132 19.959 2.9132 20.5922 3.30372 20.9827C3.69425 21.3732 4.32741 21.3732 4.71794 20.9827L9.13029 16.5703Z" stroke="none"></path></svg></button></div><div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-Improperly Secured Seat Belt Retractor Assemblies" data-testid="accordion-header-button" id="AccordionHeader-section-Improperly Secured Seat Belt Retractor Assemblies" aria-describedby="AccordionBody-section-Improperly Secured Seat Belt Retractor Assemblies"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2022-2026 Rivian R1S and R1T - Issued 01/15/2026  </div><h6 id="r1-improperly-secured-seat-belt-retractor-assemblies" class="rivian-css-1qz5z43 e1isdslg7">R1 Improperly Secured Seat Belt Retractor Assemblies</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 26V-009</strong><br/><strong>Rivian Recall No. FSAM-1795</strong><br/><strong>Transport Canada Recall No 2026-009</strong><br/>Recall Status: Remedy Available 01/21/26</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-Improperly Secured Seat Belt Retractor Assemblies" aria-labelledby="AccordionHeader-section-Improperly Secured Seat Belt Retractor Assemblies" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety exists in certain model year 2022-2026 Rivian R1 vehicles.</p><p class="text-body-base"><b>What Is the problem? </b></p><p class="text-body-base">Rivian has determined that on certain R1T and R1S vehicles, the seat belt retractor bolt for the second-row driver and/or passenger side seat belt retractor may not have been properly installed during the vehicle manufacturing process. This condition may cause inadequate attachment of one or both of the outboard second-row seat belts during loading.<br/>An improperly secured seat belt retractor may not adequately restrain the seat occupant during seat belt loading, increasing the risk of injury. Rivian is not aware of any accidents or injuries related to this issue.</p><p class="text-body-base"><b>What will Rivian do? </b></p><p class="text-body-base">Rivian will inspect and, if necessary, properly secure the seat belt retractor assembly in any affected vehicles free of charge.</p><p class="text-body-base"><b>What should you do? </b></p><p class="text-body-base">Please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center at your earliest convenience. The estimated recall service time should take less than an hour to complete, please plan accordingly. </p><p class="text-body-base"><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-Toe Link Joint May Separate" data-testid="accordion-header-button" id="AccordionHeader-section-Toe Link Joint May Separate" aria-describedby="AccordionBody-section-Toe Link Joint May Separate"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2022-2025 Rivian R1S and R1T - Issued 01/05/2026  </div><h6 id="r1-toe-link-joint-may-separate" class="rivian-css-1qz5z43 e1isdslg7">R1 Toe Link Joint May Separate</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 26V-003</strong><br/><strong>Rivian Recall No. FSAM-1794</strong><br/><strong>Transport Canada Recall No 2026-002</strong><br/>Recall Status: Remedy Available 01/08/26</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-Toe Link Joint May Separate" aria-labelledby="AccordionHeader-section-Toe Link Joint May Separate" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety exists in certain model year 2022-2025 Rivian R1 vehicles.</p><p class="text-body-base"><b>What is the problem? </b></p><p class="text-body-base">Rivian has determined that on certain R1 vehicles, toe link joints reassembled during vehicle service with a service procedure before March 10, 2025, may result in a joint that is not reassembled to design intent and could experience unintended forces. <br/><br/>In certain cases, if a toe link was serviced using the earlier service procedure, vehicle motion may eventually cause toe link joint separation. Separation of the toe link while the vehicle is being driven increases the risk of a crash without prior warning. Rivian is aware of one single-vehicle accident with alleged minor injuries related to this issue. </p><p class="text-body-base"><b>What will Rivian do? </b></p><p class="text-body-base">Rivian will replace any potentially affected rear toe link bolts on the potentially affected vehicles using its updated service procedure free of charge.</p><p class="text-body-base"><b>What should you do? </b></p><p class="text-body-base">Please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center at your earliest convenience. The estimated recall service time should take less than an hour to complete, please plan accordingly. </p><p class="text-body-base"><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-EDV Seat Belt Misuse" data-testid="accordion-header-button" id="AccordionHeader-section-EDV Seat Belt Misuse" aria-describedby="AccordionBody-section-EDV Seat Belt Misuse"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2022-2025 Rivian EDV - Issued 11/18/2025  </div><h6 id="edv-seat-belt-misuse" class="rivian-css-1qz5z43 e1isdslg7">EDV Seat Belt Misuse</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 25V-816</strong><br/><strong>Rivian Recall No. FSAM-1770</strong><br/>Recall Status: Remedy Available 12/03/25</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-EDV Seat Belt Misuse" aria-labelledby="AccordionHeader-section-EDV Seat Belt Misuse" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety exists in certain model year 2022-2025 Rivian EDV vehicles.</p><p class="text-body-base"><b>What Is the problem? </b></p><p class="text-body-base">Rivian has determined that on certain EDV vehicles the driver side seat belt pretensioner may be damaged from repeated misuse, such as from the driver sitting on the seatbelt while it is buckled underneath the driver.<br/><br/>A seat belt pretensioner cable damaged by repeated misuse may not adequately restrain the seat occupant during a crash, increasing the risk of injury. To date, Rivian is not aware of any accidents or injuries related to this condition.</p><p class="text-body-base"><b>What will Rivian do? </b></p><p class="text-body-base">Rivian has released an over-the-air update that enables automatic detection of any seatbelt misuse by the driver. In addition, Rivian will inspect and, as necessary, replace the driver&#x27;s seat belt pretensioner assembly in the affected vehicles free of charge.</p><p class="text-body-base"><b>What should you do? </b></p><p class="text-body-base">Please call 1.855.RIVB2B1 (1.855.748.2221) to schedule the recall service repair at your earliest convenience. The estimated recall service time should take less than an hour to complete, please plan accordingly. </p><p class="text-body-base"><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-ADAS OTA 2025.18.30" data-testid="accordion-header-button" id="AccordionHeader-section-ADAS OTA 2025.18.30" aria-describedby="AccordionBody-section-ADAS OTA 2025.18.30"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2025 Rivian R1S and R1T - Issued 09/08/2025  </div><h6 id="r1-adas-ota-20251830" class="rivian-css-1qz5z43 e1isdslg7">R1 ADAS OTA 2025.18.30</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 25V-585</strong><br/><strong>Rivian Recall No. FSAM-1744</strong><br/><strong>Transport Canada Recall No 2025-461</strong><br/>Recall Status: Remedy Available 09/12/25</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-ADAS OTA 2025.18.30" aria-labelledby="AccordionHeader-section-ADAS OTA 2025.18.30" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety exists in certain model year 2025 Rivian R1S and R1T vehicles.</p><p class="text-body-base"><b>What Is the problem? </b></p><p class="text-body-base">Rivian has determined that certain R1T and R1S vehicles in the U.S. and Canada were built with a version of Advanced Driver Assistance System (“ADAS”) before Software Version 2025.18.30. In one instance before software version 2025.18.30, a 2025 R1S was involved in a field incident in which Highway Assist experienced a one-time functional limitation due to a misclassification at a very low speed. The driver failed to maintain continuous and sustained responsibility for vehicle operation.<br/><br/>When a SAE Level 2 advanced driver assistance-system experiences a functional limitation and the vehicle is not controlled by the driver, there may be an increased risk of a crash. Rivian is not aware of any injuries related to this issue.</p><p class="text-body-base"><b>What will Rivian do? </b></p><p class="text-body-base">Rivian implemented software update (2025.18.30) on June 03, 2025 that remedied this condition. As of the date of this filing, software versions 2025.18.30 or later are already installed on more than 99% of potentially affected vehicles.</p><p class="text-body-base"><b>What should you do? </b></p><p class="text-body-base">If you have not already updated to software version 2025.18.30 or later, please do so to remedy this issue at no cost to you.</p><p class="text-body-base"><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-Improperly Tightened Ground Connection May Cause a Loss of Drive Power" data-testid="accordion-header-button" id="AccordionHeader-section-Improperly Tightened Ground Connection May Cause a Loss of Drive Power" aria-describedby="AccordionBody-section-Improperly Tightened Ground Connection May Cause a Loss of Drive Power"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2025 Rivian R1S and R1T - Issued 08/21/2025  </div><h6 id="r1-improperly-tightened-ground-connection-may-cause-a-loss-of-drive-power" class="rivian-css-1qz5z43 e1isdslg7">R1 Improperly Tightened Ground Connection May Cause a Loss of Drive Power</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 25V-537</strong><br/><strong>Rivian Recall No. FSAM-1723</strong><br/>Recall Status: Remedy Available 08/26/25</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-Improperly Tightened Ground Connection May Cause a Loss of Drive Power" aria-labelledby="AccordionHeader-section-Improperly Tightened Ground Connection May Cause a Loss of Drive Power" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety exists in certain model year 2025 Rivian R1S and R1T vehicles.</p><p class="text-body-base"><b>What Is the problem? </b></p><p class="text-body-base">Rivian has determined that certain R1T and R1S vehicles may have been built with an improperly grounded connection inside the High Voltage Distribution Box (HVDB). An improperly grounded electrical connection inside the HVDB may cause the vehicle to experience a loss of motive power without prior warning. A loss of motive power without prior warning may increase the risk of a crash. To date, Rivian is not aware of any accidents or injuries related to this condition.</p><p class="text-body-base"><b>What will Rivian do? </b></p><p class="text-body-base">Rivian will inspect and repair the HVDB ground strap joint on the potentially affected vehicles or replace the high voltage battery pack free of charge.</p><p class="text-body-base"><b>What should you do? </b></p><p class="text-body-base">Please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center at your earliest convenience. The length of time your vehicle will be in service for this recall, will be communicated to you upon Service calling for appointment confirmation. </p><p class="text-body-base"><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-Turn Signal Inoperative" data-testid="accordion-header-button" id="AccordionHeader-section-Turn Signal Inoperative" aria-describedby="AccordionBody-section-Turn Signal Inoperative"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2025 Rivian R1S and R1T - Issued 06/11/2025  </div><h6 id="r1-turn-signal-inoperative" class="rivian-css-1qz5z43 e1isdslg7">R1 Turn Signal Inoperative</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 25V-387</strong><br/><strong>Rivian Recall No. FSAM-1693</strong><br/><strong>Transport Canada Recall No 2025-314</strong><br/>Recall Status: Remedy Not Available 06/13/25</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-Turn Signal Inoperative" aria-labelledby="AccordionHeader-section-Turn Signal Inoperative" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian Automotive, LLC has decided that certain model year 2025 Rivian R1S and R1T vehicles fail to conform to Federal Motor Vehicle Safety Standard (FMVSS) 108 and Technical Standards Document (TSD) 108 - “Lamps, reflective devices, and assoc. equipment.”  </p><p class="text-body-base"><b>What Is the problem? </b></p><p class="text-body-base">One or both front turn signal lamps may not illuminate and flash due to issues during manufacturing from a supplier, and, therefore, may not fulfill the requirements of FMVSS 108 and TSD-108. Diminished front turn signal lamp performance may cause reduced awareness of the vehicle’s intent to turn for road users in front of the vehicle. Reduced awareness of intent to turn may increase the risk of a crash. Rivian is not aware of any crashes, injuries, or fatalities related to this condition. </p><p class="text-body-base"><b>What will Rivian do? </b></p><p class="text-body-base">Rivian will replace one or both front turn signal lamps on the affected vehicles free of charge. </p><p class="text-body-base"><b>What should you do? </b></p><p class="text-body-base">Please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center immediately. The length of time your vehicle will be in service for this recall, will be communicated to you upon Service calling for appointment confirmation. In the meantime, if your vehicle exhibits these signs, we encourage you to contact our service support team at 1-855-748-4265 to schedule an appointment. </p><p class="text-body-base"><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-Seat Belt D-Ring" data-testid="accordion-header-button" id="AccordionHeader-section-Seat Belt D-Ring" aria-describedby="AccordionBody-section-Seat Belt D-Ring"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2022-2025 Rivian R1S and R1T - Issued 06/03/2025  </div><h6 id="r1-seat-belt-d-ring" class="rivian-css-1qz5z43 e1isdslg7">R1 Seat Belt D-Ring</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 25V-370</strong><br/><strong>Rivian Recall No. FSAM-1681</strong><br/><strong>Transport Canada Recall No 2025-305</strong><br/>Recall Status: Remedy Available 06/06/25</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-Seat Belt D-Ring" aria-labelledby="AccordionHeader-section-Seat Belt D-Ring" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety exists in certain model year 2022-2025 Rivian R1S and R1T vehicles.</p><p class="text-body-base"><b>What Is the problem? </b></p><p class="text-body-base">Rivian has determined that on certain R1T and R1S vehicles, an anchorage for the front driver and/or passenger seat belt may not have been properly installed during the vehicle manufacturing process.</p><p class="text-body-base">An improperly secured seat belt anchor may not adequately restrain the seat occupant during a crash, increasing the risk of injury. To date, Rivian is not aware of any crashes, injuries, or fatalities related to this condition.</p><p class="text-body-base"><b>What will Rivian do? </b></p><p class="text-body-base">Rivian will inspect and, as necessary, properly secure the seat belt assembly anchorage in the affected vehicles free of charge.</p><p class="text-body-base"><b>What should you do? </b></p><p class="text-body-base">Please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center at your earliest convenience. The estimated recall service time should take about an hour to complete, please plan accordingly.</p><p class="text-body-base"><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-Headlamp Performance in Cold Weather" data-testid="accordion-header-button" id="AccordionHeader-section-Headlamp Performance in Cold Weather" aria-describedby="AccordionBody-section-Headlamp Performance in Cold Weather"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2025 Rivian R1S and R1T - Issued 02/13/2025  </div><h6 id="r1-headlamp-performance-in-cold-weather" class="rivian-css-1qz5z43 e1isdslg7">R1 Headlamp Performance in Cold Weather</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 25V-085</strong><br/><strong>Rivian Recall No. FSAM-1612</strong><br/><strong>Transport Canada Recall No 2025-073</strong><br/>Recall Status: Remedy Available 09/22/25</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-Headlamp Performance in Cold Weather" aria-labelledby="AccordionHeader-section-Headlamp Performance in Cold Weather" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian Automotive, LLC has decided that certain model year 2025 Rivian R1S and R1T vehicles fail to conform to Federal Motor Vehicle Safety Standard (FMVSS) 108 and Technical Standards Document (TSD) 108 - “Lamps, reflective devices, and assoc. equipment.”</p><p class="text-body-base"><b>What Is the problem? </b></p><p class="text-body-base">One or more headlamps, when operated in cold temperature conditions, may not illuminate at vehicle startup due to incorrectly configured parts from a supplier and may not fulfill the requirements of FMVSS 108 and TSD 108 - “Lamps, reflective devices, and assoc. equipment.” Diminished lighting performance may cause reduced visibility in certain conditions. Reduced visibility may increase the risk of a crash. Rivian is not aware of any accidents or injuries related to this condition.</p><p class="text-body-base"><b>What will Rivian do? </b></p><p class="text-body-base">Rivian will replace one or both headlamp control modules on the affected vehicles free of charge.</p><p class="text-body-base"><b>What should you do? </b></p><p class="text-body-base">Please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center immediately. The length of time your vehicle will be in service for this recall, will be communicated to you upon Service calling for appointment confirmation. In the meantime, if your vehicle exhibits these signs, we encourage you to contact our service support team at 1-855-748-4265 to schedule an appointment.</p><p class="text-body-base"><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-Deactivated Exterior Lighting" data-testid="accordion-header-button" id="AccordionHeader-section-Deactivated Exterior Lighting" aria-describedby="AccordionBody-section-Deactivated Exterior Lighting"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2025 Rivian R1S and R1T - Issued 11/01/2024  </div><h6 id="r1-deactivated-exterior-lighting" class="rivian-css-1qz5z43 e1isdslg7">R1 Deactivated Exterior Lighting</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 24V-827</strong><br/><strong>Rivian Recall No. FSAM-1552</strong><br/><strong>Transport Canada Recall No 2024-672</strong><br/>Recall Status: Remedy Available 11/13/24</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-Deactivated Exterior Lighting" aria-labelledby="AccordionHeader-section-Deactivated Exterior Lighting" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety exists in certain model year 2025 Rivian R1S and R1T vehicles.</p><p class="text-body-base"><b>What Is the problem? </b></p><p class="text-body-base">Certain exterior vehicle lighting may have been unavailable during vehicle operation if the Car Costume feature was activated after the vehicle had entered the “Ready” state. Diminished lighting performance may cause reduced visibility in certain conditions. Reduced visibility may increase the risk of a crash. </p><p class="text-body-base"><b>What will Rivian do? </b></p><p class="text-body-base">Rivian disabled the feature at issue in affected vehicles and implemented a new software update (2024.39.31) that remedies this condition and re-enables the Car Costume feature. All impacted vehicles were remedied on the same day, October 18, 2024, that the issue was identified. </p><p class="text-body-base"><b>What should you do? </b></p><p class="text-body-base">No action is required. All impacted vehicles were remedied with an over-the-air software update on the same day, October 18, 2024, that the issue was identified. </p><p class="text-body-base"><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-Steering Column Control Module Missing Cruise Markings" data-testid="accordion-header-button" id="AccordionHeader-section-Steering Column Control Module Missing Cruise Markings" aria-describedby="AccordionBody-section-Steering Column Control Module Missing Cruise Markings"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2025 Rivian R1S - Issued 09/06/2024  </div><h6 id="r1s-steering-column-control-module-missing-cruise-markings" class="rivian-css-1qz5z43 e1isdslg7">R1S Steering Column Control Module Missing Cruise Markings</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 24V-686</strong><br/><strong>Rivian Recall No. FSAM-1532</strong><br/>Recall Status: Remedy Available 09/18/24</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-Steering Column Control Module Missing Cruise Markings" aria-labelledby="AccordionHeader-section-Steering Column Control Module Missing Cruise Markings" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian Automotive, LLC has decided that certain model year 2025 Rivian R1S vehicles fail to comply with Federal Motor Vehicle Safety Standard (FMVSS) 101- “Controls and Displays” which requires that “Each control for an automatic vehicle speed system (cruise control)...must have identification provided for each function of each such system.” Our records show that you are the owner of a vehicle affected by this condition. </p><p class="text-body-base"><b>What Is the problem? </b></p><p class="text-body-base">Rivian has decided that certain model year 2025 Rivian R1S vehicles may fail to comply with Federal Motor Vehicle Safety Standard No. 101 “Controls and Displays”. These vehicles may have been manufactured with steering column control modules that were missing cruise control system markings due to a supplier error. Rivian is not aware of any crashes, injuries, or fatalities related to this condition.</p><p class="text-body-base"><b>What will Rivian do? </b></p><p class="text-body-base">Rivian will inspect potentially affected vehicles and replace the SCCMs that are missing cruise control markings, if any, at no cost to owners. </p><p class="text-body-base"><b>What should you do? </b></p><p class="text-body-base">Please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center at your earliest convenience. The estimated recall service time should take less than an hour to complete, please plan accordingly. </p><p class="text-body-base"><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-Incorrect Weight on Tire Placard Label" data-testid="accordion-header-button" id="AccordionHeader-section-Incorrect Weight on Tire Placard Label" aria-describedby="AccordionBody-section-Incorrect Weight on Tire Placard Label"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2022-2023 Rivian R1S and R1T - Issued 06/20/2024  </div><h6 id="r1-incorrect-weight-on-tire-placard-label" class="rivian-css-1qz5z43 e1isdslg7">R1 Incorrect Weight on Tire Placard Label</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 24V-458</strong><br/><strong>Rivian Recall No. FSAM-1491</strong><br/>Recall Status: Remedy Available 06/25/24</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-Incorrect Weight on Tire Placard Label" aria-labelledby="AccordionHeader-section-Incorrect Weight on Tire Placard Label" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian Automotive, LLC has determined that certain model year 2022-2023 Rivian R1S and R1T vehicles fail to conform to Federal Motor Vehicle Safety Standard (FMVSS) No. 110 – Tire Selection and Rims. </p><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What Is the problem?  " data-testid="accordion-header-button" id="AccordionHeader-section-What Is the problem?  " aria-describedby="AccordionBody-section-What Is the problem?  "><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What Is the problem?  </h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What Is the problem?  " aria-labelledby="AccordionHeader-section-What Is the problem?  " aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Federal Motor Vehicle Safety Standard (“FMVSS”) 571.110 (S4.3) - Placard, requires that &quot;each vehicle shall show...(a) vehicle capacity weight expressed as &quot;the combined weight of occupants and cargo should never exceed XXX kilograms or XXX pounds.&quot; Subject vehicles are equipped with a tire placard label that does not correctly define the max vehicle capacity weight. <br/><br/>A driver may rely on the incorrect payload capacity and overload the vehicle, which can cause a vehicle crash without prior warning. </p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What will Rivian do?  " data-testid="accordion-header-button" id="AccordionHeader-section-What will Rivian do?  " aria-describedby="AccordionBody-section-What will Rivian do?  "><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What will Rivian do?  </h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What will Rivian do?  " aria-labelledby="AccordionHeader-section-What will Rivian do?  " aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Rivian will mail the correct tire placard overlay labels to customers.   </p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What should you do? " data-testid="accordion-header-button" id="AccordionHeader-section-What should you do? " aria-describedby="AccordionBody-section-What should you do? "><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What should you do? </h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What should you do? " aria-labelledby="AccordionHeader-section-What should you do? " aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">You may choose to apply the enclosed overlay label using the instruction as described in the recall customer letter you will receive in the mail. Or if you prefer not to install the label yourself, simply contact Rivian Service Support at 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center at your earliest convenience to have the label installed free of charge. The estimated repair time should take less than an hour to complete. Please bring the overlay label and the recall customer letter you received in the mail with you to your Service Center.<br/><br/><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-Replace Upper B-Pillar and/or C-Pillar Trim Panels" data-testid="accordion-header-button" id="AccordionHeader-section-Replace Upper B-Pillar and/or C-Pillar Trim Panels" aria-describedby="AccordionBody-section-Replace Upper B-Pillar and/or C-Pillar Trim Panels"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2022-2024 Rivian R1S and R1T - Issued 06/05/2024  </div><h6 id="r1-replace-upper-b-pillar-andor-c-pillar-trim-panels" class="rivian-css-1qz5z43 e1isdslg7">R1 Replace Upper B-Pillar and/or C-Pillar Trim Panels</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 24V-408</strong><br/><strong>Transport Canada Recall No. 2024-318</strong><br/><strong>Rivian Recall No. FSAM-1464</strong><br/>Recall Status: Remedy Available 06/14/24</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-Replace Upper B-Pillar and/or C-Pillar Trim Panels" aria-labelledby="AccordionHeader-section-Replace Upper B-Pillar and/or C-Pillar Trim Panels" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety exists in certain model year 2022-2024 Rivian R1S and R1T vehicles.</p><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What Is the problem?  " data-testid="accordion-header-button" id="AccordionHeader-section-What Is the problem?  " aria-describedby="AccordionBody-section-What Is the problem?  "><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What Is the problem?  </h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What Is the problem?  " aria-labelledby="AccordionHeader-section-What Is the problem?  " aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">The upper pillar trim panel(s) may have been removed and then reused instead of being removed and replaced with a brand-new component. Removal and reuse may result in damage to the attachment clip(s) that secure the trim panel to the pillar. For R1T only the upper B-pillars are potentially impacted. For R1S the upper B and/or C-pillars are potentially impacted. <br/><br/>Damaged upper B and/or C pillar trim panel attachment clip(s) may result in an improper side air bag inflatable curtain deployment, which may increase the risk of occupant injury during rollover and side impact crashes. </p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What will Rivian do?  " data-testid="accordion-header-button" id="AccordionHeader-section-What will Rivian do?  " aria-describedby="AccordionBody-section-What will Rivian do?  "><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What will Rivian do?  </h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What will Rivian do?  " aria-labelledby="AccordionHeader-section-What will Rivian do?  " aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Rivian will remove the potentially affected pillar trim panel(s) and replace them with new parts at no cost to owners. </p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What should you do? " data-testid="accordion-header-button" id="AccordionHeader-section-What should you do? " aria-describedby="AccordionBody-section-What should you do? "><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What should you do? </h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What should you do? " aria-labelledby="AccordionHeader-section-What should you do? " aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">You should already have received a call from Rivian Service Support to schedule your recall service appoinment. If for some reason you do not already have an appointment, please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center immediately. The estimated recall service time should take less than two hours to complete, please plan accordingly. <br/><br/><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-Headlight Aiming" data-testid="accordion-header-button" id="AccordionHeader-section-Headlight Aiming" aria-describedby="AccordionBody-section-Headlight Aiming"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2023-2024 Rivian R1S, R1T and EDV - Issued 05/23/2024  </div><h6 id="r1-and-edv-headlight-aiming" class="rivian-css-1qz5z43 e1isdslg7">R1 and EDV Headlight Aiming</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 24V-367</strong><br/><strong>Transport Canada Recall No. 2024-292</strong><br/><strong>Rivian Recall No. FSAM-1445</strong><br/>Recall Status: Remedy Available 05/31/24</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-Headlight Aiming" aria-labelledby="AccordionHeader-section-Headlight Aiming" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian Automotive, LLC has decided that certain model year 2023-2024 Rivian R1S, R1T, and EDV vehicles fail to conform to Federal Motor Vehicle Safety Standard FMVSS 108 (Lamp, reflective devices and associated equipment - §571.108 S10.14.6). </p><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What Is the problem?  " data-testid="accordion-header-button" id="AccordionHeader-section-What Is the problem?  " aria-describedby="AccordionBody-section-What Is the problem?  "><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What Is the problem?  </h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What Is the problem?  " aria-labelledby="AccordionHeader-section-What Is the problem?  " aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Rivian has determined that on certain model year 2023 and 2024 R1T, R1S, and EDV vehicles the headlamps are aimed slightly too low and do not meet current production specifications or fulfill the requirements of FMVSS 108 (Lamp, reflective devices and associated equipment - §571.108 S10.14.6). Headlamps that are not aimed properly can result in insufficient illumination of the road while driving, which may increase the risk of a crash while driving at night. </p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What will Rivian do?  " data-testid="accordion-header-button" id="AccordionHeader-section-What will Rivian do?  " aria-describedby="AccordionBody-section-What will Rivian do?  "><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What will Rivian do?  </h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What will Rivian do?  " aria-labelledby="AccordionHeader-section-What will Rivian do?  " aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Rivian will check the headlamp adjustment on the affected vehicles and correct it, if necessary.   </p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What should you do? " data-testid="accordion-header-button" id="AccordionHeader-section-What should you do? " aria-describedby="AccordionBody-section-What should you do? "><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What should you do? </h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What should you do? " aria-labelledby="AccordionHeader-section-What should you do? " aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center at your earliest convenience. The estimated recall service time should take less than an hour to complete, please plan accordingly.  </p><p class="text-body-base"><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-Dashboard Air Bag Label" data-testid="accordion-header-button" id="AccordionHeader-section-Dashboard Air Bag Label" aria-describedby="AccordionBody-section-Dashboard Air Bag Label"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2024 Rivian R1S and R1T- Issued 05/09/2024  </div><h6 id="r1-dashboard-air-bag-label" class="rivian-css-1qz5z43 e1isdslg7">R1 Dashboard Air Bag Label</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 24V-319</strong><br/><strong>Rivian Recall No. FSAM-1429</strong><br/>Recall Status: Remedy Available 05/14/24</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-Dashboard Air Bag Label" aria-labelledby="AccordionHeader-section-Dashboard Air Bag Label" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian Automotive, LLC has decided that certain model year 2024 Rivian R1S and R1T vehicles fail to confirm to Federal Motor Vehicle Safety Standard (FMVSS) No. 208 – Occupant Crash Protection.</p><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What Is the problem?  " data-testid="accordion-header-button" id="AccordionHeader-section-What Is the problem?  " aria-describedby="AccordionBody-section-What Is the problem?  "><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What Is the problem?  </h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What Is the problem?  " aria-labelledby="AccordionHeader-section-What Is the problem?  " aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Federal Motor Vehicle Safety Standard (&quot;FMVSS&quot;) 571.208 Occupant crash protection states, &quot;Vehicles certified to meet the requirements specified in S19, S21, and S23 on or after December 1, 2003, that are equipped with an inflatable restraint for the passenger position shall have a label attached to a location on the dashboard or the steering control hub that is visible from all front seating positions. The label need not be permanently affixed to the vehicle.&quot; Some vehicles built during the suspect period were not equipped with the required label.  <br/><br/>If a dashboard air bag warning label is missing, the occupant may not be aware of the risks a deploying air bag may pose to an infant or child occupying the front passenger seat.  </p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What should you do? " data-testid="accordion-header-button" id="AccordionHeader-section-What should you do? " aria-describedby="AccordionBody-section-What should you do? "><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What should you do? </h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What should you do? " aria-labelledby="AccordionHeader-section-What should you do? " aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Rivian requests that you read and understand the following air bag warning label information provided with the letter however no further action on your behalf is required.</p><p class="text-body-base"><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-R1 Daytime Running Lamps Noncompliance`" data-testid="accordion-header-button" id="AccordionHeader-section-R1 Daytime Running Lamps Noncompliance`" aria-describedby="AccordionBody-section-R1 Daytime Running Lamps Noncompliance`"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2022-2024 Rivian R1S and R1T - Issued 02/08/2024  </div><h6 id="r1-daytime-running-lamps-noncompliance" class="rivian-css-1qz5z43 e1isdslg7">R1 Daytime Running Lamps Noncompliance</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>Transport Canada Recall No. 2024-077</strong><br/><strong>Rivian Recall No. FSAM-1385</strong><br/>Recall Status: Remedy Available 02/12/24</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-R1 Daytime Running Lamps Noncompliance`" aria-labelledby="AccordionHeader-section-R1 Daytime Running Lamps Noncompliance`" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian Automotive, LLC has decided that certain model year 2022-2024 Rivian R1S and R1T vehicles fail to conform with Canadian Motor Vehicle Safety Standard No. 108 “Lighting Systems and Reflective Devices.”</p><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What is the problem?" data-testid="accordion-header-button" id="AccordionHeader-section-What is the problem?" aria-describedby="AccordionBody-section-What is the problem?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What is the problem?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What is the problem?" aria-labelledby="AccordionHeader-section-What is the problem?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">The affected vehicles were built with daytime running lamps that do not comply with regulatory visibility requirements. If the daytime running lamps are switched off manually by setting the lighting mode to the “parking” setting, the daytime running lights will not reactivate automatically. When the vehicle is operated in the “parking” lights mode, the lamps used as daytime running lamps will illuminate. However, the brightness is not sufficiently bright to meet the requirements of daytime running lamps. This noncompliance may affect visibility and potentially increase the risk of a crash. </p><p class="text-body-base"><br/>Dayime running lamps are on when driving with the vehicle in the “auto” lighting mode. Leaving the lights in this mode, as they are by default, will minimize the safety risk.  <br/></p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What will Rivian do?" data-testid="accordion-header-button" id="AccordionHeader-section-What will Rivian do?" aria-describedby="AccordionBody-section-What will Rivian do?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What will Rivian do?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What will Rivian do?" aria-labelledby="AccordionHeader-section-What will Rivian do?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Rivian will update the software of the affected vehicles through an over-the-air update (2024.03.02) that will ensure daytime running lamps are reactivated automatically when the vehicle speed goes above 10km/h. The recall service will be available at no cost to you.  </p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What should you do?" data-testid="accordion-header-button" id="AccordionHeader-section-What should you do?" aria-describedby="AccordionBody-section-What should you do?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What should you do?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What should you do?" aria-labelledby="AccordionHeader-section-What should you do?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Rivian has already implemented a new software update (2024.03.02). As of February 12, 2024 this software will be available on your vehicle, please install this software update 2024.03.02 at your earliest convenience. Software update should take an hour to complete. </p><p class="text-body-base"><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion
