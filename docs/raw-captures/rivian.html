-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-Replace Accelerator Pedal" data-testid="accordion-header-button" id="AccordionHeader-section-Replace Accelerator Pedal" aria-describedby="AccordionBody-section-Replace Accelerator Pedal"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2022 Rivian R1S &amp; R1T - Issued 12/21/23  </div><h6 id="replace-accelerator-pedal" class="rivian-css-1qz5z43 e1isdslg7">Replace Accelerator Pedal</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 23V-883</strong><br/><strong>Rivian Recall No. FSAM-1342</strong><br/>Recall Status: Remedy Available 01/02/2024</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-Replace Accelerator Pedal" aria-labelledby="AccordionHeader-section-Replace Accelerator Pedal" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety existed in certain model year 2022 Rivian R1S and R1T vehicles that were built with an early revision accelerator pedal. </p><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What Is the problem?  " data-testid="accordion-header-button" id="AccordionHeader-section-What Is the problem?  " aria-describedby="AccordionBody-section-What Is the problem?  "><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What Is the problem?  </h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What Is the problem?  " aria-labelledby="AccordionHeader-section-What Is the problem?  " aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">The accelerator pedal may not detect when the driver releases the pedal in hot cabin temperatures, failing to activate &quot;auto-hold&quot; or &quot;park&quot; as intended.  If this occurs, the vehicle may not automatically go into “auto-hold” or “park”. This condition may cause the vehicle to creep forward. If this occurs, the driver will be required to take other action to place the vehicle into “hold” or “park”, such as depressing the brake pedal and/or pressing the “park” button.  If the vehicle does not automatically go into “auto-hold” or &quot;park”, this may increase the risk of a crash.</p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What will Rivian do?  " data-testid="accordion-header-button" id="AccordionHeader-section-What will Rivian do?  " aria-describedby="AccordionBody-section-What will Rivian do?  "><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What will Rivian do?  </h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What will Rivian do?  " aria-labelledby="AccordionHeader-section-What will Rivian do?  " aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Rivian has already implemented a new software update (2023.46.01 or 2023.50).  Software update should take an hour to complete.   </p><p class="text-body-base">Rivian will also replace all subject accelerator pedals, free of charge.</p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What should you do? " data-testid="accordion-header-button" id="AccordionHeader-section-What should you do? " aria-describedby="AccordionBody-section-What should you do? "><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What should you do? </h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What should you do? " aria-labelledby="AccordionHeader-section-What should you do? " aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">At your earliest convenience, install software update 2023.46.01. <br/> <br/>Rivian’s Service Support Team will contact you by end of February, 2024 once we’re ready to schedule your pedal replacement appointment. <br/><br/><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-2023.42 OTA" data-testid="accordion-header-button" id="AccordionHeader-section-2023.42 OTA" aria-describedby="AccordionBody-section-2023.42 OTA"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2022-2023 Rivian R1S &amp; R1T - Issued 11/21/23 </div><h6 id="202342-ota" class="rivian-css-1qz5z43 e1isdslg7">2023.42 OTA</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 23V-783</strong><br/><strong>Rivian Recall No. FSAM-1331</strong><br/>Recall Status: Remedy Available 11/15/23</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-2023.42 OTA" aria-labelledby="AccordionHeader-section-2023.42 OTA" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety existed in certain model year 2022 – 2023 Rivian R1S and R1T vehicles. </p><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What is the problem?" data-testid="accordion-header-button" id="AccordionHeader-section-What is the problem?" aria-describedby="AccordionBody-section-What is the problem?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What is the problem?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What is the problem?" aria-labelledby="AccordionHeader-section-What is the problem?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">On the affected vehicles that installed over-the-air (OTA) software update 2023.42.0 on November 13, 2023, in-vehicle defroster system controls and functionality may have been temporarily unavailable during vehicle operation. Diminished windshield defrost performance may cause reduced visibility in certain conditions, increasing the risk of a crash.</p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What will Rivian do?" data-testid="accordion-header-button" id="AccordionHeader-section-What will Rivian do?" aria-describedby="AccordionBody-section-What will Rivian do?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What will Rivian do?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What will Rivian do?" aria-labelledby="AccordionHeader-section-What will Rivian do?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Rivian implemented software update 2023.42.02, on November 15, 2023, that restored in-vehicle defroster system controls and functionality to affected vehicles. This update was installed on all affected vehicles by November 19, 2023.   </p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What should you do?" data-testid="accordion-header-button" id="AccordionHeader-section-What should you do?" aria-describedby="AccordionBody-section-What should you do?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What should you do?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What should you do?" aria-labelledby="AccordionHeader-section-What should you do?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">No action is required. Rivian has confirmed that your vehicle has already installed software update 2023.42.02, which remedied the condition.  </p><p class="text-body-base"><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-Backup Lamps" data-testid="accordion-header-button" id="AccordionHeader-section-Backup Lamps" aria-describedby="AccordionBody-section-Backup Lamps"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2022-2023 Rivian R1S - Issued 03/31/23  </div><h6 id="backup-lamps" class="rivian-css-1qz5z43 e1isdslg7">Backup Lamps</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 23V-233</strong><br/><strong>Rivian Recall No. FSAM-1216</strong><br/>Recall Status: Remedy Available 07/12/23</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-Backup Lamps" aria-labelledby="AccordionHeader-section-Backup Lamps" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian has decided that certain model year 2022-2023 R1S vehicles fail to conform with Federal Motor Vehicle Safety Standard No. 108 “Lamps, Reflective Devices, and Associated Equipment.” </p><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What is the problem?" data-testid="accordion-header-button" id="AccordionHeader-section-What is the problem?" aria-describedby="AccordionBody-section-What is the problem?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What is the problem?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What is the problem?" aria-labelledby="AccordionHeader-section-What is the problem?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">The affected vehicles were built with backup lamps that do not comply with regulatory visibility requirements.  When the vehicle is in reverse, the back-up lamps will illuminate. However, the optical center may not be visible from the specified planes. This noncompliance may affect visibility and potentially increase the risk of a crash. </p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What will Rivian do?" data-testid="accordion-header-button" id="AccordionHeader-section-What will Rivian do?" aria-describedby="AccordionBody-section-What will Rivian do?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What will Rivian do?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What will Rivian do?" aria-labelledby="AccordionHeader-section-What will Rivian do?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Rivian will replace the backup lamps that do not meet regulatory visibility requirements. The recall service will be available at no cost to you.     </p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What should you do?" data-testid="accordion-header-button" id="AccordionHeader-section-What should you do?" aria-describedby="AccordionBody-section-What should you do?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What should you do?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What should you do?" aria-labelledby="AccordionHeader-section-What should you do?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center immediately. The estimated recall service time should take less than an hour to complete, please plan accordingly. </p><p class="text-body-base"><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-Passenger Air Bag May Not Deploy Properly" data-testid="accordion-header-button" id="AccordionHeader-section-Passenger Air Bag May Not Deploy Properly" aria-describedby="AccordionBody-section-Passenger Air Bag May Not Deploy Properly"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2022 Rivian R1T &amp; R1S - Issued 02/22/23  </div><h6 id="passenger-air-bag-may-not-deploy-properly" class="rivian-css-1qz5z43 e1isdslg7">Passenger Air Bag May Not Deploy Properly</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 23V-109</strong><br/><strong>Rivian Recall No. FSAM-1166</strong><br/>Recall Status: Remedy Available 02/28/23</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-Passenger Air Bag May Not Deploy Properly" aria-labelledby="AccordionHeader-section-Passenger Air Bag May Not Deploy Properly" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian has decided that certain model year 2022 R1S and R1T vehicles fail to conform with Federal Motor Vehicle Safety Standard No. 208 “Occupant Crash Protection.”</p><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What is the problem?" data-testid="accordion-header-button" id="AccordionHeader-section-What is the problem?" aria-describedby="AccordionBody-section-What is the problem?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What is the problem?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What is the problem?" aria-labelledby="AccordionHeader-section-What is the problem?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">On a very small percentage of vehicles, a sensor in the front passenger seat belt system may incorrectly report its status as &quot;on&quot; when, in fact, it is off. Since the system may not register the status correctly, it may cause the passenger air bag not to deploy as intended.</p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What will Rivian do?" data-testid="accordion-header-button" id="AccordionHeader-section-What will Rivian do?" aria-describedby="AccordionBody-section-What will Rivian do?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What will Rivian do?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What will Rivian do?" aria-labelledby="AccordionHeader-section-What will Rivian do?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Rivian will offer no appointment necessary visits to Rivian Service Centers and pop-up locations up to 6  days a week to inspect and replace, if necessary, passenger seat belt system components in the affected vehicles. Impacted owners may also choose to schedule a service appointment.</p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What should you do?" data-testid="accordion-header-button" id="AccordionHeader-section-What should you do?" aria-describedby="AccordionBody-section-What should you do?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What should you do?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What should you do?" aria-labelledby="AccordionHeader-section-What should you do?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Rivian Service Centers and pop-up service locations that will offer expanded hours of operation and inspections without an appointment are listed <a href="https://rivian.com/support/article/where-can-i-take-my-rivian-to-get-the-front-passenger-seat-belt-sensor-inspected" class="underline-interact">here</a>. Before your visit, please install the latest software update to your vehicle.If you have questions or would prefer to schedule an appointment, you can also call our Service Team at 855-748-4265.</p><p class="text-body-base"><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-Steering Knuckle and Control Arm May Separate" data-testid="accordion-header-button" id="AccordionHeader-section-Steering Knuckle and Control Arm May Separate" aria-describedby="AccordionBody-section-Steering Knuckle and Control Arm May Separate"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2022 Rivian R1T, R1S &amp; EDV - Issued 10/06/22</div><h6 id="steering-knuckle-and-control-arm-may-separate" class="rivian-css-1qz5z43 e1isdslg7">Steering Knuckle and Control Arm May Separate</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 22V-744</strong><br/><strong>Rivian Recall No. FSAM-997</strong><br/>Recall Status: Remedy Available 10/07/22</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-Steering Knuckle and Control Arm May Separate" aria-labelledby="AccordionHeader-section-Steering Knuckle and Control Arm May Separate" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian has decided that a defect which relates to motor vehicle safety exists in certain model year 2022 Rivian R1T, R1S, and EDV vehicles. The subject population is comprised of model year 2022 R1T and R1S vehicles built during a 13-month period, and a subset of EDVs produced between December 10, 2021 and September 27, 2022, in which records cannot confirm that the front upper control arm and the steering knuckle retention fastener for each front wheel was sufficiently torqued.</p><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What is the problem?" data-testid="accordion-header-button" id="AccordionHeader-section-What is the problem?" aria-describedby="AccordionBody-section-What is the problem?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What is the problem?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What is the problem?" aria-labelledby="AccordionHeader-section-What is the problem?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">An insufficiently torqued steering knuckle fastener could cause excessive wheel camber, or, in rare instances, a separation, affecting the driver’s ability to control the vehicle, and increasing the risk of a crash.</p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What will Rivian do?" data-testid="accordion-header-button" id="AccordionHeader-section-What will Rivian do?" aria-describedby="AccordionBody-section-What will Rivian do?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What will Rivian do?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What will Rivian do?" aria-labelledby="AccordionHeader-section-What will Rivian do?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Rivian will offer Mobile Service appointments, no appointment needed visits to Rivian Service Centers or pop-up service locations, and prioritized appointments at Rivian Service Centers to inspect and, as necessary, sufficiently secure the steering knuckle fasteners for the affected vehicles. For the very small percentage where parts replacements are required, loaner vehicles will be made available while the vehicle is brought into a Rivian Service Center. The recall service and as needed, trip interruption, and towing services will be available at no cost to you.</p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What should you do?" data-testid="accordion-header-button" id="AccordionHeader-section-What should you do?" aria-describedby="AccordionBody-section-What should you do?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What should you do?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What should you do?" aria-labelledby="AccordionHeader-section-What should you do?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">If you have further questions, please call Rivian Service at <a href="tel:18557484265" class="underline-interact">1-855-748-4265</a><a href="tel:855-748-4265" class="underline-interact">.</a> For additional information please visit our <a href="https://rivian.com/support/article/where-can-i-take-my-rivian-to-get-the-upper-control-arm-fastener-inspected-and-f" class="underline-interact">Support Center</a>. The official recall notice will be posted by the National Highway Traffic Safety Administration (<a href="https://www.nhtsa.gov/campaign/safercargov" class="underline-interact">NHTSA</a>) on October 8, 2022.</p><p class="text-body-base"><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-Improperly Secured Front Seat Belt Anchor" data-testid="accordion-header-button" id="AccordionHeader-section-Improperly Secured Front Seat Belt Anchor" aria-describedby="AccordionBody-section-Improperly Secured Front Seat Belt Anchor"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2022 Rivian R1T &amp; R1S - Issued 08/25/22  </div><h6 id="improperly-secured-front-seat-belt-anchor" class="rivian-css-1qz5z43 e1isdslg7">Improperly Secured Front Seat Belt Anchor</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 22V-641</strong><br/><strong>Rivian Recall No. FSAM-924</strong><br/>Recall Status: Remedy Available 09/30/22</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-Improperly Secured Front Seat Belt Anchor" aria-labelledby="AccordionHeader-section-Improperly Secured Front Seat Belt Anchor" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian has decided that a defect which relates to motor vehicle safety exists in certain model year 2022 Rivian R1T and R1S vehicles. Some of the population may have been built with suspect seat belt assembly anchorage installations.</p><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What is the problem?" data-testid="accordion-header-button" id="AccordionHeader-section-What is the problem?" aria-describedby="AccordionBody-section-What is the problem?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What is the problem?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What is the problem?" aria-labelledby="AccordionHeader-section-What is the problem?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">The front seat belt anchors may have been inadequately attached to the B-pillar. An improperly secured seat belt anchor may not adequately restrain the seat occupant during a crash, increasing the risk of injury.</p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What will Rivian do?" data-testid="accordion-header-button" id="AccordionHeader-section-What will Rivian do?" aria-describedby="AccordionBody-section-What will Rivian do?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What will Rivian do?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What will Rivian do?" aria-labelledby="AccordionHeader-section-What will Rivian do?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Your Rivian Mobile Service Technician or Rivian Service Center will inspect and, as necessary, properly secure the seat belt anchorage in the affected vehicles free of charge.</p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What should you do?" data-testid="accordion-header-button" id="AccordionHeader-section-What should you do?" aria-describedby="AccordionBody-section-What should you do?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What should you do?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What should you do?" aria-labelledby="AccordionHeader-section-What should you do?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Please call 1-855-748-4265 to schedule the recall service repair immediately. The estimated recall service time will be approximately 1 hour, please plan accordingly.</p><p class="text-body-base"><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div></div></div></div></div></div></div></div><div class="RivianAccordion-root e1isdslg2 rivian-css-1twdurc"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1isdslg4 rivian-css-1hz6v27" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1isdslg5 rivian-css-739pxa" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-Improperly Calibrated Front Passenger Seat OCS" data-testid="accordion-header-button" id="AccordionHeader-section-Improperly Calibrated Front Passenger Seat OCS" aria-describedby="AccordionBody-section-Improperly Calibrated Front Passenger Seat OCS"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <div data-testid="styled-accordian-header-markdown"><div class="rivian-css-1mx0bmx e1isdslg6">2022 Rivian R1T - Issued 05/10/22</div><h6 id="improperly-calibrated-front-passenger-seat-ocs" class="rivian-css-1qz5z43 e1isdslg7">Improperly Calibrated Front Passenger Seat OCS</h6><div class="rivian-css-1mx0bmx e1isdslg6"><strong>NHTSA Recall No. 22V-319</strong><br/><strong>Rivian Recall No. FSAM-651</strong><br/>Recall Status: Remedy Available 05/10/22</div></div></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div rotate="0deg" class="rivian-css-lcu46n"><svg width="20" height="11" viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2L10 10L18 2" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-section-Improperly Calibrated Front Passenger Seat OCS" aria-labelledby="AccordionHeader-section-Improperly Calibrated Front Passenger Seat OCS" aria-hidden="true"><div class="rivian-css-imuscf e1isdslg3"><p class="text-body-base">Rivian has decided that certain model year 2022 Rivian R1T vehicles fail to conform with Federal Motor Vehicle Safety Standard No. 208 “Occupant Crash Protection”.</p><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What is the problem?" data-testid="accordion-header-button" id="AccordionHeader-section-What is the problem?" aria-describedby="AccordionBody-section-What is the problem?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What is the problem?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What is the problem?" aria-labelledby="AccordionHeader-section-What is the problem?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">If a child seat or a child is seated in the front passenger seat, the passenger air bag may not be deactivated as required. In the event of a crash which deploys the front passenger air bag, the infant in the child seat or child occupant may have an increased risk of injury.</p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What will Rivian do?" data-testid="accordion-header-button" id="AccordionHeader-section-What will Rivian do?" aria-describedby="AccordionBody-section-What will Rivian do?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What will Rivian do?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What will Rivian do?" aria-labelledby="AccordionHeader-section-What will Rivian do?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Your Rivian Mobile Service Technician or Rivian Service Center will replace the front passenger seat, free of charge, in your vehicle.</p></div></div></div></div></div></div></div><div class="RivianAccordion-root rivian-css-192nnht"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters e1x3h6ah4 rivian-css-ijq9yt" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters e1x3h6ah0 rivian-css-wbh4v7" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-section-What should you do?" data-testid="accordion-header-button" id="AccordionHeader-section-What should you do?" aria-describedby="AccordionBody-section-What should you do?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <h6 class="rivian-css-fey66h e1x3h6ah1">What should you do?</h6></div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root e1x3h6ah3 rivian-css-1dtv9yb" role="region" id="AccordionBody-section-What should you do?" aria-labelledby="AccordionHeader-section-What should you do?" aria-hidden="true"><div class="rivian-css-1j1b1i1 e1x3h6ah2"><p class="text-body-base">Please call 1-855-748-4265 to schedule the recall service repair immediately. The estimated recall service time will be approximately 1.5 hours, please plan accordingly. For the time being, you should not seat children 12 and under or use child seats in the front passenger seat of the vehicle.<br/><br/><b>If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.</b></p></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div><div class="rivian-css-1ngc1oj evlqhbw0"><div class="rivian-css-143kh18 evlqhbw1">If you received a recall notice:</div><div class="rivian-css-63o5bb evlqhbw2"><div class="rivian-css-1k3fhjv evlqhbw3"><div class="rivian-css-6ke4r3 evlqhbw4"><p style="margin-top:0px;margin-bottom:0px" class="text-body-base">If your Rivian is affected by a recall, you&#x27;ll be contacted when your vehicle is ready to be repaired. If you have questions, contact our Rivian Service Support Team at <a href="tel:+1-855-748-4265" class="underline-interact"><u>(855) RIVIAN5</u></a>.</p></div></div></div></div><div class="rivian-css-um7fcg eywhccn1"><div class="rivian-css-nwuaey eywhccn0">Recall FAQs</div><div class="RivianAccordion-root eywhccn2 rivian-css-1akl3mm"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters eywhccn3 rivian-css-1rhrum2" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters eywhccn4 rivian-css-e8s9ej" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-How do I know if my vehicle has a recall?" data-testid="accordion-header-button" id="AccordionHeader-How do I know if my vehicle has a recall?" aria-describedby="AccordionBody-How do I know if my vehicle has a recall?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <!-- -->How do I know if my vehicle has a recall?</div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-How do I know if my vehicle has a recall?" aria-labelledby="AccordionHeader-How do I know if my vehicle has a recall?" aria-hidden="true"><div class="rivian-css-jj1wa eywhccn5"><p class="text-body-base">Rivian will notify affected vehicle owners by mail for safety and noncompliance recalls and campaigns. The notification will provide details on the issue and give instructions on what to do. You can also visit <a href="https://www.NHTSA.gov/recalls" class="underline-interact"><u> NHTSA.gov/recalls</u></a> and use your Vehicle Identification Number (VIN) to see if there are any open recalls on your vehicle.</p></div></div></div></div></div></div></div><div class="RivianAccordion-root eywhccn2 rivian-css-1akl3mm"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters eywhccn3 rivian-css-1rhrum2" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters eywhccn4 rivian-css-e8s9ej" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-My vehicle is involved in a recall. Do I need a recall notification to have the repair done?" data-testid="accordion-header-button" id="AccordionHeader-My vehicle is involved in a recall. Do I need a recall notification to have the repair done?" aria-describedby="AccordionBody-My vehicle is involved in a recall. Do I need a recall notification to have the repair done?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <!-- -->My vehicle is involved in a recall. Do I need a recall notification to have the repair done?</div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-My vehicle is involved in a recall. Do I need a recall notification to have the repair done?" aria-labelledby="AccordionHeader-My vehicle is involved in a recall. Do I need a recall notification to have the repair done?" aria-hidden="true"><div class="rivian-css-jj1wa eywhccn5"><p class="text-body-base">A recall notification isn’t required to repair your vehicle. Schedule an appointment to have the repair completed at no cost to you through Rivian Service.</p></div></div></div></div></div></div></div><div class="RivianAccordion-root eywhccn2 rivian-css-1akl3mm"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters eywhccn3 rivian-css-1rhrum2" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters eywhccn4 rivian-css-e8s9ej" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-Where do I go to get my vehicle repaired if I have a recall?" data-testid="accordion-header-button" id="AccordionHeader-Where do I go to get my vehicle repaired if I have a recall?" aria-describedby="AccordionBody-Where do I go to get my vehicle repaired if I have a recall?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <!-- -->Where do I go to get my vehicle repaired if I have a recall?</div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-Where do I go to get my vehicle repaired if I have a recall?" aria-labelledby="AccordionHeader-Where do I go to get my vehicle repaired if I have a recall?" aria-hidden="true"><div class="rivian-css-jj1wa eywhccn5"><p class="text-body-base">Please contact <!-- -->Rivian Service<!-- --> to find out if the repair can be completed with Mobile Service or if you’ll need to schedule an appointment with a Service Center. </p></div></div></div></div></div></div></div><div class="RivianAccordion-root eywhccn2 rivian-css-1akl3mm"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters eywhccn3 rivian-css-1rhrum2" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters eywhccn4 rivian-css-e8s9ej" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-Will alternate transportation be provided while the recall repair is being done?" data-testid="accordion-header-button" id="AccordionHeader-Will alternate transportation be provided while the recall repair is being done?" aria-describedby="AccordionBody-Will alternate transportation be provided while the recall repair is being done?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <!-- -->Will alternate transportation be provided while the recall repair is being done?</div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-Will alternate transportation be provided while the recall repair is being done?" aria-labelledby="AccordionHeader-Will alternate transportation be provided while the recall repair is being done?" aria-hidden="true"><div class="rivian-css-jj1wa eywhccn5"><p class="text-body-base">Rivian Service will determine if you&#x27;re eligible for alternate transportation while the recall repair is being completed.</p></div></div></div></div></div></div></div><div class="RivianAccordion-root eywhccn2 rivian-css-1akl3mm"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters eywhccn3 rivian-css-1rhrum2" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters eywhccn4 rivian-css-e8s9ej" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-What is the warranty on a repair if the recalled component fails again?" data-testid="accordion-header-button" id="AccordionHeader-What is the warranty on a repair if the recalled component fails again?" aria-describedby="AccordionBody-What is the warranty on a repair if the recalled component fails again?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <!-- -->What is the warranty on a repair if the recalled component fails again?</div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-What is the warranty on a repair if the recalled component fails again?" aria-labelledby="AccordionHeader-What is the warranty on a repair if the recalled component fails again?" aria-hidden="true"><div class="rivian-css-jj1wa eywhccn5"><p class="text-body-base">If the subsequent issue is related to a previous recall, your vehicle will be repaired again at no cost to you.</p></div></div></div></div></div></div></div><div class="RivianAccordion-root eywhccn2 rivian-css-1akl3mm"><div class="MuiPaper-root MuiPaper-elevation MuiPaper-elevation1 MuiAccordion-root MuiAccordion-gutters eywhccn3 rivian-css-1rhrum2" data-testid="accordion-section"><div class="MuiButtonBase-root MuiAccordionSummary-root MuiAccordionSummary-gutters eywhccn4 rivian-css-e8s9ej" tabindex="0" role="button" aria-expanded="false" aria-controls="AccordionBody-I replaced the part prior to receiving notice about a vehicle recall. Do I still need to have the recall repairs done?" data-testid="accordion-header-button" id="AccordionHeader-I replaced the part prior to receiving notice about a vehicle recall. Do I still need to have the recall repairs done?" aria-describedby="AccordionBody-I replaced the part prior to receiving notice about a vehicle recall. Do I still need to have the recall repairs done?"><div class="MuiAccordionSummary-content MuiAccordionSummary-contentGutters rivian-css-s2q1rt"><div class="rivian-css-w6gvpm"> <!-- -->I replaced the part prior to receiving notice about a vehicle recall. Do I still need to have the recall repairs done?</div></div><div class="MuiAccordionSummary-expandIconWrapper rivian-css-blenjp"><div class="rivian-css-1c384yj"><svg class="active" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12H18" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></div></div><div style="height:0px;overflow:hidden"><div><div role="region" class="MuiAccordion-region"><div class="MuiAccordionDetails-root rivian-css-cakxzu" role="region" id="AccordionBody-I replaced the part prior to receiving notice about a vehicle recall. Do I still need to have the recall repairs done?" aria-labelledby="AccordionHeader-I replaced the part prior to receiving notice about a vehicle recall. Do I still need to have the recall repairs done?" aria-hidden="true"><div class="rivian-css-jj1wa eywhccn5"><p class="text-body-base">You should schedule an appointment through Rivian Service to ensure that the repair addresses the recall concern. In order to see if you’re eligible for a reimbursement, contact Rivian Service by phone at <a href="tel:+1-855-748-4265" class="underline-interact"><u>(855) RIVIAN5</u></a> or by email at <a href="mailto:recallreimbursement@rivian.com" class="underline-interact"><u>recallreimbursement@rivian.com</u></a>.</p></div></div></div></div></div></div></div></div></main></article></div><div id="contact"></div><div style="width:100%"></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"data":{"consumerNavbarConfig":{"primaryItems":[{"cards":[{"type":"vehicle","actions":[{"id":"r1s-design-yours","href":"/configurations/builder?MODEL=R1S","label":"Design yours","variant":"primary"},{"id":"r1s-explore","href":"/r1s","label":"Explore","variant":"ghost"}],"vehicleImage":{"id":"R1S Nav","alt":"R1S","version":3,"src":"https://media.rivian.com/rivian-main/image/upload/f_auto/q_auto:eco/v1784751463/orange-lily/nav/01-vehicles/R1S_GLOBAL_NAV_SB_F3Q_v06_20260401.png?_a=BAMAMifk0"},"hoverImage":{"id":"R1S Hover","alt":"R1S","version":3,"src":"https://media.rivian.com/rivian-main/image/upload/f_auto/q_auto:eco/v1784751463/orange-lily/nav/01-vehicles/20250619_Dustin_Aksland_Quad_Tahoe_2530-Final.jpg?_a=BAMAMifk0"},"vehicleImg":{"id":"R1S Nav","publicId":"orange-lily/nav/01-vehicles/R1S_GLOBAL_NAV_SB_F3Q_v06_20260401","alt":"R1S","options":{"domain":"media.rivian.com","cloudName":"rivian-main","version":"3"}},"hoverImg":{"id":"R1S Hover","publicId":"orange-lily/nav/01-vehicles/20250619_Dustin_Aksland_Quad_Tahoe_2530-Final","alt":"R1S","options":{"domain":"media.rivian.com","cloudName"
