tle":"Maintenance"},{"slug":"recall-information","title":"Recall Information"},{"slug":"collision-centers","title":"Collision Centers"},{"slug":"authorized-service-providers","title":"Authorized Service Providers"}]}},{"slug":"warranty","title":"Warranty","menuItems":{"items":[]}},{"slug":"insurance","title":"Insurance","menuItems":{"items":[]}},{"slug":"lease-end","title":"Lease-end","menuItems":{"items":[]}},{"slug":"support-documents","title":"Support documents","menuItems":{"items":[{"slug":"vehicle-docs","title":"Vehicle"},{"slug":"warranty-docs","title":"Warranty"},{"slug":"charging-docs","title":"Charging"},{"slug":"adventure-gear-docs","title":"Adventure Gear"},{"slug":"fleet-docs","title":"Fleet"}]}}]}},{"slug":"company","title":"Company","icon":{"url":"https://images.ctfassets.net/2md5qhoeajym/UrCUKY2LVrim6VhqSMFQJ/e28b4151429c66d67c4b3cf75fb1d6ea/company.svg"},"menuItems":{"items":[{"slug":"who-we-are","title":"Who we are","menuItems":{"items":[]}},{"slug":"careers","title":"Careers","menuItems":{"items":[]}},{"slug":"privacy","title":"Privacy","menuItems":{"items":[{"slug":"vehicle-privacy","title":"Vehicle Privacy"},{"slug":"charging-privacy","title":"Charging Privacy"},{"slug":"mobile-app-privacy","title":"Mobile App Privacy"},{"slug":"web-and-other-interactions-privacy","title":"Web and Other Interactions Privacy"}]}}]}}]},"faq":{"kbSection":{"__typename":"KbFaqSectionCollection","items":[{"title":"Recall FAQs","linkTitle":"Recall FAQs","hideFaqSlugs":null,"backgroundHexColor":null,"copyHexColor":null,"faqs":{"items":[{"title":"Recall FAQs","slug":"recall-faq-info","showFullArticleOnExpand":null,"articles":{"items":[{"title":"How do I know if my vehicle has a recall?","slug":"vehicle-know-recall","articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian will notify affected vehicle owners by mail for safety and noncompliance recalls and campaigns. The notification will provide details on the issue and give instructions on what to do. You can also visit ","nodeType":"text"},{"data":{"uri":"https://www.NHTSA.gov/recalls"},"content":[{"data":{},"marks":[{"type":"underline"}],"value":" NHTSA.gov/recalls","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":" and use your Vehicle Identification Number (VIN) to see if there are any open recalls on your vehicle.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"content":null,"category":{"kbCategoryCollection":{"items":[]}}},{"title":"My vehicle is involved in a recall. Do I need a recall notification to have the repair done?","slug":"vehicle-involved-recall","articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"A recall notification isn’t required to repair your vehicle. Schedule an appointment to have the repair completed at no cost to you through Rivian Service.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"content":null,"category":{"kbCategoryCollection":{"items":[]}}},{"title":"Where do I go to get my vehicle repaired if I have a recall?","slug":"vehicle-repaired-recall","articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Please contact ","nodeType":"text"},{"data":{},"marks":[],"value":"Rivian Service","nodeType":"text"},{"data":{},"marks":[],"value":" to find out if the repair can be completed with Mobile Service or if you’ll need to schedule an appointment with a Service Center. ","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"content":null,"category":{"kbCategoryCollection":{"items":[]}}},{"title":"Will alternate transportation be provided while the recall repair is being done?","slug":"vehicle-alternate-transportation","articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Service will determine if you're eligible for alternate transportation while the recall repair is being completed.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"content":null,"category":{"kbCategoryCollection":{"items":[]}}},{"title":"What is the warranty on a repair if the recalled component fails again?","slug":"warranty-repair-fail","articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"If the subsequent issue is related to a previous recall, your vehicle will be repaired again at no cost to you.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"content":null,"category":{"kbCategoryCollection":{"items":[]}}},{"title":"I replaced the part prior to receiving notice about a vehicle recall. Do I still need to have the recall repairs done?","slug":"receiving-notice-vehicle-recall","articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"You should schedule an appointment through Rivian Service to ensure that the repair addresses the recall concern. In order to see if you’re eligible for a reimbursement, contact Rivian Service by phone at ","nodeType":"text"},{"data":{"uri":"tel:+1-855-748-4265"},"content":[{"data":{},"marks":[{"type":"underline"}],"value":"(855) RIVIAN5","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":" or by email at ","nodeType":"text"},{"data":{"uri":"mailto:recallreimbursement@rivian.com"},"content":[{"data":{},"marks":[{"type":"underline"}],"value":"recallreimbursement@rivian.com","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":".","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"content":null,"category":{"kbCategoryCollection":{"items":[]}}}]}}]}}]}},"articles":[{"slug":"recall-information-article","title":"Recall Information","content":null,"category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":{"title":"Rivian Vehicle Recall Information - Rivian Support","description":"Find comprehensive recall information for Rivian vehicles. Learn about current recalls, affected models, and steps to take if your vehicle is impacted.","image":null},"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"If your Rivian is ever affected by a recall, Rivian Service will address the issue at no cost to you as part of your ","nodeType":"text"},{"data":{"uri":"https://rivian.com/support/article/new-vehicle-limited-warranty-guide"},"content":[{"data":{},"marks":[],"value":"New Vehicle Limited Warranty.","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":" See our list of recalls initiated since 05/10/2022 below or search recall notices using your Rivian Vehicle Identification Number (VIN) or model and year. Last updated on {lastUpdatedDate}.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":null},{"slug":"safety-recall-01212026","title":"Improperly Secured Seat Belt Retractor Assemblies","content":"2022-2026 Rivian R1S and R1T - Issued 01/15/2026  \n\n###### R1 Improperly Secured Seat Belt Retractor Assemblies\n__NHTSA Recall No. 26V-009__   \n__Rivian Recall No. FSAM-1795__  \n__Transport Canada Recall No 2026-009__  \nRecall Status: Remedy Available 01/21/26","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety exists in certain model year 2022-2026 Rivian R1 vehicles.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What Is the problem? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian has determined that on certain R1T and R1S vehicles, the seat belt retractor bolt for the second-row driver and/or passenger side seat belt retractor may not have been properly installed during the vehicle manufacturing process. This condition may cause inadequate attachment of one or both of the outboard second-row seat belts during loading.\nAn improperly secured seat belt retractor may not adequately restrain the seat occupant during seat belt loading, increasing the risk of injury. Rivian is not aware of any accidents or injuries related to this issue.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian will inspect and, if necessary, properly secure the seat belt retractor assembly in any affected vehicles free of charge.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What should you do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center at your earliest convenience. The estimated recall service time should take less than an hour to complete, please plan accordingly. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["fsam-1795","2022","2023","2024","2025","2026","r1t","r1s"]},{"slug":"safety-recall-01082026","title":"Toe Link Joint May Separate","content":"2022-2025 Rivian R1S and R1T - Issued 01/05/2026  \n\n###### R1 Toe Link Joint May Separate\n__NHTSA Recall No. 26V-003__   \n__Rivian Recall No. FSAM-1794__  \n__Transport Canada Recall No 2026-002__  \nRecall Status: Remedy Available 01/08/26","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety exists in certain model year 2022-2025 Rivian R1 vehicles.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What is the problem? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian has determined that on certain R1 vehicles, toe link joints reassembled during vehicle service with a service procedure before March 10, 2025, may result in a joint that is not reassembled to design intent and could experience unintended forces. \n\nIn certain cases, if a toe link was serviced using the earlier service procedure, vehicle motion may eventually cause toe link joint separation. Separation of the toe link while the vehicle is being driven increases the risk of a crash without prior warning. Rivian is aware of one single-vehicle accident with alleged minor injuries related to this issue. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian will replace any potentially affected rear toe link bolts on the potentially affected vehicles using its updated service procedure free of charge.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What should you do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center at your earliest convenience. The estimated recall service time should take less than an hour to complete, please plan accordingly. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["fsam-1794","2022","2023","2024","2025","r1t","r1s"]},{"slug":"safety-recall-12032025","title":"EDV Seat Belt Misuse","content":"2022-2025 Rivian EDV - Issued 11/18/2025  \n\n###### EDV Seat Belt Misuse\n__NHTSA Recall No. 25V-816__   \n__Rivian Recall No. FSAM-1770__   \nRecall Status: Remedy Available 12/03/25","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety exists in certain model year 2022-2025 Rivian EDV vehicles.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What Is the problem? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian has determined that on certain EDV vehicles the driver side seat belt pretensioner may be damaged from repeated misuse, such as from the driver sitting on the seatbelt while it is buckled underneath the driver.\n\nA seat belt pretensioner cable damaged by repeated misuse may not adequately restrain the seat occupant during a crash, increasing the risk of injury. To date, Rivian is not aware of any accidents or injuries related to this condition.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian has released an over-the-air update that enables automatic detection of any seatbelt misuse by the driver. In addition, Rivian will inspect and, as necessary, replace the driver's seat belt pretensioner assembly in the affected vehicles free of charge.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What should you do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Please call 1.855.RIVB2B1 (1.855.748.2221) to schedule the recall service repair at your earliest convenience. The estimated recall service time should take less than an hour to complete, please plan accordingly. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2022","2023","2024","2025","edv","fsam-1770"]},{"slug":"safety-recall-09122025","title":"ADAS OTA 2025.18.30","content":"2025 Rivian R1S and R1T - Issued 09/08/2025  \n\n###### R1 ADAS OTA 2025.18.30\n__NHTSA Recall No. 25V-585__   \n__Rivian Recall No. FSAM-1744__  \n__Transport Canada Recall No 2025-461__  \nRecall Status: Remedy Available 09/12/25","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety exists in certain model year 2025 Rivian R1S and R1T vehicles.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What Is the problem? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian has determined that certain R1T and R1S vehicles in the U.S. and Canada were built with a version of Advanced Driver Assistance System (“ADAS”) before Software Version 2025.18.30. In one instance before software version 2025.18.30, a 2025 R1S was involved in a field incident in which Highway Assist experienced a one-time functional limitation due to a misclassification at a very low speed. The driver failed to maintain continuous and sustained responsibility for vehicle operation.\n\nWhen a SAE Level 2 advanced driver assistance-system experiences a functional limitation and the vehicle is not controlled by the driver, there may be an increased risk of a crash. Rivian is not aware of any injuries related to this issue.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian implemented software update (2025.18.30) on June 03, 2025 that remedied this condition. As of the date of this filing, software versions 2025.18.30 or later are already installed on more than 99% of potentially affected vehicles.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What should you do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"If you have not already updated to software version 2025.18.30 or later, please do so to remedy this issue at no cost to you.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2025","r1t","r1s","fsam-1744"]},{"slug":"safety-recall-08262025","title":"Improperly Tightened Ground Connection May Cause a Loss of Drive Power","content":"2025 Rivian R1S and R1T - Issued 08/21/2025  \n\n###### R1 Improperly Tightened Ground Connection May Cause a Loss of Drive Power\n__NHTSA Recall No. 25V-537__   \n__Rivian Recall No. FSAM-1723__   \nRecall Status: Remedy Available 08/26/25","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety exists in certain model year 2025 Rivian R1S and R1T vehicles.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What Is the problem? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian has determined that certain R1T and R1S vehicles may have been built with an improperly grounded connection inside the High Voltage Distribution Box (HVDB). An improperly grounded electrical connection inside the HVDB may cause the vehicle to experience a loss of motive power without prior warning. A loss of motive power without prior warning may increase the risk of a crash. To date, Rivian is not aware of any accidents or injuries related to this condition.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian will inspect and repair the HVDB ground strap joint on the potentially affected vehicles or replace the high voltage battery pack free of charge.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What should you do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center at your earliest convenience. The length of time your vehicle will be in service for this recall, will be communicated to you upon Service calling for appointment confirmation. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2025","r1t","r1s","fsam-1723"]},{"slug":"safety-recall-06132025","title":"Turn Signal Inoperative","content":"2025 Rivian R1S and R1T - Issued 06/11/2025  \n\n###### R1 Turn Signal Inoperative\n__NHTSA Recall No. 25V-387__   \n__Rivian Recall No. FSAM-1693__  \n__Transport Canada Recall No 2025-314__  \nRecall Status: Remedy Not Available 06/13/25","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Automotive, LLC has decided that certain model year 2025 Rivian R1S and R1T vehicles fail to conform to Federal Motor Vehicle Safety Standard (FMVSS) 108 and Technical Standards Document (TSD) 108 - “Lamps, reflective devices, and assoc. equipment.”  ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What Is the problem? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"One or both front turn signal lamps may not illuminate and flash due to issues during manufacturing from a supplier, and, therefore, may not fulfill the requirements of FMVSS 108 and TSD-108. Diminished front turn signal lamp performance may cause reduced awareness of the vehicle’s intent to turn for road users in front of the vehicle. Reduced awareness of intent to turn may increase the risk of a crash. Rivian is not aware of any crashes, injuries, or fatalities related to this condition. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian will replace one or both front turn signal lamps on the affected vehicles free of charge. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What should you do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center immediately. The length of time your vehicle will be in service for this recall, will be communicated to you upon Service calling for appointment confirmation. In the meantime, if your vehicle exhibits these signs, we encourage you to contact our service support team at 1-855-748-4265 to schedule an appointment. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2025","r1t","r1s","fsam-1693"]},{"slug":"safety-recall-06052025","title":"Seat Belt D-Ring","content":"2022-2025 Rivian R1S and R1T - Issued 06/03/2025  \n\n###### R1 Seat Belt D-Ring\n__NHTSA Recall No. 25V-370__   \n__Rivian Recall No. FSAM-1681__  \n__Transport Canada Recall No 2025-305__  \nRecall Status: Remedy Available 06/06/25","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety exists in certain model year 2022-2025 Rivian R1S and R1T vehicles.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What Is the problem? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian has determined that on certain R1T and R1S vehicles, an anchorage for the front driver and/or passenger seat belt may not have been properly installed during the vehicle manufacturing process.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"An improperly secured seat belt anchor may not adequately restrain the seat occupant during a crash, increasing the risk of injury. To date, Rivian is not aware of any crashes, injuries, or fatalities related to this condition.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian will inspect and, as necessary, properly secure the seat belt assembly anchorage in the affected vehicles free of charge.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What should you do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center at your earliest convenience. The estimated recall service time should take about an hour to complete, please plan accordingly.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2022","2023","2024","2025","r1s","r1t","fsam-1681"]},{"slug":"safety-recall-02212025","title":"Headlamp Performance in Cold Weather","content":"2025 Rivian R1S and R1T - Issued 02/13/2025  \n\n###### R1 Headlamp Performance in Cold Weather\n__NHTSA Recall No. 25V-085__   \n__Rivian Recall No. FSAM-1612__  \n__Transport Canada Recall No 2025-073__  \nRecall Status: Remedy Available 09/22/25\n","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Automotive, LLC has decided that certain model year 2025 Rivian R1S and R1T vehicles fail to conform to Federal Motor Vehicle Safety Standard (FMVSS) 108 and Technical Standards Document (TSD) 108 - “Lamps, reflective devices, and assoc. equipment.”","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What Is the problem? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"One or more headlamps, when operated in cold temperature conditions, may not illuminate at vehicle startup due to incorrectly configured parts from a supplier and may not fulfill the requirements of FMVSS 108 and TSD 108 - “Lamps, reflective devices, and assoc. equipment.” Diminished lighting performance may cause reduced visibility in certain conditions. Reduced visibility may increase the risk of a crash. Rivian is not aware of any accidents or injuries related to this condition.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian will replace one or both headlamp control modules on the affected vehicles free of charge.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What should you do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center immediately. The length of time your vehicle will be in service for this recall, will be communicated to you upon Service calling for appointment confirmation. In the meantime, if your vehicle exhibits these signs, we encourage you to contact our service support team at 1-855-748-4265 to schedule an appointment.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2025","r1t","r1s","fsam-1612"]},{"slug":"safety-recall-11132024","title":"Deactivated Exterior Lighting","content":"2025 Rivian R1S and R1T - Issued 11/01/2024  \n\n###### R1 Deactivated Exterior Lighting\n__NHTSA Recall No. 24V-827__   \n__Rivian Recall No. FSAM-1552__  \n__Transport Canada Recall No 2024-672__  \nRecall Status: Remedy Available 11/13/24\n","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety exists in certain model year 2025 Rivian R1S and R1T vehicles.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What Is the problem? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Certain exterior vehicle lighting may have been unavailable during vehicle operation if the Car Costume feature was activated after the vehicle had entered the “Ready” state. Diminished lighting performance may cause reduced visibility in certain conditions. Reduced visibility may increase the risk of a crash. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian disabled the feature at issue in affected vehicles and implemented a new software update (2024.39.31) that remedies this condition and re-enables the Car Costume feature. All impacted vehicles were remedied on the same day, October 18, 2024, that the issue was identified. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What should you do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"No action is required. All impacted vehicles were remedied with an over-the-air software update on the same day, October 18, 2024, that the issue was identified. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2025","r1t","r1s","fsam-1552"]},{"slug":"safety-recall-09182024","title":"Steering Column Control Module Missing Cruise Markings","content":"2025 Rivian R1S - Issued 09/06/2024  \n\n###### R1S Steering Column Control Module Missing Cruise Markings\n__NHTSA Recall No. 24V-686__   \n__Rivian Recall No. FSAM-1532__  \nRecall Status: Remedy Available 09/18/24","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Automotive, LLC has decided that certain model year 2025 Rivian R1S vehicles fail to comply with Federal Motor Vehicle Safety Standard (FMVSS) 101- “Controls and Displays” which requires that “Each control for an automatic vehicle speed system (cruise control)...must have identification provided for each function of each such system.” Our records show that you are the owner of a vehicle affected by this condition. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What Is the problem? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian has decided that certain model year 2025 Rivian R1S vehicles may fail to comply with Federal Motor Vehicle Safety Standard No. 101 “Controls and Displays”. These vehicles may have been manufactured with steering column control modules that were missing cruise control system markings due to a supplier error. Rivian is not aware of any crashes, injuries, or fatalities related to this condition.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian will inspect potentially affected vehicles and replace the SCCMs that are missing cruise control markings, if any, at no cost to owners. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What should you do? ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center at your earliest convenience. The estimated recall service time should take less than an hour to complete, please plan accordingly. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2025","r1s","fsam-1532"]},{"slug":"safety-recall-062524","title":"Incorrect Weight on Tire Placard Label","content":"2022-2023 Rivian R1S and R1T - Issued 06/20/2024  \n\n###### R1 Incorrect Weight on Tire Placard Label\n__NHTSA Recall No. 24V-458__    \n__Rivian Recall No. FSAM-1491__  \nRecall Status: Remedy Available 06/25/24","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Automotive, LLC has determined that certain model year 2022-2023 Rivian R1S and R1T vehicles fail to conform to Federal Motor Vehicle Safety Standard (FMVSS) No. 110 – Tire Selection and Rims. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What Is the problem?  ","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Federal Motor Vehicle Safety Standard (“FMVSS”) 571.110 (S4.3) - Placard, requires that \"each vehicle shall show...(a) vehicle capacity weight expressed as \"the combined weight of occupants and cargo should never exceed XXX kilograms or XXX pounds.\" Subject vehicles are equipped with a tire placard label that does not correctly define the max vehicle capacity weight. \n\nA driver may rely on the incorrect payload capacity and overload the vehicle, which can cause a vehicle crash without prior warning. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do?  ","nodeType":"text"},{"data":{},"marks":[],"value":"\n","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian will mail the correct tire placard overlay labels to customers.   ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"What should you do? ","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"You may choose to apply the enclosed overlay label using the instruction as described in the recall customer letter you will receive in the mail. Or if you prefer not to install the label yourself, simply contact Rivian Service Support at 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center at your earliest convenience to have the label installed free of charge. The estimated repair time should take less than an hour to complete. Please bring the overlay label and the recall customer letter you received in the mail with you to your Service Center.\n\n","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2022","2023","r1t","r1s","fsam-1491"]},{"slug":"safety-recall-061424","title":"Replace Upper B-Pillar and/or C-Pillar Trim Panels","content":"2022-2024 Rivian R1S and R1T - Issued 06/05/2024  \n\n###### R1 Replace Upper B-Pillar and/or C-Pillar Trim Panels\n__NHTSA Recall No. 24V-408__  \n__Transport Canada Recall No. 2024-318__  \n__Rivian Recall No. FSAM-1464__  \nRecall Status: Remedy Available 06/14/24","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety exists in certain model year 2022-2024 Rivian R1S and R1T vehicles.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What Is the problem?  ","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"The upper pillar trim panel(s) may have been removed and then reused instead of being removed and replaced with a brand-new component. Removal and reuse may result in damage to the attachment clip(s) that secure the trim panel to the pillar. For R1T only the upper B-pillars are potentially impacted. For R1S the upper B and/or C-pillars are potentially impacted. \n\nDamaged upper B and/or C pillar trim panel attachment clip(s) may result in an improper side air bag inflatable curtain deployment, which may increase the risk of occupant injury during rollover and side impact crashes. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do?  ","nodeType":"text"},{"data":{},"marks":[],"value":"\n","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian will remove the potentially affected pillar trim panel(s) and replace them with new parts at no cost to owners. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"What should you do? ","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"You should already have received a call from Rivian Service Support to schedule your recall service appoinment. If for some reason you do not already have an appointment, please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center immediately. The estimated recall service time should take less than two hours to complete, please plan accordingly. \n\n","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2022","2023","2024","r1t","r1s","fsam-1464"]},{"slug":"safety-recall-053124","title":"Headlight Aiming","content":"2023-2024 Rivian R1S, R1T and EDV - Issued 05/23/2024  \n\n###### R1 and EDV Headlight Aiming\n__NHTSA Recall No. 24V-367__  \n__Transport Canada Recall No. 2024-292__  \n__Rivian Recall No. FSAM-1445__  \nRecall Status: Remedy Available 05/31/24","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Automotive, LLC has decided that certain model year 2023-2024 Rivian R1S, R1T, and EDV vehicles fail to conform to Federal Motor Vehicle Safety Standard FMVSS 108 (Lamp, reflective devices and associated equipment - §571.108 S10.14.6). ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What Is the problem?  ","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian has determined that on certain model year 2023 and 2024 R1T, R1S, and EDV vehicles the headlamps are aimed slightly too low and do not meet current production specifications or fulfill the requirements of FMVSS 108 (Lamp, reflective devices and associated equipment - §571.108 S10.14.6). Headlamps that are not aimed properly can result in insufficient illumination of the road while driving, which may increase the risk of a crash while driving at night. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do?  ","nodeType":"text"},{"data":{},"marks":[],"value":"\n","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian will check the headlamp adjustment on the affected vehicles and correct it, if necessary.   ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"What should you do? ","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center at your earliest convenience. The estimated recall service time should take less than an hour to complete, please plan accordingly.  ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2023","2024","r1t","r1s","edv","fsam-1445"]},{"slug":"safety-recall-051424","title":"Dashboard Air Bag Label","content":"2024 Rivian R1S and R1T- Issued 05/09/2024  \n\n###### R1 Dashboard Air Bag Label\n__NHTSA Recall No. 24V-319__    \n__Rivian Recall No. FSAM-1429__  \nRecall Status: Remedy Available 05/14/24","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Automotive, LLC has decided that certain model year 2024 Rivian R1S and R1T vehicles fail to confirm to Federal Motor Vehicle Safety Standard (FMVSS) No. 208 – Occupant Crash Protection.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What Is the problem?  ","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Federal Motor Vehicle Safety Standard (\"FMVSS\") 571.208 Occupant crash protection states, \"Vehicles certified to meet the requirements specified in S19, S21, and S23 on or after December 1, 2003, that are equipped with an inflatable restraint for the passenger position shall have a label attached to a location on the dashboard or the steering control hub that is visible from all front seating positions. The label need not be permanently affixed to the vehicle.\" Some vehicles built during the suspect period were not equipped with the required label.  \n\nIf a dashboard air bag warning label is missing, the occupant may not be aware of the risks a deploying air bag may pose to an infant or child occupying the front passenger seat.  ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"What should you do? ","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian requests that you read and understand the following air bag warning label information provided with the letter however no further action on your behalf is required.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2024","r1t","r1s","fsam-1429"]},{"slug":"safety-recall-021224","title":"R1 Daytime Running Lamps Noncompliance`","content":"2022-2024 Rivian R1S and R1T - Issued 02/08/2024  \n\n###### R1 Daytime Running Lamps Noncompliance\n__Transport Canada Recall No. 2024-077__  \n__Rivian Recall No. FSAM-1385__  \nRecall Status: Remedy Available 02/12/24","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Automotive, LLC has decided that certain model year 2022-2024 Rivian R1S and R1T vehicles fail to conform with Canadian Motor Vehicle Safety Standard No. 108 “Lighting Systems and Reflective Devices.”","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What is the problem?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"The affected vehicles were built with daytime running lamps that do not comply with regulatory visibility requirements. If the daytime running lamps are switched off manually by setting the lighting mode to the “parking” setting, the daytime running lights will not reactivate automatically. When the vehicle is operated in the “parking” lights mode, the lamps used as daytime running lamps will illuminate. However, the brightness is not sufficiently bright to meet the requirements of daytime running lamps. This noncompliance may affect visibility and potentially increase the risk of a crash. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"\nDayime running lamps are on when driving with the vehicle in the “auto” lighting mode. Leaving the lights in this mode, as they are by default, will minimize the safety risk.  \n","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian will update the software of the affected vehicles through an over-the-air update (2024.03.02) that will ensure daytime running lamps are reactivated automatically when the vehicle speed goes above 10km/h. The recall service will be available at no cost to you.  ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What should you do?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian has already implemented a new software update (2024.03.02). As of February 12, 2024 this software will be available on your vehicle, please install this software update 2024.03.02 at your earliest convenience. Software update should take an hour to complete. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2022","2023","2024","r1t","r1s","fsam-1385"]},{"slug":"safety-recall-01032024","title":"Replace Accelerator Pedal","content":"2022 Rivian R1S \u0026 R1T - Issued 12/21/23  \n\n###### Replace Accelerator Pedal\n__NHTSA Recall No. 23V-883__  \n__Rivian Recall No. FSAM-1342__  \nRecall Status: Remedy Available 01/02/2024","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety existed in certain model year 2022 Rivian R1S and R1T vehicles that were built with an early revision accelerator pedal. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What Is the problem?  ","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"The accelerator pedal may not detect when the driver releases the pedal in hot cabin temperatures, failing to activate \"auto-hold\" or \"park\" as intended.  If this occurs, the vehicle may not automatically go into “auto-hold” or “park”. This condition may cause the vehicle to creep forward. If this occurs, the driver will be required to take other action to place the vehicle into “hold” or “park”, such as depressing the brake pedal and/or pressing the “park” button.  If the vehicle does not automatically go into “auto-hold” or \"park”, this may increase the risk of a crash.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do?  ","nodeType":"text"},{"data":{},"marks":[],"value":"\n","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian has already implemented a new software update (2023.46.01 or 2023.50).  Software update should take an hour to complete.   ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian will also replace all subject accelerator pedals, free of charge.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"What should you do? ","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"At your earliest convenience, install software update 2023.46.01. \n \nRivian’s Service Support Team will contact you by end of February, 2024 once we’re ready to schedule your pedal replacement appointment. \n\n","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2022","r1t","r1s","fsam-1342"]},{"slug":"safety-recall-11282023","title":"2023.42 OTA","content":"2022-2023 Rivian R1S \u0026 R1T - Issued 11/21/23 \n\n###### 2023.42 OTA\n__NHTSA Recall No. 23V-783__  \n__Rivian Recall No. FSAM-1331__  \nRecall Status: Remedy Available 11/15/23","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Automotive, LLC has decided that a defect which relates to motor vehicle safety existed in certain model year 2022 – 2023 Rivian R1S and R1T vehicles. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What is the problem?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"On the affected vehicles that installed over-the-air (OTA) software update 2023.42.0 on November 13, 2023, in-vehicle defroster system controls and functionality may have been temporarily unavailable during vehicle operation. Diminished windshield defrost performance may cause reduced visibility in certain conditions, increasing the risk of a crash.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian implemented software update 2023.42.02, on November 15, 2023, that restored in-vehicle defroster system controls and functionality to affected vehicles. This update was installed on all affected vehicles by November 19, 2023.   ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What should you do?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"No action is required. Rivian has confirmed that your vehicle has already installed software update 2023.42.02, which remedied the condition.  ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2022","2023","r1t","r1s","fsam-1331"]},{"slug":"safety-recall-052623","title":"Backup Lamps","content":"2022-2023 Rivian R1S - Issued 03/31/23  \n\n###### Backup Lamps\n__NHTSA Recall No. 23V-233__  \n__Rivian Recall No. FSAM-1216__  \nRecall Status: Remedy Available 07/12/23","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian has decided that certain model year 2022-2023 R1S vehicles fail to conform with Federal Motor Vehicle Safety Standard No. 108 “Lamps, Reflective Devices, and Associated Equipment.” ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What is the problem?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"The affected vehicles were built with backup lamps that do not comply with regulatory visibility requirements.  When the vehicle is in reverse, the back-up lamps will illuminate. However, the optical center may not be visible from the specified planes. This noncompliance may affect visibility and potentially increase the risk of a crash. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian will replace the backup lamps that do not meet regulatory visibility requirements. The recall service will be available at no cost to you.     ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What should you do?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Please call 1-855-748-4265 to schedule the recall service repair with your Rivian Service Center immediately. The estimated recall service time should take less than an hour to complete, please plan accordingly. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2022","2023","r1s","fsam-1216"]},{"slug":"safety-recall-02242023","title":"Passenger Air Bag May Not Deploy Properly","content":"2022 Rivian R1T \u0026 R1S - Issued 02/22/23  \n\n###### Passenger Air Bag May Not Deploy Properly\n__NHTSA Recall No. 23V-109__  \n__Rivian Recall No. FSAM-1166__  \nRecall Status: Remedy Available 02/28/23","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian has decided that certain model year 2022 R1S and R1T vehicles fail to conform with Federal Motor Vehicle Safety Standard No. 208 “Occupant Crash Protection.”","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What is the problem?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"On a very small percentage of vehicles, a sensor in the front passenger seat belt system may incorrectly report its status as \"on\" when, in fact, it is off. Since the system may not register the status correctly, it may cause the passenger air bag not to deploy as intended.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian will offer no appointment necessary visits to Rivian Service Centers and pop-up locations up to 6  days a week to inspect and replace, if necessary, passenger seat belt system components in the affected vehicles. Impacted owners may also choose to schedule a service appointment.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What should you do?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian Service Centers and pop-up service locations that will offer expanded hours of operation and inspections without an appointment are listed ","nodeType":"text"},{"data":{"uri":"https://rivian.com/support/article/where-can-i-take-my-rivian-to-get-the-front-passenger-seat-belt-sensor-inspected"},"content":[{"data":{},"marks":[],"value":"here","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":". Before your visit, please install the latest software update to your vehicle.If you have questions or would prefer to schedule an appointment, you can also call our Service Team at 855-748-4265.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2022","r1t","r1s","fsam-1166"]},{"slug":"safety-recall-10072022","title":"Steering Knuckle and Control Arm May Separate","content":"2022 Rivian R1T, R1S \u0026 EDV - Issued 10/06/22\n\n###### Steering Knuckle and Control Arm May Separate\n__NHTSA Recall No. 22V-744__  \n__Rivian Recall No. FSAM-997__  \nRecall Status: Remedy Available 10/07/22","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian has decided that a defect which relates to motor vehicle safety exists in certain model year 2022 Rivian R1T, R1S, and EDV vehicles. The subject population is comprised of model year 2022 R1T and R1S vehicles built during a 13-month period, and a subset of EDVs produced between December 10, 2021 and September 27, 2022, in which records cannot confirm that the front upper control arm and the steering knuckle retention fastener for each front wheel was sufficiently torqued.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What is the problem?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"An insufficiently torqued steering knuckle fastener could cause excessive wheel camber, or, in rare instances, a separation, affecting the driver’s ability to control the vehicle, and increasing the risk of a crash.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian will offer Mobile Service appointments, no appointment needed visits to Rivian Service Centers or pop-up service locations, and prioritized appointments at Rivian Service Centers to inspect and, as necessary, sufficiently secure the steering knuckle fasteners for the affected vehicles. For the very small percentage where parts replacements are required, loaner vehicles will be made available while the vehicle is brought into a Rivian Service Center. The recall service and as needed, trip interruption, and towing services will be available at no cost to you.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What should you do?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"If you have further questions, please call Rivian Service at ","nodeType":"text"},{"data":{"uri":"tel:18557484265"},"content":[{"data":{},"marks":[],"value":"1-855-748-4265","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":"","nodeType":"text"},{"data":{"uri":"tel:855-748-4265"},"content":[{"data":{},"marks":[],"value":".","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":" For additional information please visit our ","nodeType":"text"},{"data":{"uri":"https://rivian.com/support/article/where-can-i-take-my-rivian-to-get-the-upper-control-arm-fastener-inspected-and-f"},"content":[{"data":{},"marks":[],"value":"Support Center","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":". The official recall notice will be posted by the National Highway Traffic Safety Administration (","nodeType":"text"},{"data":{"uri":"https://www.nhtsa.gov/campaign/safercargov"},"content":[{"data":{},"marks":[],"value":"NHTSA","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":") on October 8, 2022.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2022","r1t","r1s","edv","fsam-997"]},{"slug":"safety-recall-9302022","title":"Improperly Secured Front Seat Belt Anchor","content":"2022 Rivian R1T \u0026 R1S - Issued 08/25/22  \n\n###### Improperly Secured Front Seat Belt Anchor\n__NHTSA Recall No. 22V-641__  \n__Rivian Recall No. FSAM-924__  \nRecall Status: Remedy Available 09/30/22\n","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian has decided that a defect which relates to motor vehicle safety exists in certain model year 2022 Rivian R1T and R1S vehicles. Some of the population may have been built with suspect seat belt assembly anchorage installations.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What is the problem?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"The front seat belt anchors may have been inadequately attached to the B-pillar. An improperly secured seat belt anchor may not adequately restrain the seat occupant during a crash, increasing the risk of injury.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What will Rivian do?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Your Rivian Mobile Service Technician or Rivian Service Center will inspect and, as necessary, properly secure the seat belt anchorage in the affected vehicles free of charge.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"What should you do?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Please call 1-855-748-4265 to schedule the recall service repair immediately. The estimated recall service time will be approximately 1 hour, please plan accordingly.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2022","r1t","r1s","fsam-924"]},{"slug":"safety-recall-51022","title":"Improperly Calibrated Front Passenger Seat OCS","content":"2022 Rivian R1T - Issued 05/10/22\n\n###### Improperly Calibrated Front Passenger Seat OCS\n__NHTSA Recall No. 22V-319__  \n__Rivian Recall No. FSAM-651__  \nRecall Status: Remedy Available 05/10/22","category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Rivian has decided that certain model year 2022 Rivian R1T vehicles fail to conform with Federal Motor Vehicle Safety Standard No. 208 “Occupant Crash Protection”.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"What is the problem?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"If a child seat or a child is seated in the front passenger seat, the passenger air bag may not be deactivated as required. In the event of a crash which deploys the front passenger air bag, the infant in the child seat or child occupant may have an increased risk of injury.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"What will Rivian do?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Your Rivian Mobile Service Technician or Rivian Service Center will replace the front passenger seat, free of charge, in your vehicle.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"What should you do?","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Please call 1-855-748-4265 to schedule the recall service repair immediately. The estimated recall service time will be approximately 1.5 hours, please plan accordingly. For the time being, you should not seat children 12 and under or use child seats in the front passenger seat of the vehicle.\n\n","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"If you have further questions, or want to verify the accuracy of this information, please call Rivian Service Support at 1-855-748-4265. For additional information please visit our Support Center.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":["2022","r1t","fsam-651"]},{"slug":"schedule-repair-info","title":"If you received a recall notice:","content":null,"category":{"kbCategoryCollection":{"items":[{"slug":"recall-information"}]}},"sharingMetadata":null,"articleContent":{"json":{"data":{},"content":[{"data":{"target":{"sys":{"id":"20yTo5HMWhghSXqAwzpSab","type":"Link","linkType":"Asset"}}},"content":[],"nodeType":"embedded-asset-block"},{"data":{},"content":[{"data":{},"marks":[],"value":"If your Rivian is affected by a recall, you'll be contacted when your vehicle is ready to be repaired. If you have questions, contact our Rivian Service Support Team at ","nodeType":"text"},{"data":{"uri":"tel:+1-855-748-4265"},"content":[{"data":{},"marks":[{"type":"underline"}],"value":"(855) RIVIAN5","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":".","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}},"keywords":null}],"slug":"recall-information","pageMetadata":{"navTheme":"light-section"},"strings":{"CURRENT_RECALLS":"Current Recalls","LOADING_TEXT":"Loading...","VIN_SEARCH":"VIN","MODEL_YEAR_SEARCH":"Model/Year","VIN_PLACEHOLDER":"Search by VIN","VIN_SEARCH_BUTTON":"VIN_SEARCH_BUTTON","SELECT_MODEL":"Select model","SELECT_YEAR":"Select year","MODEL_R1T":"R1T","MODEL_R1S":"R1S","OPEN_RECALLS_COUNT":"{count} Open Recalls associated with this VIN","RESOLVED_RECALLS_COUNT":"{count} Resolved Recalls associated with this VIN","RECALLS_FOUND_COUNT":"{count} Recalls found","NO_RECALLS_FOUND":"No current recalls","CLEAR_BUTTON":"Clear","SEARCH_BUTTON":"Search"}},"pageProps":{"pageViewData":{"supportArticleL1":"ownership","supportArticleL2":"service","supportArticleL3":"recall-information"}},"locale":"en-US"},"__N_SSG":true},"page":"/support/article/recall-information","query":{},"buildId":"1c38d825c4c651e499b2ff6a2ab3bf627fb7e24b-2722280803","assetPrefix":"/.next-1c38d825c4c651e499b2ff6a2ab3bf627fb7e24b-2722280803","isFallback":false,"isExperimentalCompile":false,"gsp":true,"locale":"en-US","locales":["en-US","en-CA","fr-CA","en-GB","en-BE","en-CH","en-DE","en-NL","fr-FR","fr-BE","fr-CH","nl-BE","nl-NL","de-AT","de-CH","de-DE","it-IT","it-CH","es-ES","sv-SE","da-DK"],"defaultLocale":"en-US","scriptLoader":[]}</script><div id="modal-root"></div><div id="toast-root"></div><div id="portal-root"></div></body></html>
